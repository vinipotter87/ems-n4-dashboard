// ── Helpers ──────────────────────────────────────────────────────

function _mtzBuildReps(mes, dados, linha) {
  var reps = (dados.reps || []).filter(function(r){
    if (r.vago === 'True' || r.vago === true) return false;
    if (linha && r.linha !== linha) return false;
    var mdv = safeFloat(r.prod);
    return mdv !== null;
  });

  // Cota ating% por rep: soma de prodRep
  var repProd = (dados.prodRepNex||[]).concat(dados.prodRepVit||[]);
  var atMap   = {};
  repProd.forEach(function(p){
    var sid = p.setor_id;
    if (!atMap[sid]) atMap[sid] = {c:0, r:0};
    atMap[sid].c += safeFloat(p.cota)      || 0;
    atMap[sid].r += safeFloat(p.realizado) || 0;
  });

  // Mapa distrito → nome abreviado
  var distMap = {};
  (dados.distritos||[]).forEach(function(d){ distMap[d.distrito_id] = d.ab || d.nm; });

  return reps.map(function(r){
    var pr  = atMap[r.setor_id];
    var at  = (pr && pr.c > 0) ? pr.r / pr.c * 100 : null;
    return Object.assign({}, r, {
      _mdv:  safeFloat(r.prod),
      _at:   at,
      _dist: distMap[r.distrito_id] || r.distrito_id || '—',
      etapa: getJornadaRep(r.setor_id, r.nome),
    });
  });
}

// ── YTD: agrega todos os meses ponderando dias trabalhados ────────

function _mtzBuildRepsYtd(meses, linha) {
  var agg = {}; // setor_id → {base, mdvW, diasW, cotaC, realC, distName}

  meses.forEach(function(mes) {
    var dados = DADOS_CACHE[mes] || {};
    var reps  = (dados.reps || []).filter(function(r){
      return r.vago !== 'True' && r.vago !== true && safeFloat(r.prod) !== null;
    });
    if (linha) reps = reps.filter(function(r){ return r.linha === linha; });

    var repProd = (dados.prodRepNex||[]).concat(dados.prodRepVit||[]);
    var atMap   = {};
    repProd.forEach(function(p){
      var sid = p.setor_id;
      if (!atMap[sid]) atMap[sid] = {c:0, r:0};
      atMap[sid].c += safeFloat(p.cota)      || 0;
      atMap[sid].r += safeFloat(p.realizado) || 0;
    });

    var distMap = {};
    (dados.distritos||[]).forEach(function(d){ distMap[d.distrito_id] = d.ab || d.nm; });

    reps.forEach(function(r){
      var mdv  = safeFloat(r.prod);
      var dias = safeFloat(r.dias_trabalhados) || 1;
      var pr   = atMap[r.setor_id] || {c:0, r:0};
      var dn   = distMap[r.distrito_id] || r.distrito_id || '—';
      if (!agg[r.setor_id]) {
        agg[r.setor_id] = {base: r, mdvW:0, diasW:0, cotaC:0, realC:0, distName: dn};
      }
      var a = agg[r.setor_id];
      a.base     = r;       // mantém dados do mês mais recente
      a.mdvW    += mdv * dias;
      a.diasW   += dias;
      a.cotaC   += pr.c;
      a.realC   += pr.r;
      a.distName = dn;
    });
  });

  return Object.keys(agg).map(function(sid){
    var a   = agg[sid];
    var r   = a.base;
    var mdv = a.diasW > 0 ? a.mdvW / a.diasW : null;
    var at  = a.cotaC > 0 ? a.realC / a.cotaC * 100 : null;
    return Object.assign({}, r, {
      _mdv:  mdv,
      _at:   at,
      _dist: a.distName,
      etapa: getJornadaRep(r.setor_id, r.nome),
    });
  });
}

function _mtzQuad(r) {
  var hi  = r._mdv >= _mtzThrMdv;
  var ok  = r._at !== null && r._at >= _mtzThrAt;
  if (hi  && ok)  return 0; // Estrela
  if (!hi && ok)  return 1; // Eficiente
  if (hi  && !ok) return 2; // Esforçado
  return 3;                  // Crítico
}

var _MTZ_QUADS = [
  {icon:'⭐', label:'ESTRELA',    cls:'mtz-q-star',  desc:'Alto MDV · Entrega cota',       bg:'rgba(21,128,61,.75)',  bd:'#15803d', fill:'rgba(21,128,61,.07)'},
  {icon:'💡', label:'EFICIENTE',  cls:'mtz-q-efic',  desc:'Baixo MDV · Entrega cota',      bg:'rgba(37,99,235,.75)', bd:'#2563eb', fill:'rgba(37,99,235,.07)'},
  {icon:'⚠',  label:'ESFORÇADO', cls:'mtz-q-esfor', desc:'Alto MDV · Não entrega cota',   bg:'rgba(217,119,6,.75)', bd:'#d97706', fill:'rgba(245,158,11,.07)'},
  {icon:'🔴', label:'CRÍTICO',    cls:'mtz-q-crit',  desc:'Baixo MDV · Não entrega cota',  bg:'rgba(185,28,28,.75)', bd:'#b91c1c', fill:'rgba(185,28,28,.07)'},
];

// ── Scatter chart ─────────────────────────────────────────────

function _mtzBuildChart(reps) {
  var el = document.getElementById('mtz-chart'); if (!el) return;
  if (_mtzChart) { _mtzChart.destroy(); _mtzChart = null; }

  var buckets = [[], [], [], []];
  reps.forEach(function(r){ buckets[_mtzQuad(r)].push(r); });

  var datasets = _MTZ_QUADS.map(function(q, i){
    return {
      label:           q.icon + ' ' + q.label + ' (' + buckets[i].length + ')',
      data:            buckets[i].map(function(r){ return {x: r._at !== null ? r._at : 0, y: r._mdv, rep: r}; }),
      backgroundColor: q.bg,
      borderColor:     q.bd,
      borderWidth: 1.5,
      pointRadius: 9,
      pointHoverRadius: 12,
    };
  });

  // Plugin: pinta quadrantes e desenha linhas de corte
  var thrMdv = _mtzThrMdv, thrAt = _mtzThrAt;
  var quadPlugin = {
    id: 'mtzQuad',
    beforeDraw: function(chart) {
      var ctx = chart.ctx, xa = chart.scales.x, ya = chart.scales.y;
      var xT = xa.getPixelForValue(thrAt),   yT = ya.getPixelForValue(thrMdv);
      var L  = chart.chartArea.left,          R  = chart.chartArea.right;
      var T  = chart.chartArea.top,           B  = chart.chartArea.bottom;
      ctx.save();
      // Quadrantes
      ctx.fillStyle = _MTZ_QUADS[2].fill; ctx.fillRect(L,  T,  xT-L, yT-T); // Esforçado TL
      ctx.fillStyle = _MTZ_QUADS[0].fill; ctx.fillRect(xT, T,  R-xT, yT-T); // Estrela TR
      ctx.fillStyle = _MTZ_QUADS[3].fill; ctx.fillRect(L,  yT, xT-L, B-yT); // Crítico BL
      ctx.fillStyle = _MTZ_QUADS[1].fill; ctx.fillRect(xT, yT, R-xT, B-yT); // Eficiente BR
      // Linhas de corte
      ctx.strokeStyle = 'rgba(100,100,100,.3)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(xT, T); ctx.lineTo(xT, B); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(L, yT); ctx.lineTo(R, yT); ctx.stroke();
      ctx.setLineDash([]);
      // Labels dos quadrantes
      ctx.font = '700 9.5px Inter,sans-serif'; ctx.fillStyle = 'rgba(80,80,80,.55)';
      ctx.fillText('⭐ ESTRELA',    xT+7,  T+14);
      ctx.fillText('⚠ ESFORÇADO',  L+7,   T+14);
      ctx.fillText('💡 EFICIENTE',  xT+7,  B-7);
      ctx.fillText('🔴 CRÍTICO',    L+7,   B-7);
      ctx.restore();
    }
  };

  _mtzChart = new Chart(el.getContext('2d'), {
    type: 'scatter',
    data: {datasets: datasets},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: {display:true, position:'top', labels:{boxWidth:11, font:{size:11}, padding:12}},
        tooltip: {
          backgroundColor: 'rgba(17,24,39,.95)',
          titleFont:{size:12,weight:'700'}, bodyFont:{size:11},
          padding:12, cornerRadius:10,
          callbacks: {
            title: function(items){
              var r = items[0] && items[0].raw && items[0].raw.rep;
              return r ? (r.nome || r.setor_id) : '';
            },
            label: function(item){
              var r = item.raw.rep; if (!r) return '';
              return [
                '  Distrito: ' + (r._dist||'—') + '  ·  ' + (r.linha||''),
                '  MDV: '    + (r._mdv!==null ? r._mdv.toFixed(1)+'%' : '—'),
                '  Q1: ' + _mtzPct(r.q1) + '   Q2: ' + _mtzPct(r.q2) + '   Q3: ' + _mtzPct(r.q3) + '   Q4: ' + _mtzPct(r.q4),
                '  Cob. Painel: ' + _mtzPct(r.cob_painel),
                '  Ating. Cota: ' + (r._at!==null ? r._at.toFixed(1)+'%' : '—'),
              ];
            }
          }
        }
      },
      scales: {
        x: {
          title:{display:true, text:'Atingimento de Cota (%)', font:{size:11,weight:'600'}},
          min:0, max:200,
          grid:{color:'#f0f0f0'},
          ticks:{callback:function(v){return v+'%';}, font:{size:10}}
        },
        y: {
          title:{display:true, text:'MDV % (Atividade)', font:{size:11,weight:'600'}},
          min:0, max:130,
          grid:{color:'#f0f0f0'},
          ticks:{callback:function(v){return v+'%';}, font:{size:10}}
        }
      }
    },
    plugins: [quadPlugin]
  });
}

// ── Cards por quadrante ───────────────────────────────────────

function _mtzBuildCards(reps) {
  var buckets = [[], [], [], []];
  reps.forEach(function(r){ buckets[_mtzQuad(r)].push(r); });

  // Ordenação: Estrela/Eficiente → melhor cota primeiro; Esforçado/Crítico → pior cota primeiro
  [0,1].forEach(function(i){ buckets[i].sort(function(a,b){ return (b._at||0)-(a._at||0); }); });
  [2,3].forEach(function(i){ buckets[i].sort(function(a,b){ return (a._at||0)-(b._at||0); }); });

  return '<div class="mtz-cards-grid">' +
    _MTZ_QUADS.map(function(q, i){
      var cards = buckets[i].map(function(r){
        return '<div class="mtz-rep-card">' +
          '<div class="mtz-rep-name" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
            '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (r.nome || r.setor_id || '—') + '</span>' +
            jornadaBadge(r.etapa || 'Start') +
          '</div>' +
          '<div class="mtz-rep-dist">' + (r._dist||'—') + ' · ' + (r.linha||'') + '</div>' +
          '<div class="mtz-rep-metrics">' +
            _mtzMetric('MDV',         r._mdv!==null ? r._mdv.toFixed(1)+'%' : '—', cotaPctClass(r._mdv)) +
            _mtzMetric('Q1',          _mtzPct(r.q1)) +
            _mtzMetric('Q2',          _mtzPct(r.q2)) +
            _mtzMetric('Q3',          _mtzPct(r.q3)) +
            _mtzMetric('Q4',          _mtzPct(r.q4)) +
            _mtzMetric('Cota',        r._at!==null ? r._at.toFixed(1)+'%' : '—', cotaPctClass(r._at)) +
          '</div>' +
        '</div>';
      }).join('');

      return '<div class="mtz-quad-col ' + q.cls + '">' +
        '<div class="mtz-quad-hdr">' +
          '<span class="mtz-q-icon">' + q.icon + '</span>' +
          '<div><div class="mtz-q-label">' + q.label + '</div>' +
          '<div class="mtz-q-desc">' + q.desc + '</div></div>' +
          '<div class="mtz-q-count">' + buckets[i].length + '</div>' +
        '</div>' +
        '<div class="mtz-quad-body">' +
          (cards || '<div class="mtz-q-empty">Nenhum rep neste quadrante</div>') +
        '</div>' +
      '</div>';
    }).join('') +
  '</div>';
}

function _mtzMetric(lbl, val, cls) {
  return '<div class="mtz-metric">' +
    '<span class="mtz-mlbl">' + lbl + '</span>' +
    '<span class="mtz-mval ' + (cls||'') + '">' + val + '</span>' +
  '</div>';
}

function _mtzPct(v) {
  var f = safeFloat(v);
  return f !== null ? f.toFixed(1)+'%' : '—';
}

// ── Controles interativos ──────────────────────────────────────

// ── Correlação MDV × Cota ─────────────────────────────────────────

function _mtzCalcRegression(reps) {
  var pts = reps.filter(function(r){ return r._mdv !== null && r._at !== null; });
  var n = pts.length;
  if (n < 3) return null;
  var sx=0, sy=0, sxy=0, sx2=0, sy2=0;
  pts.forEach(function(p){
    sx  += p._mdv; sy  += p._at;
    sxy += p._mdv * p._at;
    sx2 += p._mdv * p._mdv;
    sy2 += p._at  * p._at;
  });
  var denom = Math.sqrt((n*sx2 - sx*sx) * (n*sy2 - sy*sy));
  var R  = denom > 0 ? (n*sxy - sx*sy) / denom : 0;
  var R2 = R * R;
  var b  = (n*sx2 - sx*sx) !== 0 ? (n*sxy - sx*sy) / (n*sx2 - sx*sx) : 0;
  var a  = (sy - b*sx) / n;
  var xs = pts.map(function(p){ return p._mdv; });
  return { R: R, R2: R2, a: a, b: b, n: n,
           minX: Math.min.apply(null,xs), maxX: Math.max.apply(null,xs) };
}

function _mtzCorrInterpret(R2) {
  if (R2 >= 0.64) return {txt:'Correlação forte',    cor:'#15803d', ico:'📈'};
  if (R2 >= 0.36) return {txt:'Correlação moderada', cor:'#d97706', ico:'📊'};
  if (R2 >= 0.09) return {txt:'Correlação fraca',    cor:'#b91c1c', ico:'📉'};
  return              {txt:'Sem correlação',          cor:'#6b7280', ico:'➖'};
}

function _mtzCorrSection(reps) {
  var reg = _mtzCalcRegression(reps);
  if (!reg) return '<div class="mtz-p-loading">Dados insuficientes para calcular correlação (mínimo 3 reps com MDV e Cota).</div>';
  var intp = _mtzCorrInterpret(reg.R2);
  var r2pct = (reg.R2 * 100).toFixed(1);
  var rVal  = (Math.abs(reg.R)).toFixed(2);
  return '<div class="mtz-corr-stats">' +
    '<div class="mtz-r2-big" style="color:' + intp.cor + '">' + r2pct + '%</div>' +
    '<div class="mtz-r2-info">' +
      '<div class="mtz-r2-label">R² — Coeficiente de Determinação</div>' +
      '<div class="mtz-r2-interp" style="color:' + intp.cor + '">' + intp.ico + ' ' + intp.txt + ' (R = ' + rVal + ')</div>' +
      '<div class="mtz-r2-sub">MDV explica <strong>' + r2pct + '%</strong> da variação no atingimento de cota &nbsp;·&nbsp; ' + reg.n + ' reps analisados</div>' +
    '</div>' +
  '</div>' +
  '<div class="mtz-scatter-wrap"><canvas id="mtz-corr-chart"></canvas></div>';
}

function _mtzBuildCorrChart(reps) {
  var el = document.getElementById('mtz-corr-chart'); if (!el) return;
  if (_mtzCorrChart) { _mtzCorrChart.destroy(); _mtzCorrChart = null; }
  var reg = _mtzCalcRegression(reps);
  var buckets = [[], [], [], []];
  reps.filter(function(r){ return r._mdv!==null && r._at!==null; })
      .forEach(function(r){ buckets[_mtzQuad(r)].push(r); });
  var datasets = _MTZ_QUADS.map(function(q,i){
    return {
      label: q.icon+' '+q.label+' ('+buckets[i].length+')',
      data:  buckets[i].map(function(r){ return {x:r._mdv, y:r._at, rep:r}; }),
      backgroundColor: q.bg, borderColor: q.bd,
      borderWidth:1.5, pointRadius:9, pointHoverRadius:12,
    };
  });
  if (reg) {
    datasets.push({
      type:'line', label:'Tendência (y='+reg.b.toFixed(2)+'x+'+(reg.a.toFixed(1))+')',
      data:[{x:reg.minX-2, y:reg.a+reg.b*(reg.minX-2)}, {x:reg.maxX+2, y:reg.a+reg.b*(reg.maxX+2)}],
      borderColor:'rgba(100,100,100,.55)', borderDash:[7,4],
      borderWidth:2, pointRadius:0, fill:false, order:-1,
    });
  }
  _mtzCorrChart = new Chart(el.getContext('2d'), {
    type:'scatter', data:{datasets:datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:true, position:'top', labels:{boxWidth:11,font:{size:11},padding:12}},
        tooltip:{
          backgroundColor:'rgba(17,24,39,.95)',
          titleFont:{size:12,weight:'700'}, bodyFont:{size:11},

  VIEW_ATUAL = 'gap';

function _renderGapMapSec(meses) {
  return '<div class="gap-section">' +
    '<div class="gap-sec-hdr"><span class="gap-sec-icon">📊</span>' +
    '<span class="gap-sec-title">Mapa de Gap por Produto — mês a mês</span></div>' +

      '<button class="gap-tab gap-tab-nex active" id="gm-nex" onclick="gapMapSwitch(\'NEXUS\')">NEXUS</button>' +

    '</div>' +

}

function gapMapSwitch(linha) {
  _gapLinha = linha;
  document.getElementById('gm-nex').className = 'gap-tab gap-tab-nex' + (linha === 'NEXUS' ? ' active' : '');
  document.getElementById('gm-vit').className = 'gap-tab gap-tab-vit' + (linha === 'VITAL' ? ' active' : '');
  document.getElementById('gap-map-content').innerHTML = _buildGapTable(_gapMeses, linha);
}

function _buildGapTable(meses, linha) {
  // Produtos: union de todos os meses
  var prodSet = {};
  meses.forEach(function(m){
    var d = DADOS_CACHE[m]; if (!d) return;
    var arr = linha === 'NEXUS' ? (d.prodNex||[]) : (d.prodVit||[]);
    arr.forEach(function(r){ if (r.produto) prodSet[normProd(r.produto)] = r.produto; });
  });

  // Calcular gap YTD por produto para ordenar (pior primeiro)
  var prods = Object.keys(prodSet);
  prods.sort(function(a, b){
    var ga = 0, gb = 0;
    meses.forEach(function(m){
      ga += getRealProd(m, a, linha) - getCotaProd(m, a, linha);
      gb += getRealProd(m, b, linha) - getCotaProd(m, b, linha);
    });
    return ga - gb; // mais negativo primeiro
  });

  var html = '<div class="cota-table-wrap"><table class="cota-table">';
  // Cabeçalho
  html += '<thead><tr><th class="th-label" rowspan="2">Produto</th>';
  meses.forEach(function(m){ html += '<th class="th-mes-hdr" colspan="2">' + m + '</th>'; });
  html += '<th class="th-ytd-hdr" colspan="2">YTD</th></tr><tr>';
  meses.forEach(function(){ html += '<th class="th-sub">Ating%</th><th class="th-sub">Gap R$</th>'; });
  html += '<th class="th-sub-ytd">Ating%</th><th class="th-sub-ytd">Gap R$</th></tr></thead><tbody>';

  // Linha de total
  html += _gapTotalRow(meses, linha);

  // Linhas por produto
  prods.forEach(function(pn){
    var pNome = prodSet[pn];
    var isMC  = isMarcaChave(pn, linha);
    var ytdC = 0, ytdR = 0;
    html += '<tr class="row-prod' + (isMC ? ' row-prod-chave' : '') + '">';
    html += '<td class="td-label">' + pNome + (isMC ? '<span class="mc-badge">★</span>' : '') + '</td>';
    meses.forEach(function(m, i){
      var c = getCotaProd(m, pn, linha), r = getRealProd(m, pn, linha);
      var pct = c > 0 ? r/c*100 : null;
      var gap = r - c; ytdC += c; ytdR += r;
      var sep = i === 0 ? '' : 'td-mes-sep';
      html += '<td class="' + sep + ' ' + cotaPctClass(pct) + '">' + (pct !== null ? pct.toFixed(1)+'%' : '—') + '</td>';
      html += '<td class="gap-val ' + (c > 0 ? (gap>=0?'gap-pos':'gap-neg') : '') + '">' +
        (c > 0 ? _fmtGap(gap) : '—') + '</td>';
    });
    var yp = ytdC > 0 ? ytdR/ytdC*100 : null;
    var yg = ytdR - ytdC;
    html += '<td class="td-ytd ' + cotaPctClass(yp) + '">' + (yp !== null ? yp.toFixed(1)+'%' : '—') + '</td>';
    html += '<td class="td-ytd gap-val ' + (ytdC>0?(yg>=0?'gap-pos':'gap-neg'):'') + '">' + (ytdC>0?_fmtGap(yg):'—') + '</td>';
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

function _gapTotalRow(meses, linha) {
  var ytdC = 0, ytdR = 0;
  var html = '<tr class="row-total"><td class="td-label">Total ' + linha + '</td>';
  meses.forEach(function(m, i){
    var c = getCotaReg(m, linha), r = getRealReg(m, linha);
    var pct = c > 0 ? r/c*100 : null;
    var gap = r - c; ytdC += c; ytdR += r;
    var sep = i === 0 ? '' : 'td-mes-sep';
    html += '<td class="' + sep + ' ' + cotaPctClass(pct) + '">' + (pct !== null ? pct.toFixed(1)+'%' : '—') + '</td>';
    html += '<td class="gap-val ' + (gap>=0?'gap-pos':'gap-neg') + '">' + _fmtGap(gap) + '</td>';
  });
  var yp = ytdC > 0 ? ytdR/ytdC*100 : null;
  var yg = ytdR - ytdC;
  html += '<td class="td-ytd ' + cotaPctClass(yp) + '">' + (yp !== null ? yp.toFixed(1)+'%' : '—') + '</td>';
  html += '<td class="td-ytd gap-val ' + (yg>=0?'gap-pos':'gap-neg') + '">' + _fmtGap(yg) + '</td>';
  html += '</tr>';
  return html;
}

function _fmtGap(v) {
  var abs = Math.abs(v);
  var s   = v >= 0 ? '+' : '-';
  if (abs >= 1e6)  return s + 'R$ ' + (abs/1e6).toFixed(2)  + 'M';
  if (abs >= 1e3)  return s + 'R$ ' + Math.round(abs/1e3).toLocaleString('pt-BR') + 'k';
  return s + 'R$ ' + Math.round(abs).toLocaleString('pt-BR');
}

      '<div class="gap-ctrl-group"><label class="gap-ctrl-label">Linha</label>' +
        '<div class="gap-tabs" style="margin:0">' +
          '<button class="gap-tab gap-tab-nex active" id="out-nex" onclick="outSwitchLinha(\'NEXUS\')">NEXUS</button>' +

      '</div>' +
      '<div class="gap-ctrl-group"><label class="gap-ctrl-label">Filtrar abaixo de</label>' +
        '<select id="out-thr" class="gap-select" onchange="outUpdate()">' +
          '<option value="200" selected>Todos os reps</option>' +
          '<option value="100">Abaixo de 100%</option>' +
          '<option value="90">Abaixo de 90%</option>' +
          '<option value="80">Abaixo de 80%</option>' +
          '<option value="60">Abaixo de 60%</option>' +
        '</select>' +
      '</div>' +
    '</div>' +
    '<div id="out-content">' + _buildOutlierTable('NEXUS', _outProd, _outMes, 200) + '</div>' +
  '</div>';
}

function _gapProdOpts(linha, meses) {
  var set = {};
  meses.forEach(function(m){
    var d = DADOS_CACHE[m]; if (!d) return;
    var arr = linha === 'NEXUS' ? (d.prodNex||[]) : (d.prodVit||[]);
    arr.forEach(function(r){ if (r.produto) set[normProd(r.produto)] = r.produto; });
  });
  // Ordenar por gap YTD (pior primeiro)
  var list = Object.keys(set).map(function(k){
    var gc = 0, gr = 0;
    meses.forEach(function(m){ gc += getCotaProd(m,k,linha); gr += getRealProd(m,k,linha); });
    return {norm: k, nome: set[k], gap: gr - gc};
  });
  list.sort(function(a,b){ return a.gap - b.gap; });
  return list;
}

function outSwitchLinha(linha) {
  _outLinha = linha;
  document.getElementById('out-nex').className = 'gap-tab gap-tab-nex' + (linha==='NEXUS'?' active':'');
  document.getElementById('out-vit').className = 'gap-tab gap-tab-vit' + (linha==='VITAL'?' active':'');
  var opts = _gapProdOpts(linha, _gapMeses);
  var sel  = document.getElementById('out-prod');
  sel.innerHTML = opts.map(function(p){ return '<option value="'+p.norm+'">'+p.nome+'</option>'; }).join('');
  _outProd = opts.length ? opts[0].norm : null;
  outUpdate();
}

function outUpdate() {
  _outMes  = document.getElementById('out-mes').value;
  _outProd = document.getElementById('out-prod').value;
  _outThr  = parseFloat(document.getElementById('out-thr').value);
  document.getElementById('out-content').innerHTML = _buildOutlierTable(_outLinha, _outProd, _outMes, _outThr);
}

function _buildOutlierTable(linha, prodNorm, mes, thr) {
  var d = DADOS_CACHE[mes];
  if (!d) return '<p style="color:var(--gray);padding:12px 0">Dados não disponíveis para ' + mes + '.</p>';

  var repArr = (linha === 'NEXUS' ? (d.prodRepNex||[]) : (d.prodRepVit||[]));

  var rows = repArr
    .filter(function(r){ return prodNorm && normProd(r.produto) === normProd(prodNorm); })
    .map(function(r){
      var c  = safeFloat(r.cota)      || 0;
      var rl = safeFloat(r.realizado) || 0;
      var at = c > 0 ? rl/c*100 : null;
      var vago = r.vago === 'True' || r.vago === true ||
                 (typeof r.nome === 'string' && r.nome.toUpperCase().includes('VAGO'));
      return Object.assign({}, r, {_c:c, _r:rl, _at:at, _vago:vago});
    })
    .filter(function(r){ return r._at === null || r._at < thr; });

  if (!rows.length) {
    var thrLbl = thr >= 200 ? 'nenhum rep' : 'nenhum rep abaixo de ' + thr + '%';
    return '<div class="outlier-empty">✅ ' + (thr >= 200 ? 'Sem dados para este produto em ' + mes : 'Nenhum rep abaixo de ' + thr + '% em ' + mes) + '</div>';
  }

  // Ordenar: não-vagos primeiro, depois por ating% asc
  rows.sort(function(a,b){
    if (a._vago !== b._vago) return a._vago ? 1 : -1;
    if (a._at === null) return 1;
    if (b._at === null) return -1;
    return a._at - b._at;
  });

  var ativos = rows.filter(function(r){ return !r._vago; }).length;
  var vagos  = rows.filter(function(r){ return r._vago; }).length;
  var totalGap = rows.filter(function(r){ return !r._vago; })
                     .reduce(function(s,r){ return s + (r._r - r._c); }, 0);

  var summary = '<div class="outlier-summary">';
  if (ativos > 0)
    summary += '<span class="outlier-count-ativo">⚠ ' + ativos + ' rep' + (ativos!==1?'s':'') + ' abaixo do threshold</span>';
  else
    summary += '<span class="outlier-count-ok">✅ Todos os reps ativos acima do threshold</span>';
  if (vagos > 0)
    summary += '<span class="outlier-count-vago">⬜ ' + vagos + ' vaga' + (vagos!==1?'s':'') + '</span>';
  if (ativos > 0)
    summary += '<span style="font-size:11px;color:var(--gray)">Gap acumulado dos reps ativos: <strong style="color:#b91c1c">' + _fmtGap(totalGap) + '</strong></span>';
  summary += '</div>';

  var html = summary + '<div class="cota-table-wrap"><table class="cota-table">';
  html += '<thead><tr>' +
    '<th class="th-label">Rep</th>' +
    '<th class="th-label">Distrito / GD</th>' +
    '<th class="th-sub">Cota</th>' +
    '<th class="th-sub">Realizado</th>' +
    '<th class="th-sub">Ating%</th>' +
    '<th class="th-sub">Gap R$</th>' +
  '</tr></thead><tbody>';

  rows.forEach(function(r){
    var gap    = r._r - r._c;
    var atStr  = r._at !== null ? r._at.toFixed(1)+'%' : '—';
    var atCls  = r._vago ? '' : cotaPctClass(r._at);
    var gapStr = r._c > 0 ? _fmtGap(gap) : '—';
    var gapCls = r._c > 0 ? (gap >= 0 ? 'gap-pos' : 'gap-neg') : '';
    var nome   = r._vago ? ('⬜ Vaga — ' + (r.setor_id||'')) : (r.nome || r.setor_id || '—');
    var dist   = r.distrito_id ? (_gapDistritos[r.distrito_id] || r.distrito_id) : '—';
    html += '<tr class="row-dist' + (r._vago ? ' outlier-vago' : '') + '">' +
      '<td class="td-label">' + nome + '</td>' +
      '<td class="td-label" style="font-size:11px;color:var(--gray)">' + dist + '</td>' +
      '<td>' + fmtBRL(r._c) + '</td>' +
      '<td>' + fmtBRL(r._r) + '</td>' +
      '<td class="' + atCls + '">' + atStr + '</td>' +
      '<td class="gap-val ' + gapCls + '">' + gapStr + '</td>' +
    '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}
