<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMS | Dashboard N4 — Nexus & Vital</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--red:#C8102E;--red-d:#8B0B1F;--red-l:#fce8ec;--orange:#E87722;--orange-l:#FFF3E0;
--nexus:#1A3A6B;--nexus-l:#EEF2FA;--green:#15693A;--green-l:#E8F5EE;
--yellow:#9C6D00;--yellow-l:#FFF7E0;--dark:#111827;--gray:#6B7280;
--light:#F3F4F6;--border:#E5E7EB;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#ECEDF0;color:var(--dark);min-height:100vh}
.hdr{background:linear-gradient(135deg,var(--red-d),var(--red) 55%,#D93050);position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.25)}
.hdr-inner{display:flex;align-items:center;padding:12px 28px;gap:16px}
.logo{background:#fff;padding:4px 10px;border-radius:6px;font-size:20px;font-weight:900;color:var(--red);letter-spacing:-1px}
.hdr-sep{width:1px;height:36px;background:rgba(255,255,255,.2)}
.hdr-text h1{color:#fff;font-size:15px;font-weight:700}
.hdr-text p{color:rgba(255,255,255,.65);font-size:11px;margin-top:2px}
.hdr-pills{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.hpill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.hpill.hi{background:#fff;color:var(--red)}
.cycle-bar{background:#fff;border-bottom:1px solid var(--border);padding:8px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cycle-btn{padding:6px 18px;border-radius:8px;border:2px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--gray);font-family:inherit;transition:all .15s}
.cycle-btn.active{border-color:var(--red);color:var(--red);background:var(--red-l)}
.cycle-btn:hover:not(.active){border-color:#ccc;color:var(--dark)}
.main{padding:22px 28px;max-width:1440px;margin:0 auto}

/* Loading */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loading-spinner{width:48px;height:48px;border:4px solid var(--red-l);border-top:4px solid var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:14px;font-weight:600;color:var(--gray)}

/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 6px rgba(0,0,0,.06);border-top:3px solid var(--border)}
.kpi.r{border-top-color:var(--red)}.kpi.n{border-top-color:var(--nexus)}.kpi.g{border-top-color:var(--green)}.kpi.o{border-top-color:var(--orange)}
.kpi-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--gray);font-weight:600;margin-bottom:5px}
.kpi-val{font-size:22px;font-weight:800;line-height:1}.kpi-sub{font-size:10px;color:#aaa;margin-top:4px}

/* Section header */
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.sec-line{flex:1;height:1px;background:var(--border)}
.badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
.badge.n{background:var(--nexus-l);color:var(--nexus);border:1px solid #C0CDEA}
.badge.v{background:var(--red-l);color:var(--red);border:1px solid #F0B0BC}

/* District cards */
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:12px}
.dcard{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;border:2px solid transparent;box-shadow:0 1px 8px rgba(0,0,0,.07)}
.dcard:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12);border-color:var(--red)}
.dcard.ativo{border-color:var(--red);box-shadow:0 4px 16px rgba(200,16,46,.2)}
.dcard-hd{padding:14px 16px 12px;color:#fff;position:relative}
.nc .dcard-hd{background:linear-gradient(135deg,#152E58,#1A3A6B)}
.vc .dcard-hd{background:linear-gradient(135deg,#7A0A1C,#C8102E)}
.dcard-linha{font-size:9px;font-weight:700;letter-spacing:1.5px;opacity:.7;margin-bottom:3px}
.dcard-nome{font-size:13px;font-weight:700;line-height:1.3}
.dcard-cod{font-size:10px;opacity:.55;margin-top:3px}
.prod-badge{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pb-n{font-size:12px;font-weight:800;color:#fff;line-height:1}.pb-l{font-size:8px;color:rgba(255,255,255,.7);margin-top:1px}
.dcard-body{padding:12px 16px}
.diag{font-size:10px;padding:5px 8px;border-radius:5px;border-left:3px solid;margin-bottom:8px}
.diag.crit{background:var(--red-l);color:var(--red);border-color:var(--red)}
.diag.warn{background:var(--yellow-l);color:var(--yellow);border-color:var(--orange)}
.diag.ok{background:var(--green-l);color:var(--green);border-color:var(--green)}
.dcard-ft{padding:8px 16px;background:var(--light);display:flex;align-items:center;justify-content:space-between;font-size:10px}
.dcard-reps{color:var(--gray);font-weight:600}.dcard-cta{color:var(--red);font-weight:700;font-size:11px}
.jornada-mini{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px}

/* District detail panel */
.distrito-detalhe{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 4px 24px rgba(200,16,46,.15);margin-bottom:20px;display:none;border:2px solid var(--red)}
.distrito-detalhe.open{display:block}
.dd-hdr{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.dd-linha-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;padding:3px 10px;border-radius:20px}
.dd-title{font-size:16px;font-weight:800}
.dd-cod{font-size:11px;color:var(--gray)}
.dd-close{margin-left:auto;cursor:pointer;color:var(--gray);font-size:20px;font-weight:400;background:none;border:1px solid var(--border);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;line-height:1;font-family:inherit;transition:all .15s}
.dd-close:hover{background:var(--red-l);color:var(--red);border-color:var(--red)}
.dd-section-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--gray);margin-bottom:8px;margin-top:16px}
.dd-rep-table{width:100%;border-collapse:collapse;font-size:12px}
.dd-rep-table th{background:var(--light);padding:8px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}
.dd-rep-table td{padding:8px 10px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
.dd-rep-table tr:last-child td{border-bottom:none}
.dd-rep-table tr:hover td{background:#fafafa}

/* Jornada */
.card-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:16px}
.cc-bar{width:4px;height:16px;background:var(--red);border-radius:2px;flex-shrink:0}
.jbadge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700;border:1px solid}
/* Jornada — novo panorama 3 colunas */
.jornada-wrap{margin-bottom:24px}
.jornada-sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.jpanorama{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.jpcol{border-radius:14px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.10);display:flex;flex-direction:column}
/* headers por etapa */
.jpcol-hdr{padding:16px 20px 14px;color:#fff;position:relative}
.jpcol.destaque  .jpcol-hdr{background:linear-gradient(135deg,#064e3b,#059669)}
.jpcol.performance .jpcol-hdr{background:linear-gradient(135deg,#78350f,#d97706)}
.jpcol.start     .jpcol-hdr{background:linear-gradient(135deg,#7f1d1d,#ef4444)}
.jpcol-icon{font-size:22px;margin-bottom:4px}
.jpcol-titulo{font-size:16px;font-weight:800;letter-spacing:.2px}
.jpcol-subtit{font-size:10px;opacity:.75;margin-top:1px;font-weight:500}
.jpcol-count{position:absolute;right:18px;top:16px;text-align:right}
.jpcol-num{font-size:32px;font-weight:900;line-height:1}
.jpcol-label{font-size:9px;opacity:.7;text-transform:uppercase;letter-spacing:.8px}
/* stats row */
.jpcol-stats{display:flex;border-bottom:1px solid var(--border);background:#fff}
.jpcol-stat{flex:1;padding:10px 8px;text-align:center;border-right:1px solid var(--border)}
.jpcol-stat:last-child{border-right:none}
.jpcol-stat-val{font-size:16px;font-weight:800;line-height:1}
.jpcol-stat-lbl{font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
/* lista de reps */
.jpcol-list{flex:1;max-height:320px;overflow-y:auto;background:#fff}
.jpcol-list::-webkit-scrollbar{width:4px}.jpcol-list::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
.jrep2{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid #f5f5f5;gap:10px;transition:background .1s}
.jrep2:hover{background:#fafafa}
.jrep2:last-child{border-bottom:none}
.jrep2-nome{flex:1;font-size:12px;font-weight:600;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jrep2-gd{font-size:10px;color:var(--gray);white-space:nowrap;margin-right:4px}
.jrep2-prod{font-size:12px;font-weight:800;min-width:48px;text-align:right}
/* PEX — 5 colunas de medalhas */
.pex-wrap{margin-bottom:24px}
.pex-panorama{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.pexcol{border-radius:14px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.10);display:flex;flex-direction:column}
.pexcol-hdr{padding:14px 16px 12px;color:#fff;position:relative}
.pexcol.ouro     .pexcol-hdr{background:linear-gradient(135deg,#78570a,#d4a017)}
.pexcol.prata    .pexcol-hdr{background:linear-gradient(135deg,#374151,#6B7280)}
.pexcol.bronze   .pexcol-hdr{background:linear-gradient(135deg,#6B3A1F,#CD7F32)}
.pexcol.atencao  .pexcol-hdr{background:linear-gradient(135deg,#78350f,#f97316)}
.pexcol.critico  .pexcol-hdr{background:linear-gradient(135deg,#7f1d1d,#ef4444)}
.pexcol-icon{font-size:20px;margin-bottom:2px}
.pexcol-titulo{font-size:14px;font-weight:800;letter-spacing:.2px}
.pexcol-count{position:absolute;right:14px;top:12px;text-align:right}
.pexcol-num{font-size:28px;font-weight:900;line-height:1}
.pexcol-label{font-size:8px;opacity:.7;text-transform:uppercase;letter-spacing:.8px}
.pexcol-range{font-size:9px;opacity:.65;margin-top:2px}
.pexcol-list{flex:1;max-height:300px;overflow-y:auto;background:#fff}
.pexcol-list::-webkit-scrollbar{width:4px}.pexcol-list::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
.pexrep{display:flex;align-items:center;padding:7px 12px;border-bottom:1px solid #f5f5f5;gap:8px;transition:background .1s}
.pexrep:hover{background:#fafafa}
.pexrep:last-child{border-bottom:none}
.pexrep-nome{flex:1;font-size:11px;font-weight:600;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pexrep-gd{font-size:10px;color:var(--gray);white-space:nowrap}
.pexrep-pts{font-size:11px;font-weight:800;min-width:40px;text-align:right}
.pex-empty{padding:20px;text-align:center;color:var(--gray);font-size:12px;background:#fff}
/* mini badge para cards de distrito */
.jdist-block{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.jdist-hdr{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--light);cursor:pointer;user-select:none}
.jdist-hdr:hover{background:#e8e9eb}
.jdist-nome{font-size:12px;font-weight:700;flex:1}
.jdist-arrow{font-size:11px;color:var(--gray);transition:transform .2s}
.jdist-arrow.open{transform:rotate(90deg)}
.jdist-body{display:none;padding:8px 0}
.jdist-body.open{display:block}
.jrep-row{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;font-size:12px;border-bottom:1px solid #f5f5f5}
.jrep-row:last-child{border-bottom:none}
.jrep-nome{flex:1;font-weight:500}
.jrep-setor{font-size:10px;color:#bbb;margin-right:10px}

/* Produto atingimento */
.prod-ating-card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 8px rgba(0,0,0,.07);margin-bottom:24px}
.prod-tabs-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ptab{padding:6px 16px;border-radius:8px;border:2px solid var(--border);background:#fff;font-size:11px;font-weight:700;cursor:pointer;color:var(--gray);font-family:inherit;transition:all .15s}
.ptab:hover:not(.active){border-color:#ccc;color:var(--dark)}
.ptab.active{border-color:var(--red);color:var(--red);background:var(--red-l)}
.ptab.linha-nexus.active{border-color:var(--nexus);color:var(--nexus);background:var(--nexus-l)}
.ptab-sep{width:1px;height:28px;background:var(--border);margin:0 4px;align-self:center}
.prod-dist-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pdist-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:11px;font-weight:600;cursor:pointer;color:var(--gray);font-family:inherit;transition:all .12s}
.pdist-btn:hover{border-color:#aaa}
.pdist-btn.active{border-color:var(--nexus);color:var(--nexus);background:var(--nexus-l)}
.prod-table{width:100%;border-collapse:collapse;font-size:12px}
.prod-table th{background:var(--light);padding:8px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);white-space:nowrap}
.prod-table th.r{text-align:right}
.prod-table td{padding:8px 10px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
.prod-table td.r{text-align:right}
.prod-table tr:last-child td{border-bottom:none}
.prod-table tr:hover td{background:#fafafa}
.at-ok{color:var(--green);font-weight:700}
.at-warn{color:var(--yellow);font-weight:700}
.at-crit{color:var(--red);font-weight:700}
.prod-table .prod-nome{font-weight:600}
.prod-empty{text-align:center;padding:32px;color:var(--gray);font-size:13px}

/* Achados */
.achados{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 8px rgba(0,0,0,.07);margin-bottom:24px}
.achado{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:10px;font-size:12px;margin-bottom:8px}
.achado:last-child{margin-bottom:0}
.achado.r{background:#fef2f4;border-left:4px solid var(--red)}.achado.y{background:#fffbf0;border-left:4px solid var(--orange)}
.achado.b{background:#f0f4ff;border-left:4px solid var(--nexus)}.achado.g{background:var(--green-l);border-left:4px solid var(--green)}
.achado-dim{font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;min-width:110px;margin-top:2px}
.achado-txt{color:var(--gray);line-height:1.5}
/* Achados — cards detalhados */
.achado.achado-bloco{flex-direction:column;align-items:stretch}
.achado-titulo{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:3px}
.achado-msg{font-size:11px;color:#777;margin-bottom:12px;padding-left:2px}
.adc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.achado-dist-card{background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.09);border-radius:9px;padding:10px 13px}
.adc-hdr{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.adc-nome{font-size:12px;font-weight:700;color:var(--dark);flex:1}
.adc-reps{font-size:10px;color:var(--gray);font-weight:600;white-space:nowrap}
.adc-metrics{display:flex;gap:16px;flex-wrap:wrap}
.adc-metric{min-width:58px}
.adc-mlbl{font-size:9px;color:#999;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;white-space:nowrap}
.adc-mval{font-size:13px;font-weight:800;color:var(--dark);white-space:nowrap;display:flex;align-items:center;gap:4px}
.adc-delta{font-size:9px;font-weight:600}

/* Chart card */
.chart-card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 8px rgba(0,0,0,.07);margin-bottom:24px}

/* Error state */
.error-card{background:#fff;border-radius:12px;padding:40px;text-align:center;box-shadow:0 1px 8px rgba(0,0,0,.07)}
.error-icon{font-size:48px;margin-bottom:16px}
.error-title{font-size:18px;font-weight:700;color:var(--dark);margin-bottom:8px}
.error-sub{font-size:13px;color:var(--gray)}

/* ── Análise & Alertas ── */
.analise-wrap{margin-bottom:24px}
/* Preview card (no dashboard principal) */
.analise-preview{background:#fff;border-radius:12px;padding:18px 22px;box-shadow:0 1px 8px rgba(0,0,0,.07);margin-bottom:24px;cursor:pointer;border:2px solid transparent;transition:all .18s;display:flex;align-items:center;gap:18px}
.analise-preview:hover{border-color:var(--red);box-shadow:0 4px 20px rgba(200,16,46,.15);transform:translateY(-2px)}
.analise-preview-icon{font-size:36px;flex-shrink:0}
.analise-preview-body{flex:1}
.analise-preview-title{font-size:15px;font-weight:800;color:var(--dark)}
.analise-preview-sub{font-size:11px;color:var(--gray);margin-top:3px}
.analise-preview-alert{font-size:11px;font-weight:600;margin-top:6px}
.analise-preview-cta{font-size:13px;font-weight:800;color:var(--red);white-space:nowrap;flex-shrink:0}
/* Header da página de análise */
.analise-page-hdr{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding:16px 22px;background:#fff;border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.07)}
.analise-back-btn{display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;border:2px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--gray);font-family:inherit;transition:all .15s;white-space:nowrap}
.analise-back-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-l)}
/* Card de evolução mês a mês */
.evo-card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 8px rgba(0,0,0,.07);margin-bottom:14px}
.evo-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.evo-card-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.evo-regional-delta{font-size:13px;font-weight:800;padding:4px 12px;border-radius:20px;background:var(--light)}
.evo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.evo-dist-item{border-radius:10px;padding:12px 14px;border:1px solid var(--border);transition:box-shadow .15s}
.evo-dist-item:hover{box-shadow:0 3px 12px rgba(0,0,0,.09)}
.evo-dist-linha{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:2px}
.evo-dist-nome{font-size:12px;font-weight:700;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evo-dist-prods{font-size:12px;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.evo-dist-delta{font-size:13px;font-weight:800}
/* Card de alertas */
.alertas-card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 8px rgba(0,0,0,.07)}
.alerta-dist-bloco{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px}
.alerta-dist-bloco:last-child{margin-bottom:0}
.alerta-dist-titulo{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--light);border-bottom:1px solid var(--border)}
.alerta-dist-linha{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px}
.alerta-dist-nome{font-size:13px;font-weight:700;flex:1}
.alerta-dist-prod{font-size:13px;font-weight:800}
.alerta-subsec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);padding:6px 14px;background:#fafafa;border-bottom:1px solid #f0f0f0}
.alerta-rep{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #f5f5f5;gap:10px}

<body>

<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-txt" id="loading-txt">Carregando dados…</div>
</div>

<div class="hdr">
  <div class="hdr-inner">
    <div class="logo">EMS</div>
    <div class="hdr-sep"></div>
    <div class="hdr-text">
      <h1>Dashboard N4 — Nexus &amp; Vital</h1>
      <p>Regional SPI OESTE · Cardiometabólico</p>
    </div>
    <div class="hdr-pills">
      <span class="hpill hi" id="pill-mes">—</span>
      <span class="hpill" id="pill-atualizacao">—</span>
    </div>
  </div>
</div>

<div class="cycle-bar" id="cycle-bar">
  <!-- Botões de mês injetados dinamicamente -->
</div>

<div class="main" id="main-content">
  <!-- Conteúdo injetado dinamicamente -->
</div>

<script>
// ══════════════════════════════════════════════════════════════════
//  EMS N4 Dashboard v5 — Dynamic (reads from Google Sheets)
//  Novas features: Jornada da Evolução | Meses ao vivo | Produto por nível
// ══════════════════════════════════════════════════════════════════

var CONFIG = null;
var DADOS_CACHE = {};
var DIAG_DATA = [];
var JORNADA_CACHE = null;
var MES_ATUAL = null;
var CHART_PROD = null;
var ANUAL_CHARTS = {};
var DISTRITO_ATIVO = null;
var PROD_LINHA = 'NEXUS';
var PROD_NIVEL = 'regional';
var PROD_DIST_SEL = null;
var VIEW_ATUAL = 'principal'; // 'principal' | 'analise'

// Jornada stages — cores e ordem de hierarquia
var JORNADA_ORDER = ['Destaque','Performance','Start'];
var JORNADA_CFG = {
  'Destaque':    {bg:'#D1FAE5', color:'#065f46', border:'#6EE7B7', cls:'destaque',    icon:'⭐', sub:'Sênior'},
  'Performance': {bg:'#FEF3C7', color:'#78350F', border:'#FCD34D', cls:'performance', icon:'📈', sub:'Pleno'},
  'Start':       {bg:'#FEE2E2', color:'#7f1d1d', border:'#FCA5A5', cls:'start',       icon:'🌱', sub:'Júnior'}
};

// Ordem dos meses para navegação e comparação
var MES_ORDER = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

// Marcas chave — produtos prioritários por linha
var MARCAS_CHAVE_NEXUS = ['BRAMICAR','BRAMICAR HCT','OLIRE','LYBERDIA'];
var MARCAS_CHAVE_VITAL = ['BRASART HCT','BRASART BCC','LINADIB','LINADIB DUO','BUPIUM XL'];
function normProd(n) { return (n || '').toUpperCase().trim().replace(/\s+/g, ' '); }
function isMarcaChave(nome, linha) {
  var n = normProd(nome);
  if (linha === 'NEXUS') return MARCAS_CHAVE_NEXUS.indexOf(n) >= 0;
  if (linha === 'VITAL') return MARCAS_CHAVE_VITAL.indexOf(n) >= 0;
  return MARCAS_CHAVE_NEXUS.indexOf(n) >= 0 || MARCAS_CHAVE_VITAL.indexOf(n) >= 0;
}

function getMesAnterior(mes) {
  var idx = MES_ORDER.indexOf((mes || '').toUpperCase());
  return idx > 0 ? MES_ORDER[idx - 1] : null;
}

// ── Helpers ──────────────────────────────────────────────────────

function safeFloat(v) {
  if (v === null || v === undefined || v === '') return null;
  var f = parseFloat(v);
  return isNaN(f) ? null : f;
}

function pct(v) {
  var f = safeFloat(v);
  return f !== null ? f.toFixed(1) + '%' : '—';
}

function atClass(v) {
  var f = safeFloat(v);
  if (f === null) return '';
  if (f >= 100) return 'at-ok';
  if (f >= 80)  return 'at-warn';
  return 'at-crit';
}

function prodColor(v) {
  var f = safeFloat(v);
  if (f === null) return 'color:#aaa';
  if (f >= 100) return 'color:var(--green)';
  if (f >= 85)  return 'color:var(--yellow)';
  return 'color:var(--red)';
}

function dgClass(dg) { return dg === 'ok' ? 'ok' : dg === 'warn' ? 'warn' : 'crit'; }
function dgIcon(dg)  { return dg === 'ok' ? '✔' : dg === 'warn' ? '⚠' : '✘'; }

function numBR(v) {
  if (v === null || v === undefined || v === '') return '—';
  return parseFloat(v).toLocaleString('pt-BR');
}

// ── Jornada helpers ──────────────────────────────────────────────

function jornadaCfg(stage) {
  return JORNADA_CFG[stage] || JORNADA_CFG['Start'];
}

function jornadaBadge(stage) {
  var s = stage || 'Start';
  var c = jornadaCfg(s);
  return '<span class="jbadge" style="background:' + c.bg + ';color:' + c.color + ';border-color:' + c.border + '">' + s + '</span>';
}

function getJornadaRep(setor_id, nome) {
  if (!JORNADA_CACHE || !JORNADA_CACHE.length) return 'Start';
  var rep = null;
  // 1. Busca por nome (principal — arquivo de jornada tem nome completo)
  if (nome) {
    var nomeLow = nome.trim().toLowerCase();
    rep = JORNADA_CACHE.find(function(j) {
      return j.nome && j.nome.trim().toLowerCase() === nomeLow;
    });
    // Busca parcial: nome do arquivo contém o nome do rep (ou vice-versa)
    if (!rep) {
      rep = JORNADA_CACHE.find(function(j) {
        if (!j.nome) return false;
        var jn = j.nome.trim().toLowerCase();
        return jn.includes(nomeLow) || nomeLow.includes(jn);
      });
    }
  }
  // 2. Fallback: busca por setor_id
  if (!rep && setor_id) {
    rep = JORNADA_CACHE.find(function(j) { return j.setor_id && j.setor_id === setor_id; });
  }
  return rep ? (rep.classificacao || 'Start') : 'Start';
}

// ── Navegação de views ────────────────────────────────────────────

function alternarView(view) {
  VIEW_ATUAL = view;
  var dados = DADOS_CACHE[MES_ATUAL];
  if (!dados) return;
  DISTRITO_ATIVO = null;
  if (view === 'analise') {
    renderViewAnalise(dados, MES_ATUAL);
  } else {
    renderTudo(dados, MES_ATUAL);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderViewAnalise(dados, mes) {
  var html = '<div class="analise-page-hdr">' +
    '<button class="analise-back-btn" onclick="alternarView(\'principal\')">← Voltar ao Dashboard</button>' +
    '<div>' +
      '<div style="font-size:16px;font-weight:800">Análise &amp; Alertas</div>' +
      '<div style="font-size:11px;color:var(--gray);margin-top:2px">' + mes + '/2026 · Regional SPI OESTE · Cardiometabólico</div>' +
    '</div>' +
  '</div>';
  html += renderAnalise(dados, mes);
  document.getElementById('main-content').innerHTML = html;
}

function renderBotaoAnalise(dados, mes) {
  var reps     = (dados.reps || []).filter(function(r){ return r.vago !== 'True' && r.vago !== true && r.vago !== '1'; });
  var semMDV   = reps.filter(function(r){ var p = safeFloat(r.prod); return p !== null && p < 100; }).length;
  var criticos = reps.filter(function(r){ var p = safeFloat(r.prod); return p !== null && p < 80; }).length;
  var mesAnt   = getMesAnterior(mes);
  var temComp  = !!(mesAnt && DADOS_CACHE[mesAnt]);

  var alertHtml = criticos > 0
    ? '<div class="analise-preview-alert" style="color:#ef4444">🔴 ' + criticos + ' rep(s) abaixo de 80% MDV &nbsp;·&nbsp; ' + semMDV + ' sem MDV 12</div>'
    : semMDV > 0
      ? '<div class="analise-preview-alert" style="color:#d97706">⚠ ' + semMDV + ' rep(s) não atingiram MDV 12</div>'
      : '<div class="analise-preview-alert" style="color:#059669">✅ Sem alertas críticos MDV</div>';

  var subTxt = 'Evolução MDV · Bimestres (Q1–Q4) · Produto'
    + (temComp ? ' <span style="color:#6b7280">vs ' + mesAnt + '</span>' : '');

  return '<div class="analise-preview" onclick="alternarView(\'analise\')">' +
    '<div class="analise-preview-icon">📊</div>' +
    '<div class="analise-preview-body">' +
      '<div class="analise-preview-title">Análise &amp; Alertas</div>' +
      '<div class="analise-preview-sub">' + subTxt + '</div>' +
      alertHtml +
    '</div>' +
    '<div class="analise-preview-cta">Abrir →</div>' +
  '</div>';
}

// ── Sheets API ────────────────────────────────────────────────────

function sheetsUrl(aba) {
  return 'https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.spreadsheet_id +
    '/values/' + encodeURIComponent(aba) + '?key=' + CONFIG.api_key;
}

async function fetchAba(aba) {
  var res = await fetch(sheetsUrl(aba));
  if (!res.ok) throw new Error('Erro ao buscar aba: ' + aba + ' (' + res.status + ')');
  var json = await res.json();
  var rows = json.values || [];
  if (rows.length < 2) return [];
  var headers = rows[0];
  return rows.slice(1).map(function(row) {
    var obj = {};
    headers.forEach(function(h, i) { obj[h] = row[i] !== undefined ? row[i] : null; });
    return obj;
  });
}

// ── Carregar Jornada (estática, uma vez) ─────────────────────────

async function carregarJornada() {
  if (JORNADA_CACHE !== null) return;
  try {
    JORNADA_CACHE = await fetchAba('jornada');
  } catch(e) {
    JORNADA_CACHE = [];
    console.warn('Aba jornada não encontrada — todos os reps serão Start.');
  }
}

// ── Carregar dados do mês ─────────────────────────────────────────

async function carregarMes(mes) {
  if (DADOS_CACHE[mes]) return DADOS_CACHE[mes];

  setLoadingTxt('Carregando ' + mes + '/2026…');

  var [distritos, reps, prodNex, prodVit,
       prodDistNex, prodDistVit,
       prodRepNex,  prodRepVit, pex,
       visitasNex,  visitasVit, crm,
       diagnostico] = await Promise.all([
    fetchAba('distritos_' + mes).catch(function() { return []; }),
    fetchAba('reps_' + mes).catch(function() { return []; }),
    fetchAba('produtos_NEXUS_' + mes).catch(function() { return []; }),
    fetchAba('produtos_VITAL_' + mes).catch(function() { return []; }),
    fetchAba('produtos_dist_NEXUS_' + mes).catch(function() { return []; }),
    fetchAba('produtos_dist_VITAL_' + mes).catch(function() { return []; }),
    fetchAba('produtos_rep_NEXUS_' + mes).catch(function() { return []; }),
    fetchAba('produtos_rep_VITAL_' + mes).catch(function() { return []; }),
    fetchAba('pex_' + mes).catch(function() { return []; }),
    fetchAba('visitas_NEXUS_' + mes).catch(function() { return []; }),
    fetchAba('visitas_VITAL_' + mes).catch(function() { return []; }),
    fetchAba('crm_' + mes).catch(function() { return []; }),
    fetchAba('diagnostico_' + mes).catch(function() { return []; })
  ]);

  DADOS_CACHE[mes] = { distritos, reps, prodNex, prodVit,
                       prodDistNex, prodDistVit, prodRepNex, prodRepVit, pex,
                       visitasNex, visitasVit, crm, diagnostico };
  return DADOS_CACHE[mes];
}

// ── Renderização: KPIs ────────────────────────────────────────────

function renderKPIs(dados) {
  var distritos = dados.distritos || [];
  var reps      = dados.reps      || [];
  var ativos    = reps.filter(function(r){
    return r.vago !== 'True' && r.vago !== true && r.vago !== '1';
  });

  // ── MDV (Produtividade) ──────────────────────────────────────────
  var ok   = distritos.filter(function(d) { return d.diagnostico === 'ok';   }).length;
  var warn = distritos.filter(function(d) { return d.diagnostico === 'warn'; }).length;
  var crit = distritos.filter(function(d) { return d.diagnostico === 'crit'; }).length;

  function mediaMDVLinha(linha) {
    var ds   = distritos.filter(function(d){ return d.linha === linha; });
    var vals = ds.map(function(d){ return safeFloat(d.prod); }).filter(function(v){ return v !== null; });
    return vals.length ? vals.reduce(function(a,b){return a+b;},0) / vals.length * 100 : null;
  }
  var prodNexM = mediaMDVLinha('NEXUS');
  var prodVitM = mediaMDVLinha('VITAL');
  var allVals  = distritos.map(function(d){ return safeFloat(d.prod); }).filter(function(v){ return v !== null; });
  var prodRegM = allVals.length ? allVals.reduce(function(a,b){return a+b;},0) / allVals.length * 100 : null;

  // Reps que não entregam MDV (prod < 100% = abaixo do objetivo de 12 visitas)
  var repsSemMDV = ativos.filter(function(r){
    var p = safeFloat(r.prod);
    return p !== null && p < 100;
  }).length;

  // ── Atingimento de Produto ───────────────────────────────────────
  function mediaAtProd(prodData) {
    var vals = (prodData || [])
      .map(function(r){ return safeFloat(r.ating_pct); })
      .filter(function(v){ return v !== null && v > 0; });
    return vals.length ? vals.reduce(function(a,b){return a+b;},0) / vals.length : null;
  }
  var atProdNex = mediaAtProd(dados.prodNex);
  var atProdVit = mediaAtProd(dados.prodVit);

  function fmt(v) { return v !== null ? v.toFixed(1) + '%' : '—'; }

  // Linha 1: produtividade MDV + produto
  var row1 = '<div class="kpi-row" style="grid-template-columns:repeat(5,1fr);margin-bottom:10px">' +
    kpiCard('r', 'ATING. PROD. REGIONAL', fmt(prodRegM), 'MDV · 8 distritos') +
    kpiCard('n', 'ATING. PROD. NEXUS',    fmt(prodNexM), 'MDV · 4 distritos') +
    kpiCard('r', 'ATING. PROD. VITAL',    fmt(prodVitM), 'MDV · 4 distritos') +
    kpiCard('n', 'ATING. PRODUTO NEXUS',  fmt(atProdNex), 'Média produtos linha') +
    kpiCard('r', 'ATING. PRODUTO VITAL',  fmt(atProdVit), 'Média produtos linha') +
  '</div>';

  // Linha 2: status + alerta MDV
  var semMDVCls = repsSemMDV === 0 ? 'g' : repsSemMDV <= 10 ? 'o' : 'r';
  var row2 = '<div class="kpi-row" style="grid-template-columns:repeat(4,1fr)">' +
    kpiCard('g', 'OK',            ok,          'distritos ≥ 100% MDV') +
    kpiCard('o', 'ATENÇÃO',       warn,        'distritos 80–99% MDV') +
    kpiCard('r', 'CRÍTICO',       crit,        'distritos < 80% MDV') +
    kpiCard(semMDVCls, 'REPS SEM MDV 12', repsSemMDV, 'abaixo do obj. — prod < 100%') +
  '</div>';

  return row1 + row2;
}

function kpiCard(cls, lbl, val, sub) {
  return '<div class="kpi ' + cls + '"><div class="kpi-lbl">' + lbl + '</div>' +
    '<div class="kpi-val">' + val + '</div><div class="kpi-sub">' + sub + '</div></div>';
}

// ── Visitas GD ────────────────────────────────────────────────────

var VISITAS_CHART = null;

function getVisitas(mes, linha) {
  var d = DADOS_CACHE[mes]; if (!d) return [];
  return linha === 'NEXUS' ? (d.visitasNex || []) : (d.visitasVit || []);
}

function getVisitasGDRow(mes, linha, distId) {
  var arr = getVisitas(mes, linha);
  return arr.find(function(r){ return String(r.distrito_id) === String(distId); }) || null;
}

function getCrmRow(mes, distId) {
  var d = DADOS_CACHE[mes]; if (!d) return null;
  var arr = d.crm || [];
  return arr.find(function(r){ return String(r.distrito_id) === String(distId); }) || null;
}

function cobClass(pct) {
  var v = parseFloat(pct);
  if (isNaN(v)) return '';
  if (v >= 100) return 'visitas-cob-ok';
  if (v >= 80)  return 'visitas-cob-warn';
  return 'visitas-cob-crit';
}

function fmtCob(pct) {
  var v = parseFloat(pct);
  if (isNaN(v)) return '—';
  return v.toFixed(1) + '%';
}

function buildVisitasChart(canvasId, meses, distritos) {
  var ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (VISITAS_CHART) { VISITAS_CHART.destroy(); VISITAS_CHART = null; }

  var NEX_COLORS = ['#1e3a8a','#2563eb','#38bdf8','#06b6d4'];
  var VIT_COLORS = ['#7f1d1d','#b91c1c','#f43f5e','#fb7185'];
  var nexDists = distritos.filter(function(d){ return d.linha === 'NEXUS'; });
  var vitDists = distritos.filter(function(d){ return d.linha === 'VITAL'; });

  var datasets = [];
  nexDists.forEach(function(dist, i) {
    datasets.push({
      label: dist.ab || dist.nm || dist.distrito_id,
      data: meses.map(function(m){
        var r = getVisitasGDRow(m, 'NEXUS', dist.distrito_id);
        if (!r) return null;
        var v = parseFloat(r.cob_pct); return isNaN(v) ? null : v;
      }),
      borderColor: NEX_COLORS[i % 4],
      backgroundColor: NEX_COLORS[i % 4] + '22',
      tension: 0.3, borderWidth: 2, pointRadius: 4, spanGaps: true
    });
  });
  vitDists.forEach(function(dist, i) {
    datasets.push({
      label: dist.ab || dist.nm || dist.distrito_id,
      data: meses.map(function(m){
        var r = getVisitasGDRow(m, 'VITAL', dist.distrito_id);
        if (!r) return null;
        var v = parseFloat(r.cob_pct); return isNaN(v) ? null : v;
      }),
      borderColor: VIT_COLORS[i % 4],
      backgroundColor: VIT_COLORS[i % 4] + '22',
      tension: 0.3, borderWidth: 2, pointRadius: 4, spanGaps: true
    });
  });

  VISITAS_CHART = new Chart(ctx, {
    type: 'line',
    data: { labels: meses, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              return ctx.dataset.label + ': ' + (ctx.raw !== null ? ctx.raw.toFixed(1) + '%' : '—');
            }
          }
        }
      },
      scales: {
        y: {
          ticks: { callback: function(v){ return v + '%'; }, font: { size: 11 } },
          grid: { color: '#f0f0f0' }
        },
        x: { ticks: { font: { size: 11 } } }
      }
    }
  });
}

function renderVisitasTable(meses, distritos) {
  var nexDists = distritos.filter(function(d){ return d.linha === 'NEXUS'; });
  var vitDists = distritos.filter(function(d){ return d.linha === 'VITAL'; });
  var nMeses   = meses.length;

  var html = '<div class="visitas-table-wrap"><table class="visitas-table"><thead>';
  // Linha 1: GD + meses
  html += '<tr><th class="th-gd" rowspan="2">GD</th>';
  meses.forEach(function(m) {
    html += '<th class="th-mes" colspan="4">' + m + '</th>';
  });
  html += '</tr>';
  // Linha 2: sub-colunas
  html += '<tr>';
  meses.forEach(function() {
    html += '<th class="th-mes">Obj</th><th class="th-mes">Real</th><th class="th-mes">Cob%</th><th class="th-mes">Dias</th>';
  });
  html += '</tr></thead><tbody>';

  function buildRow(dist, linha, cls) {
    var row = '<tr class="' + cls + '">';
    row += '<td class="td-gd">' + (dist.ab || dist.nm || dist.distrito_id) + '</td>';
    meses.forEach(function(m, mi) {
      var r = getVisitasGDRow(m, linha, dist.distrito_id);
      var obj  = r ? parseFloat(r.obj)     : NaN;
      var real = r ? parseFloat(r.real)    : NaN;
      var cob  = r ? parseFloat(r.cob_pct) : NaN;
      var dias = r ? parseFloat(r.dias)    : NaN;
      if (isNaN(obj))  obj  = null;
      if (isNaN(real)) real = null;
      if (isNaN(cob))  cob  = null;
      if (isNaN(dias)) dias = null;
      var sepCls = mi === 0 ? ' td-sep' : '';
      var cc = cobClass(cob);
      row += '<td class="' + sepCls + '">' + (obj  !== null ? Math.round(obj)  : '—') + '</td>';
      row += '<td>' + (real !== null ? Math.round(real) : '—') + '</td>';
      row += '<td class="' + cc + '">' + fmtCob(cob) + '</td>';
      row += '<td>' + (dias !== null ? Math.round(dias) : '—') + '</td>';
    });
    row += '</tr>';
    return row;
  }

  // Separador NEXUS
  html += '<tr class="row-sep"><td colspan="' + (1 + nMeses * 4) + '">🔵 NEXUS</td></tr>';
  nexDists.forEach(function(d){ html += buildRow(d, 'NEXUS', 'row-nexus'); });

  // Separador VITAL
  html += '<tr class="row-sep"><td colspan="' + (1 + nMeses * 4) + '">🔴 VITAL</td></tr>';
  vitDists.forEach(function(d){ html += buildRow(d, 'VITAL', 'row-vital'); });

  html += '</tbody></table></div>';
  return html;
}

// Seção resumida de Visitas GD para a página mensal principal
function renderVisitasMes(dados, mes, distritos) {
  var visitasNex = dados.visitasNex || [];
  var visitasVit = dados.visitasVit || [];
  var todos = visitasNex.concat(visitasVit);
  if (!todos.length) return ''; // sem dados de visitas para este mês

  var nexDists = distritos.filter(function(d){ return d.linha === 'NEXUS'; });
  var vitDists = distritos.filter(function(d){ return d.linha === 'VITAL'; });

  function buildRows(dists, linha, visitasArr) {
    return dists.map(function(dist) {
      var r = visitasArr.find(function(v){ return String(v.distrito_id) === String(dist.distrito_id); });
      var obj  = r ? parseFloat(r.obj)     : null; if (isNaN(obj))  obj  = null;
      var real = r ? parseFloat(r.real)    : null; if (isNaN(real)) real = null;
      var cob  = r ? parseFloat(r.cob_pct) : null; if (isNaN(cob))  cob  = null;
      var dias = r ? parseFloat(r.dias)    : null; if (isNaN(dias)) dias = null;
      var cc   = cobClass(cob);
      var rowCls = linha === 'NEXUS' ? 'row-nexus' : 'row-vital';
      return '<tr class="' + rowCls + '">' +
        '<td class="td-gd">' + (dist.ab || dist.nm || '') + '</td>' +
        '<td>' + (obj  !== null ? Math.round(obj)  : '—') + '</td>' +
        '<td>' + (real !== null ? Math.round(real) : '—') + '</td>' +
        '<td class="' + cc + '">' + fmtCob(cob) + '</td>' +
        '<td>' + (dias !== null ? Math.round(dias) : '—') + '</td>' +
        '</tr>';
    }).join('');
  }

  var html = '<div style="margin:0 0 28px">';
  html += '<div class="sec-hdr"><div class="sec-title">PANORAMA — VISITAS GD</div><div class="sec-line"></div>';
  html += '<span style="font-size:11px;color:var(--gray)">' + mes + '/2026</span></div>';
  html += '<div class="visitas-chart-wrap" style="margin-top:8px">';
  html += '<div class="visitas-table-wrap"><table class="visitas-table"><thead>';
  html += '<tr><th class="th-gd">GD</th><th class="th-mes">Obj</th><th class="th-mes">Real</th><th class="th-mes">Cob%</th><th class="th-mes">Dias</th></tr>';
  html += '</thead><tbody>';
  html += '<tr class="row-sep"><td colspan="5">🔵 NEXUS</td></tr>';
  html += buildRows(nexDists, 'NEXUS', visitasNex);
  html += '<tr class="row-sep"><td colspan="5">🔴 VITAL</td></tr>';
  html += buildRows(vitDists, 'VITAL', visitasVit);
  html += '</tbody></table></div></div></div>';
  return html;
}

// ── CRM CHAVE ─────────────────────────────────────────────────────
function renderCrmChave(crm, mes) {
  if (!crm || !crm.length) return '';

  function crmClass(pct) {
    if (pct === null) return 'crit';
    if (pct >= 100) return 'ok';
    if (pct >= 80)  return 'warn';
    return 'crit';
  }
  function fmtPct(v) {
    if (v === null || isNaN(v)) return '—';
    return v.toFixed(1) + '%';
  }
  function barHtml(pct) {
    var cls = crmClass(pct);
    var w   = pct !== null ? Math.min(100, Math.max(0, pct)) : 0;
    return '<span class="crm-bar-wrap"><span class="crm-bar-fill ' + cls + '" style="width:' + w + '%"></span></span>';
  }

  function buildSection(rows, linhaNome) {
    var linhaCls = linhaNome.toLowerCase();
    var html = '<div class="crm-section">';
    html += '<div class="crm-linha-hdr">';
    html += '<span class="crm-linha-badge ' + linhaCls + '">' + linhaNome + '</span>';
    html += '<span class="crm-linha-title">Interações CRM CHAVE</span>';
    html += '</div>';
    if (!rows.length) {
      html += '<div class="crm-empty">Sem dados para ' + linhaNome + ' em ' + mes + '</div>';
    } else {
      html += '<table class="crm-table"><thead><tr>';
      html += '<th>GD</th>';
      html += '<th class="right">Obj</th>';
      html += '<th class="right">Real</th>';
      html += '<th class="right">Cob.%</th>';
      html += '<th>Progresso</th>';
      html += '<th class="right">Painel</th>';
      html += '<th class="right">Cob.Painel</th>';
      html += '</tr></thead><tbody>';
      rows.forEach(function(r) {
        var obj  = parseFloat(r.obj_interacoes);  if (isNaN(obj))  obj  = null;
        var real = parseFloat(r.real_interacoes); if (isNaN(real)) real = null;
        var cob  = parseFloat(r.cob_interacoes);  if (isNaN(cob))  cob  = null;
        // Convert fraction to % if needed
        if (cob !== null && cob <= 1.5) cob = cob * 100;
        var painel    = r.painel    !== undefined && r.painel    !== '' ? r.painel    : '—';
        var cobPainel = parseFloat(r.cob_painel);
        if (isNaN(cobPainel)) cobPainel = null;
        if (cobPainel !== null && cobPainel <= 1.5) cobPainel = cobPainel * 100;
        var cc = crmClass(cob);
        var cp = crmClass(cobPainel);
        html += '<tr>';
        html += '<td><div class="crm-gd-name">' + (r.nm || r.ab || r.distrito_id) + '</div>';
        if (r.ab && r.nm && r.nm !== r.ab) html += '<div class="crm-gd-ab">' + r.ab + '</div>';
        html += '</td>';
        html += '<td class="right crm-num">' + (obj  !== null ? Math.round(obj)  : '—') + '</td>';
        html += '<td class="right crm-num">' + (real !== null ? Math.round(real) : '—') + '</td>';
        html += '<td class="right"><span class="crm-pct ' + cc + '">' + fmtPct(cob) + '</span></td>';
        html += '<td>' + barHtml(cob) + '</td>';
        html += '<td class="right crm-num">' + painel + '</td>';
        html += '<td class="right"><span class="crm-pct ' + cp + '">' + fmtPct(cobPainel) + '</span></td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    return html;
  }

  var nexRows = crm.filter(function(r){ return (r.linha || '').toUpperCase() === 'NEXUS'; });
  var vitRows = crm.filter(function(r){ return (r.linha || '').toUpperCase() === 'VITAL'; });

  var html = '<div class="crm-wrap">';
  html += '<div class="sec-hdr"><div class="sec-title">PANORAMA — CRM CHAVE</div><div class="sec-line"></div>';
  html += '<span style="font-size:11px;color:var(--gray)">' + mes + '/2026</span></div>';
  html += buildSection(nexRows, 'NEXUS');
  html += buildSection(vitRows, 'VITAL');
  html += '</div>';
  return html;
}

function renderCrmAnual(meses, distritos) {
  var nexDists = distritos.filter(function(d){ return d.linha === 'NEXUS'; });
  var vitDists = distritos.filter(function(d){ return d.linha === 'VITAL'; });
  var nMeses   = meses.length;
  var totalCols = 1 + nMeses * 3; // GD + (Obj, Real, Cob%) × meses

  function crmCls(pct) {
    if (pct === null || isNaN(pct)) return '';
    if (pct >= 100) return 'crm-pct ok';
    if (pct >= 80)  return 'crm-pct warn';
    return 'crm-pct crit';
  }
  function crmBarHtml(pct) {
    var clsFill = (pct === null || isNaN(pct)) ? 'crit' : (pct >= 100 ? 'ok' : (pct >= 80 ? 'warn' : 'crit'));
    var w = pct !== null && !isNaN(pct) ? Math.min(100, Math.max(0, pct)) : 0;
    return '<span class="crm-bar-wrap"><span class="crm-bar-fill ' + clsFill + '" style="width:' + w + '%"></span></span>';
  }
  function fmtP(v) { return (v !== null && !isNaN(v)) ? v.toFixed(1) + '%' : '—'; }

  function buildRow(dist, cls) {
    var row = '<tr class="' + cls + '">';
    row += '<td class="td-gd" style="white-space:nowrap">' + (dist.ab || dist.nm || dist.distrito_id) + '</td>';
    meses.forEach(function(m, mi) {
      var r    = getCrmRow(m, dist.distrito_id);
      var obj  = r ? parseFloat(r.obj_interacoes)  : NaN;
      var real = r ? parseFloat(r.real_interacoes) : NaN;
      var cob  = r ? parseFloat(r.cob_interacoes)  : NaN;
      if (isNaN(obj))  obj  = null;
      if (isNaN(real)) real = null;
      if (isNaN(cob))  cob  = null;
      if (cob !== null && cob <= 1.5) cob = cob * 100;
      var sepCls = mi === 0 ? ' td-sep' : '';
      row += '<td class="' + sepCls + '" style="text-align:right">' + (obj  !== null ? Math.round(obj)  : '—') + '</td>';
      row += '<td style="text-align:right">'                        + (real !== null ? Math.round(real) : '—') + '</td>';
      row += '<td style="text-align:center"><span class="' + crmCls(cob) + '">' + fmtP(cob) + '</span> ' + crmBarHtml(cob) + '</td>';
    });
    row += '</tr>';
    return row;
  }

  var html = '<div class="visitas-table-wrap"><table class="visitas-table"><thead>';
  html += '<tr><th class="th-gd" rowspan="2">GD</th>';
  meses.forEach(function(m) { html += '<th class="th-mes" colspan="3">' + m + '</th>'; });
  html += '</tr><tr>';
  meses.forEach(function() { html += '<th class="th-mes">Obj</th><th class="th-mes">Real</th><th class="th-mes">Cob%</th>'; });
  html += '</tr></thead><tbody>';
  html += '<tr class="row-sep"><td colspan="' + totalCols + '">🔵 NEXUS</td></tr>';
  nexDists.forEach(function(d){ html += buildRow(d, 'row-nexus'); });
  html += '<tr class="row-sep"><td colspan="' + totalCols + '">🔴 VITAL</td></tr>';
  vitDists.forEach(function(d){ html += buildRow(d, 'row-vital'); });
  html += '</tbody></table></div>';
  return html;
}

function renderVisitasGD(meses, distritos) {
  VIEW_ATUAL = 'visitas';
  window._visitasMeses    = meses;
  window._visitasDistritos = distritos;

  var mesSel = MES_ATUAL || meses[meses.length - 1];

  // KPIs do mês selecionado
  function avgCob(linha) {
    var arr = getVisitas(mesSel, linha).map(function(r){ return parseFloat(r.cob_pct); }).filter(function(v){ return !isNaN(v); });
    if (!arr.length) return null;
    return arr.reduce(function(s,v){ return s + v; }, 0) / arr.length;
  }
  function avgDias(linha) {
    var arr = getVisitas(mesSel, linha).map(function(r){ return parseFloat(r.dias); }).filter(function(v){ return !isNaN(v); });
    if (!arr.length) return null;
    return arr.reduce(function(s,v){ return s + v; }, 0) / arr.length;
  }
  function sumReal(linha) {
    return getVisitas(mesSel, linha).reduce(function(s,r){ var v = parseFloat(r.real); return s + (isNaN(v) ? 0 : v); }, 0);
  }
  function sumObj(linha) {
    return getVisitas(mesSel, linha).reduce(function(s,r){ var v = parseFloat(r.obj); return s + (isNaN(v) ? 0 : v); }, 0);
  }

  function kpiCard(titulo, val, sub, cls) {
    return '<div class="visitas-kpi ' + cls + '">' +
      '<div class="vk-label">' + titulo + '</div>' +
      '<div class="vk-val">' + val + '</div>' +
      '<div class="vk-sub">' + sub + '</div></div>';
  }

  var nCobN = avgCob('NEXUS'); var nCobV = avgCob('VITAL');
  var nDiasN = avgDias('NEXUS'); var nDiasV = avgDias('VITAL');

  var html = '<div style="padding:24px">';
  html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">';
  html += '<h2 style="margin:0;font-size:17px;font-weight:700;color:var(--text)">👁 Visitas GD — Acompanhamento</h2>';
  html += '<span style="font-size:12px;background:#e0f2fe;color:#0369a1;padding:3px 10px;border-radius:20px;font-weight:600">' + mesSel + '/2026</span>';
  html += '</div>';

  // KPIs
  html += '<div class="visitas-kpi-grid">';
  html += kpiCard('NEXUS · Cob. Média', nCobN !== null ? nCobN.toFixed(1) + '%' : '—',
    sumReal('NEXUS') + ' / ' + sumObj('NEXUS') + ' acomp.', 'nexus');
  html += kpiCard('NEXUS · Média Dias', nDiasN !== null ? nDiasN.toFixed(1) : '—',
    'dias/GD no mês', 'nexus');
  html += kpiCard('VITAL · Cob. Média', nCobV !== null ? nCobV.toFixed(1) + '%' : '—',
    sumReal('VITAL') + ' / ' + sumObj('VITAL') + ' acomp.', 'vital');
  html += kpiCard('VITAL · Média Dias', nDiasV !== null ? nDiasV.toFixed(1) : '—',
    'dias/GD no mês', 'vital');
  html += '</div>';

  // Gráfico evolução
  html += '<div class="visitas-chart-wrap">';
  html += '<h3>📈 Evolução da Cobertura de Acompanhamento (%)</h3>';
  html += '<div style="height:260px"><canvas id="chart-visitas-cob"></canvas></div>';
  html += '</div>';

  // Tabela completa de Visitas
  html += '<div class="visitas-chart-wrap">';
  html += '<h3>📋 Detalhamento por GD e Mês — Visitas</h3>';
  html += renderVisitasTable(meses, distritos);
  html += '</div>';

  // CRM CHAVE — visão anual
  html += '<div class="visitas-chart-wrap">';
  html += '<h3>🎯 CRM CHAVE — Interações por GD e Mês</h3>';
  html += '<p style="font-size:11px;color:var(--gray);margin:0 0 12px">';
  html += '<span style="display:inline-block;width:10px;height:10px;background:#22c55e;border-radius:2px;margin-right:4px"></span>≥100%&nbsp;&nbsp;';
  html += '<span style="display:inline-block;width:10px;height:10px;background:#f59e0b;border-radius:2px;margin-right:4px"></span>80–99%&nbsp;&nbsp;';
  html += '<span style="display:inline-block;width:10px;height:10px;background:#ef4444;border-radius:2px;margin-right:4px"></span>&lt;80%';
  html += '</p>';
  html += renderCrmAnual(meses, distritos);
  html += '</div>';

  html += '</div>';

  document.getElementById('main-content').innerHTML = html;
  requestAnimationFrame(function(){
    buildVisitasChart('chart-visitas-cob', meses, distritos);
  });
}

async function abrirVisitasGD() {
  VIEW_ATUAL = 'visitas';
  mostrarLoading(true);
  try {
    var meses = (CONFIG && CONFIG._meses && CONFIG._meses.length) ? CONFIG._meses : [MES_ATUAL];
    var proms = meses.map(function(m){ return carregarMes(m).catch(function(){}); });
    await Promise.all(proms);

    var mesSel = MES_ATUAL || meses[meses.length - 1];
    var dados  = DADOS_CACHE[mesSel] || {};
    var distritos = dados.distritos || [];

    renderCycleBar(meses, mesSel);
    renderVisitasGD(meses, distritos);
  } catch(e) { renderErro(e.message); }
  finally    { mostrarLoading(false); }
}

// ── Renderização: Mês ─────────────────────────────────────────────

function renderCycleBar(meses, mesAtual) {
  var bar = document.getElementById('cycle-bar');
  var isAnual    = VIEW_ATUAL === 'anual';
  var isCota     = VIEW_ATUAL === 'cota';
  var isVisitas  = VIEW_ATUAL === 'visitas';
  var isGloss    = VIEW_ATUAL === 'glossario';
  var isGap      = VIEW_ATUAL === 'gap';
  var isMatrix   = VIEW_ATUAL === 'matrix';
  var nenhuma    = isAnual || isCota || isVisitas || isGloss || isGap || isMatrix;
  var btns = meses.map(function(m) {
    return '<button class="cycle-btn' + (m === mesAtual && !nenhuma ? ' active' : '') +
      '" onclick="trocarMes(\'' + m + '\')">' + m + '/2026</button>';
  }).join('');
  btns += '<span style="display:inline-block;width:1px;height:22px;background:var(--border);margin:0 6px;align-self:center"></span>';
  btns += '<button class="cycle-btn anual-btn'   + (isAnual   ? ' active' : '') + '" onclick="abrirVisaoAnual()">📅 Visão Anual</button>';
  btns += '<button class="cycle-btn cota-btn'    + (isCota    ? ' active' : '') + '" onclick="abrirEvolucaoCota()">📈 Cota</button>';
  btns += '<button class="cycle-btn visitas-btn' + (isVisitas ? ' active' : '') + '" onclick="abrirVisitasGD()">👁 Visitas GD</button>';
  btns += '<button class="cycle-btn gap-btn'     + (isGap     ? ' active' : '') + '" onclick="abrirGapAnalise()">🔍 Gap & Outliers</button>';
  btns += '<button class="cycle-btn mtz-btn'     + (isMatrix  ? ' active' : '') + '" onclick="abrirMatrizPerformance()">🎯 Matriz</button>';
  btns += '<button class="cycle-btn gloss-btn'   + (isGloss   ? ' active' : '') + '" onclick="abrirGlossario()">📖 Glossário</button>';
  bar.innerHTML = btns;
}

// ── Renderização: Jornada da Evolução ─────────────────────────────

function getGDAbrev(distrito_id, distritos) {
  if (!distritos || !distritos.length) return '';
  var d = distritos.find(function(x) { return String(x.distrito_id) === String(distrito_id); });
  return d ? (d.ab || d.nm || '') : '';
}

function renderJornada(reps, distritos) {
  var ativos = reps.filter(function(r) {
    return r.vago !== 'True' && r.vago !== true && r.vago !== '1';
  });

  // Enriquece com etapa e nome do GD
  var repsJ = ativos.map(function(r) {
    var etapa = getJornadaRep(r.setor_id, r.nome);
    var gd    = getGDAbrev(r.distrito_id, distritos);
    var _pf   = parseFloat(r.prod);
    var prod  = (r.prod !== null && r.prod !== '' && r.prod !== undefined && !isNaN(_pf))
                 ? _pf : null;
    return Object.assign({}, r, { etapa: etapa, gdAbrev: gd, prodVal: prod });
  });

  var totalReps = repsJ.length;

  // Monta cada coluna por etapa
  function buildColuna(stage) {
    var cfg  = jornadaCfg(stage);
    var grup = repsJ.filter(function(r) { return r.etapa === stage; });
    // Ordenar por prod% desc (null vai para o final)
    grup.sort(function(a, b) {
      if (a.prodVal === null && b.prodVal === null) return 0;
      if (a.prodVal === null) return 1;
      if (b.prodVal === null) return -1;
      return b.prodVal - a.prodVal;
    });

    var n        = grup.length;
    var prods    = grup.filter(function(r) { return r.prodVal !== null && !isNaN(r.prodVal); }).map(function(r) { return r.prodVal; });
    var _soma    = prods.reduce(function(a,b){return a+b;},0);
    var media    = (prods.length && !isNaN(_soma)) ? (_soma / prods.length).toFixed(1) : '—';
    var acima100 = prods.filter(function(v){ return v >= 100; }).length;
    var abaixo80 = prods.filter(function(v){ return v < 80;  }).length;

    var mediaColor = (media !== '—')
      ? (parseFloat(media) >= 100 ? 'color:#065f46' : parseFloat(media) >= 80 ? 'color:#78350f' : 'color:#7f1d1d')
      : 'color:var(--gray)';

    var linhas = grup.map(function(r) {
      var pc = r.prodVal;
      var pcStr = pc !== null ? pc.toFixed(1) + '%' : '—';
      var pcCol = pc === null ? 'color:#bbb'
                : pc >= 100  ? 'color:#059669'
                : pc >= 80   ? 'color:#d97706'
                :              'color:#ef4444';
      return '<div class="jrep2">' +
        '<span class="jrep2-nome" title="' + (r.nome||'') + '">' + (r.nome||'—') + '</span>' +
        '<span class="jrep2-gd">' + (r.gdAbrev||'') + '</span>' +
        '<span class="jrep2-prod" style="' + pcCol + '">' + pcStr + '</span>' +
      '</div>';
    }).join('');

    return '<div class="jpcol ' + cfg.cls + '">' +
      // Header
      '<div class="jpcol-hdr">' +
        '<div class="jpcol-icon">' + cfg.icon + '</div>' +
        '<div class="jpcol-titulo">' + stage + '</div>' +
        '<div class="jpcol-subtit">' + cfg.sub + '</div>' +
        '<div class="jpcol-count">' +
          '<div class="jpcol-num">' + n + '</div>' +
          '<div class="jpcol-label">Representantes</div>' +
        '</div>' +
      '</div>' +
      // Stats
      '<div class="jpcol-stats">' +
        '<div class="jpcol-stat">' +
          '<div class="jpcol-stat-val" style="' + mediaColor + '">' + (media !== '—' ? media + '%' : '—') + '</div>' +
          '<div class="jpcol-stat-lbl">Prod. Média</div>' +
        '</div>' +
        '<div class="jpcol-stat">' +
          '<div class="jpcol-stat-val" style="color:#059669">' + acima100 + '</div>' +
          '<div class="jpcol-stat-lbl">≥ 100%</div>' +
        '</div>' +
        '<div class="jpcol-stat">' +
          '<div class="jpcol-stat-val" style="color:#ef4444">' + abaixo80 + '</div>' +
          '<div class="jpcol-stat-lbl">< 80%</div>' +
        '</div>' +
      '</div>' +
      // Lista
      '<div class="jpcol-list">' + (linhas || '<div style="padding:20px;text-align:center;color:var(--gray);font-size:12px">Nenhum representante</div>') + '</div>' +
    '</div>';
  }

  var colunasHtml = JORNADA_ORDER.map(buildColuna).join('');

  return '<div class="jornada-wrap">' +
    '<div class="jornada-sec-hdr">' +
      '<div class="sec-title" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px">Panorama — Jornada de Evolução</div>' +
      '<div class="sec-line" style="flex:1;height:1px;background:var(--border)"></div>' +
      '<span style="font-size:10px;color:var(--gray)">% = Ating. Produtividade MDV</span>' +
      '<span style="font-size:11px;color:var(--gray);font-weight:600;margin-left:12px">' + totalReps + ' reps ativos</span>' +
    '</div>' +
    '<div class="jpanorama">' + colunasHtml + '</div>' +
  '</div>';
}

// ── Renderização: PEX ────────────────────────────────────────────

var PEX_CFG = {
  'OURO':    { cls:'ouro',    icon:'🥇', range:'≥ 99,5 pts' },
  'PRATA':   { cls:'prata',   icon:'🥈', range:'95 – 99,5 pts' },
  'BRONZE':  { cls:'bronze',  icon:'🥉', range:'80 – 95 pts' },
  'ATENÇÃO': { cls:'atencao', icon:'⚠️', range:'75 – 80 pts' },
  'CRÍTICO': { cls:'critico', icon:'🚨', range:'< 75 pts' }
};
var PEX_PT_COLOR = {
  'OURO':    'color:#b8860b',
  'PRATA':   'color:#374151',
  'BRONZE':  'color:#7c4a1f',
  'ATENÇÃO': 'color:#c2410c',
  'CRÍTICO': 'color:#b91c1c'

var DIAG_ATIVO = null;

function fecharDiagCard(silencioso) {
  DIAG_ATIVO = null;
  document.querySelectorAll('.diag-detalhe').forEach(function(el) {
    el.classList.remove('open');
    el.innerHTML = '';
  });
  if (!silencioso) reRenderDiagCards();
}

function reRenderDiagCards() {
  var nexus = DIAG_DATA.filter(function(d){ return (d.linha||'').toUpperCase() === 'NEXUS'; });
  var vital  = DIAG_DATA.filter(function(d){ return (d.linha||'').toUpperCase() === 'VITAL'; });
  var gn = document.getElementById('diag-grid-nexus');
  var gv = document.getElementById('diag-grid-vital');
  if (gn) gn.innerHTML = nexus.map(diagCard).join('');
  if (gv) gv.innerHTML = vital.map(diagCard).join('');
}

function abrirDiagCard(idx) {
  var d = DIAG_DATA[idx];
  if (!d) return;

  if (DIAG_ATIVO === idx) { fecharDiagCard(); return; }
  fecharDiagCard(true);
  DIAG_ATIVO = idx;

  var nc = parseInt(d.n_criticos)        || 0;
  var nd = parseInt(d.n_desenvolvimento) || 0;
  var ne = parseInt(d.n_execucao)        || 0;
  var nv = parseInt(d.n_vagos)           || 0;
  var total = nc + nd + ne + nv;
  var isNexus = (d.linha||'').toUpperCase() === 'NEXUS';
  var cor1 = isNexus ? 'var(--nexus)' : 'var(--red)';

  function metricBig(val, cor, lbl, desc) {
    return '<div style="background:var(--bg);border-radius:12px;padding:18px 10px;text-align:center">' +
      '<div style="font-size:40px;font-weight:900;color:' + cor + ';line-height:1">' + val + '</div>' +
      '<div style="font-size:10px;font-weight:700;color:' + cor + ';margin-top:5px;letter-spacing:.05em">' + lbl + '</div>' +
      '<div style="font-size:10px;color:var(--gray);margin-top:4px;line-height:1.3">' + desc + '</div>' +
    '</div>';
  }

  var prioHtml = '';
  if (d.prioridade_1_produto) {
    var pCor  = nc > 0 ? '#e53e3e' : (ne > 0 ? '#3182ce' : '#d69e2e');
    var pTipo = nc > 0 ? '🔴 ANOMALIA CRÍTICA' : (ne > 0 ? '🔵 GAP DE EXECUÇÃO' : '🟡 DESENVOLVIMENTO');
    prioHtml =
      '<div style="margin-top:20px">' +
        '<div style="font-size:10px;font-weight:800;color:var(--gray);letter-spacing:.06em;margin-bottom:8px">PRIORIDADE #1</div>' +
        '<div style="background:var(--bg);border-left:4px solid ' + pCor + ';border-radius:8px;padding:14px 16px">' +
          '<div style="font-size:10px;color:' + pCor + ';font-weight:800;margin-bottom:6px">' + pTipo + '</div>' +
          '<div style="font-size:15px;font-weight:800;color:var(--dark)">' + (d.prioridade_1_produto || '') + '</div>' +
          '<div style="font-size:12px;color:var(--gray);margin-top:3px">Rep: ' + (d.prioridade_1_rep || '—') + '</div>' +
          (d.prioridade_1_mensagem ? '<div style="font-size:11px;color:var(--dark);margin-top:10px;line-height:1.6;background:#fff;border-radius:6px;padding:8px 12px">' + d.prioridade_1_mensagem + '</div>' : '') +
        '</div>' +
      '</div>';
  }

  var html =
    '<div class="dd-hdr">' +
      '<span class="dd-linha-tag" style="background:' + (isNexus ? 'var(--nexus-l)' : 'var(--red-l)') + ';color:' + cor1 + '">' + (d.linha||'') + '</span>' +
      '<span class="dd-title">' + (d.gd_nome || d.gd_codigo) + '</span>' +
      '<span class="dd-cod">' + (d.gd_codigo || '') + ' · ' + total + ' ocorrências</span>' +
      '<button class="dd-close" onclick="fecharDiagCard()">✕</button>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:4px">' +
      metricBig(nc, '#e53e3e', 'CRÍTICOS',      'Visitação ok,<br>sem conversão') +
      metricBig(nd, '#d69e2e', 'DESENVOLVIMENTO','Rep Start em<br>médico c/ potencial') +
      metricBig(ne, '#3182ce', 'GAP EXECUÇÃO',  'Visitação abaixo<br>de 85%') +
      metricBig(nv, '#718096', 'VAGOS',         'Setor sem<br>rep alocado') +
    '</div>' +
    prioHtml;

  var panelId = isNexus ? 'diag-detalhe-nexus' : 'diag-detalhe-vital';
  var panel = document.getElementById(panelId);
  if (panel) {
    panel.innerHTML = html;
    panel.classList.add('open');
    reRenderDiagCards();
    setTimeout(function() { panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
  }
}

function diagCard(d) {
  var nc  = parseInt(d.n_criticos)        || 0;
  var nd  = parseInt(d.n_desenvolvimento) || 0;
  var ne  = parseInt(d.n_execucao)        || 0;
  var nv  = parseInt(d.n_vagos)           || 0;
  var idx = DIAG_DATA.indexOf(d);
  var ativo = DIAG_ATIVO === idx;
  var badge = (d.linha||'').toUpperCase() === 'NEXUS'
    ? '<span class="badge n">NEXUS</span>'
    : '<span class="badge v">VITAL</span>';
  var prio = '';
  if (d.prioridade_1_produto) {
    var dotCls = nc > 0 ? 'background:#e53e3e' : (ne > 0 ? 'background:#3182ce' : 'background:#d69e2e');
    prio = '<div class="diag-divider"></div>' +
      '<div class="diag-priority">' +
        '<span class="diag-dot" style="' + dotCls + '"></span> ' +
        '<b>' + d.prioridade_1_produto + '</b> · ' + (d.prioridade_1_rep || '') +
        (ativo ? ' <span style="float:right;font-size:10px;color:var(--gray)">Fechar ✕</span>' : '') +
      '</div>';
  }
  return '<div class="diag-card' + (ativo ? ' ativo' : '') + '" style="cursor:pointer" onclick="abrirDiagCard(' + idx + ')">' +
    '<div class="diag-card-hdr">' +
      '<div>' +
        '<div class="diag-card-name">' + (d.gd_nome || d.gd_codigo) + '</div>' +
        '<div class="diag-card-meta">' + (d.gd_codigo || '') + '</div>' +
      '</div>' +
      badge +
    '</div>' +
    '<div class="diag-metrics">' +
      '<div class="diag-metric"><div class="diag-metric-val" style="color:#e53e3e">' + nc + '</div><div class="diag-metric-lbl">críticos</div></div>' +
      '<div class="diag-metric"><div class="diag-metric-val" style="color:#d69e2e">' + nd + '</div><div class="diag-metric-lbl">desenv.</div></div>' +
      '<div class="diag-metric"><div class="diag-metric-val" style="color:#3182ce">' + ne + '</div><div class="diag-metric-lbl">gap exec.</div></div>' +
      '<div class="diag-metric"><div class="diag-metric-val" style="color:var(--gray)">' + nv + '</div><div class="diag-metric-lbl">vagos</div></div>' +
    '</div>' +
    prio +
  '</div>';
}

function renderDiagnostico(diagnostico) {
  DIAG_DATA = [];
  DIAG_ATIVO = null;
  if (!diagnostico || !diagnostico.length) return '';

  var nexus = diagnostico.filter(function(d){ return (d.linha||'').toUpperCase() === 'NEXUS'; });
  var vital = diagnostico.filter(function(d){ return (d.linha||'').toUpperCase() === 'VITAL'; });
  nexus.forEach(function(d){ DIAG_DATA.push(d); });
  vital.forEach(function(d){ DIAG_DATA.push(d); });

  var legendHtml =
    '<div class="diag-legend">' +
      '<span class="diag-legend-item"><span class="diag-dot" style="background:#e53e3e"></span> Críticos — visitação ok, sem conversão</span>' +
      '<span class="diag-legend-item"><span class="diag-dot" style="background:#d69e2e"></span> Desenvolvimento — rep Start em potencial</span>' +
      '<span class="diag-legend-item"><span class="diag-dot" style="background:#3182ce"></span> Gap execução — visitação abaixo de 85%</span>' +
      '<span class="diag-legend-item"><span class="diag-dot" style="background:var(--gray)"></span> Vagos — sem rep alocado</span>' +
    '</div>';

  var nexusHtml = nexus.length

      '<div class="diag-grid" id="diag-grid-nexus">' + nexus.map(diagCard).join('') + '</div>' +
      '<div class="distrito-detalhe diag-detalhe" id="diag-detalhe-nexus"></div>'
    : '';

  var vitalHtml = vital.length
    ? '<div style="margin-bottom:6px;display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:800;color:var(--dark)">VITAL</span><span class="badge v">4 distritos</span></div>' +
      '<div class="diag-grid" id="diag-grid-vital">' + vital.map(diagCard).join('') + '</div>' +
      '<div class="distrito-detalhe diag-detalhe" id="diag-detalhe-vital"></div>'
    : '';

  return '<div class="diag-wrap">' +
    '<div class="diag-sec-hdr">' +
      '<span style="font-size:18px">🔬</span>' +
      '<span class="diag-sec-title">DIAGNÓSTICO DE MARCAS CHAVES</span>' +
    '</div>' +
    legendHtml +
    nexusHtml +
    vitalHtml +
  '</div>';
