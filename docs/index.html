// ── Visão Anual — gráficos interativos ──────────────────────────

var ANUAL_NEXUS_COLORS = ['#1e3a8a','#2563eb','#38bdf8','#06b6d4'];
var ANUAL_VITAL_COLORS = ['#7f1d1d','#b91c1c','#f43f5e','#fb7185'];

function buildAnualDatasets(meses, distritos, getRegional, getLinha, getDist) {
  var nexusDists = distritos.filter(function(d){ return d.linha === 'NEXUS'; });
  var vitalDists = distritos.filter(function(d){ return d.linha === 'VITAL'; });
  var datasets = [];

  // 0: Regional (linha grossa, escura)
  datasets.push({
    label: '📍 Regional',
    data: meses.map(function(m){ return getRegional(m); }),
    borderColor: '#111827', backgroundColor: 'rgba(17,24,39,.07)',
    borderWidth: 3, pointRadius: 5, pointHoverRadius: 7,
    tension: .35, fill: false, _group: 'regional'
  });

  // 1: NEXUS média (tracejada azul)
  datasets.push({
    label: 'NEXUS média',
    data: meses.map(function(m){ return getLinha(m, 'NEXUS'); }),
    borderColor: '#1A3A6B', backgroundColor: 'transparent',
    borderWidth: 2.5, borderDash: [8,4],
    pointRadius: 4, pointHoverRadius: 6,
    tension: .35, fill: false, _group: 'nexus-avg'
  });

  // 2: VITAL média (tracejada vermelha)
  datasets.push({
    label: 'VITAL média',
    data: meses.map(function(m){ return getLinha(m, 'VITAL'); }),
    borderColor: '#7A0A1C', backgroundColor: 'transparent',
    borderWidth: 2.5, borderDash: [8,4],
    pointRadius: 4, pointHoverRadius: 6,
    tension: .35, fill: false, _group: 'vital-avg'
  });

  // 3-6: NEXUS distritos
  nexusDists.forEach(function(d, i) {
    datasets.push({
      label: d.ab || d.distrito_id,
      data: meses.map(function(m){ return getDist(m, d.distrito_id); }),
      borderColor: ANUAL_NEXUS_COLORS[i % ANUAL_NEXUS_COLORS.length],
      backgroundColor: 'transparent',
      borderWidth: 1.8, pointRadius: 3, pointHoverRadius: 5,
      tension: .35, fill: false, _group: 'nexus', _distId: d.distrito_id
    });
  });

  // 7-10: VITAL distritos
  vitalDists.forEach(function(d, i) {
    datasets.push({
      label: d.ab || d.distrito_id,
      data: meses.map(function(m){ return getDist(m, d.distrito_id); }),
      borderColor: ANUAL_VITAL_COLORS[i % ANUAL_VITAL_COLORS.length],
      backgroundColor: 'transparent',
      borderWidth: 1.8, pointRadius: 3, pointHoverRadius: 5,
      tension: .35, fill: false, _group: 'vital', _distId: d.distrito_id
    });
  });

  return datasets;
}

function buildAnualChart(canvasId, datasets, meses, isPts, refLines) {
  var el = document.getElementById(canvasId);
  if (!el) return null;
  if (ANUAL_CHARTS[canvasId]) { ANUAL_CHARTS[canvasId].destroy(); }

  var chart = new Chart(el.getContext('2d'), {
    type: 'line',
    data: { labels: meses, datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(17,24,39,.93)',
          titleFont: { size: 12, weight: '700' }, bodyFont: { size: 11 },
          padding: 12, cornerRadius: 10,
          itemSort: function(a, b) { return (b.parsed.y || 0) - (a.parsed.y || 0); },
          callbacks: {
            label: function(ctx) {
              var v = ctx.parsed.y;
              if (v === null || v === undefined) return null;
              return '  ' + ctx.dataset.label + ':  ' + (isPts ? v.toFixed(1) + ' pts' : v.toFixed(1) + '%');
            }
          },
          filter: function(item) { return item.parsed.y !== null && item.parsed.y !== undefined; }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 11, weight: '700' } }
        },
        y: {
          grid: {
            color: function(ctx) {
              if (!refLines) return '#f0f0f0';
              for (var i = 0; i < refLines.length; i++) {
                if (Math.abs(ctx.tick.value - refLines[i].v) < 0.1) return refLines[i].color;
              }
              return '#f0f0f0';
            },
            lineWidth: function(ctx) {
              if (!refLines) return 1;
              for (var i = 0; i < refLines.length; i++) {
                if (Math.abs(ctx.tick.value - refLines[i].v) < 0.1) return 1.8;
              }
              return 1;
            }
          },
          ticks: {
            callback: function(v) { return isPts ? v + ' pts' : v + '%'; },
            font: { size: 11 }
          }
        }
      },
      spanGaps: true
    }
  });

  ANUAL_CHARTS[canvasId] = chart;
  return chart;
}

function anualSyncToggleBtns(filterBar, chart) {
  filterBar.querySelectorAll('.adtbtn').forEach(function(b) {
    var distId = b.getAttribute('data-dist');
    var marca  = b.getAttribute('data-marca');
    var datasets = chart.data.datasets;
    for (var j = 0; j < datasets.length; j++) {
      var ds = datasets[j];
      if ((distId && ds._distId === distId) || (marca && ds._marca === marca)) {
        b.classList.toggle('active', chart.isDatasetVisible(j));
        break;
      }
    }
  });
}

function anualFilter(chartId, mode, btn) {
  var chart = ANUAL_CHARTS[chartId];
  if (!chart) return;

  if (btn) {
    var grpBar = btn.closest('.anual-filter-groups');
    if (grpBar) grpBar.querySelectorAll('.afbtn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
  }

  var datasets = chart.data.datasets;
  datasets.forEach(function(ds, i) {
    var g = ds._group;
    var show = true;
    if      (mode === 'medias') show = (g === 'regional' || g === 'nexus-avg' || g === 'vital-avg');
    else if (mode === 'nexus')  show = (g === 'regional' || g === 'nexus-avg' || g === 'nexus');
    else if (mode === 'vital')  show = (g === 'regional' || g === 'vital-avg' || g === 'vital');
    chart.setDatasetVisibility(i, show);
  });

  if (btn) {
    var fb = btn.closest('.anual-filter-bar');
    if (fb) anualSyncToggleBtns(fb, chart);
  }
  chart.update();
}

function anualToggleDist(chartId, distId, btn) {
  var chart = ANUAL_CHARTS[chartId];
  if (!chart) return;
  var datasets = chart.data.datasets;
  for (var j = 0; j < datasets.length; j++) {
    var ds = datasets[j];
    var match = (distId === '__regional__')
      ? (ds._group === 'regional')
      : (ds._distId === distId);
    if (match) {
      var vis = chart.isDatasetVisible(j);
      chart.setDatasetVisibility(j, !vis);
      btn.classList.toggle('active', !vis);
      break;
    }
  }
  chart.update();
}

  html += '<button class="afbtn afbtn-nexus" onclick="anualFilter(\'' + chartId + '\',\'nexus\',this)">NEXUS</button>';
  html += '<button class="afbtn afbtn-vital" onclick="anualFilter(\'' + chartId + '\',\'vital\',this)">VITAL</button>';

  html += '<span class="aleg"><span class="aleg-line aleg-dashed" style="border-top-color:#1A3A6B"></span>NEXUS méd.</span>';
  html += '<span class="aleg"><span class="aleg-line aleg-dashed" style="border-top-color:#7A0A1C"></span>VITAL méd.</span>';
  html += '</div>';

  // Linha 2: toggle por distrito
  html += '<div class="anual-filter-dists">';
  html += '<span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)">Distritos:</span>';
  nexusDists.forEach(function(d, i) {
    var c = ANUAL_NEXUS_COLORS[i % ANUAL_NEXUS_COLORS.length];
    html += '<button class="adtbtn active" data-dist="' + d.distrito_id + '" style="--dt-color:' + c + '"' +
      ' onclick="anualToggleDist(\'' + chartId + '\',\'' + d.distrito_id + '\',this)">' +
      '<span class="adt-dot" style="background:' + c + '"></span>' + (d.ab || d.distrito_id) + '</button>';
  });
  html += '<span class="anual-filter-sep"></span>';
  vitalDists.forEach(function(d, i) {
    var c = ANUAL_VITAL_COLORS[i % ANUAL_VITAL_COLORS.length];
    html += '<button class="adtbtn active" data-dist="' + d.distrito_id + '" style="--dt-color:' + c + '"' +
      ' onclick="anualToggleDist(\'' + chartId + '\',\'' + d.distrito_id + '\',this)">' +
      '<span class="adt-dot" style="background:' + c + '"></span>' + (d.ab || d.distrito_id) + '</button>';
  });
  html += '</div></div>';
  return html;
}

function getCellMarcaRegional(mes, marca, linha) {
  var d = DADOS_CACHE[mes]; if (!d) return null;
  var arr = linha === 'NEXUS' ? (d.prodNex || []) : (d.prodVit || []);
  var row = null;
  for (var i = 0; i < arr.length; i++) {
    if (normProd(arr[i].produto) === marca) { row = arr[i]; break; }
  }
  if (!row) return null;
  var at = safeFloat(row.ating_pct);
  if (at !== null) return at;
  var cota = safeFloat(row.cota), real = safeFloat(row.realizado);

}

function getCellMarcaDist(mes, marca, linha, distId) {
  var d = DADOS_CACHE[mes]; if (!d) return null;
  var arr = linha === 'NEXUS' ? (d.prodDistNex || []) : (d.prodDistVit || []);
  for (var i = 0; i < arr.length; i++) {
    var r = arr[i];
    if (r.distrito_id === distId && normProd(r.produto) === marca) {
      var at = safeFloat(r.ating_pct);
      if (at !== null) return at;
      var cota = safeFloat(r.cota), real = safeFloat(r.realizado);
      return (cota !== null && real !== null && cota > 0) ? real / cota * 100 : null;
    }
  }
  return null;
}

async function abrirVisaoAnual() {
  VIEW_ATUAL = 'anual';
  DISTRITO_ATIVO = null;

  var meses = CONFIG._meses || [];
  window._mesesDisponiveis = meses;
  renderCycleBar(meses, null);

  mostrarLoading(true);
  try {
    // Carrega todos os meses disponíveis em paralelo
    setLoadingTxt('Carregando visão anual…');
    var promises = meses.map(function(m){ return carregarMes(m).catch(function(){}); });
    await Promise.all(promises);

    // Usa o mês mais recente como pivot para estrutura de distritos
    var mesPivot = meses[meses.length - 1];
    var dadosPivot = DADOS_CACHE[mesPivot];
    if (!dadosPivot) throw new Error('Sem dados para montar a visão anual.');

    renderVisaoAnual(meses, dadosPivot.distritos || []);
  } catch(e) {
    renderErro(e.message);
  }
  mostrarLoading(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function irParaMes(mes) {
  VIEW_ATUAL = 'principal';
  DISTRITO_ATIVO = null;
  MES_ATUAL = mes;
  document.getElementById('pill-mes').textContent = mes + '/2026';
  var meses = CONFIG._meses || [];
  renderCycleBar(meses, mes);
  mostrarLoading(true);
  try {
    var mesAnt = getMesAnterior(mes);
    var promises = [carregarMes(mes)];
    if (mesAnt) promises.push(carregarMes(mesAnt).catch(function(){}));
    var resultados = await Promise.all(promises);
    renderTudo(resultados[0], mes);
  } catch(e) {
    renderErro(e.message);
  }
  mostrarLoading(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Evolução de Cota ─────────────────────────────────────────────

var COTA_CHARTS  = {};
var COTA_LINHA_BAR = 'TOTAL'; // estado do toggle do gráfico de barras

function fmtBRL(v) {
  if (v === null || v === undefined || isNaN(v) || v === 0) return '—';
  return 'R$ ' + Math.round(v).toLocaleString('pt-BR');
}

function cotaPctClass(v) {
  if (v === null || isNaN(v)) return '';
  return v >= 100 ? 'cota-pct-ok' : v >= 80 ? 'cota-pct-warn' : 'cota-pct-crit';
}

function sumField(arr, field) {
  return arr.reduce(function(s, r) {
    var v = safeFloat(r[field]);
    return s + (v !== null && v > 0 ? v : 0);
  }, 0);
}

// Cota/Realizado regional por linha ('NEXUS','VITAL',null=total)
function getCotaReg(mes, linha) {
  var d = DADOS_CACHE[mes]; if (!d) return 0;
  if (linha === 'NEXUS') return sumField(d.prodNex || [], 'cota');
  if (linha === 'VITAL') return sumField(d.prodVit || [], 'cota');
  return sumField((d.prodNex||[]).concat(d.prodVit||[]), 'cota');
}
function getRealReg(mes, linha) {
  var d = DADOS_CACHE[mes]; if (!d) return 0;
  if (linha === 'NEXUS') return sumField(d.prodNex || [], 'realizado');
  if (linha === 'VITAL') return sumField(d.prodVit || [], 'realizado');
  return sumField((d.prodNex||[]).concat(d.prodVit||[]), 'realizado');
}

// Cota/Realizado por distrito
function getCotaDist(mes, distId, linhaD) {
  var d = DADOS_CACHE[mes]; if (!d) return 0;
  var arr = (linhaD === 'NEXUS' ? (d.prodDistNex||[]) : (d.prodDistVit||[]))
    .filter(function(r){ return r.distrito_id === distId; });
  return sumField(arr, 'cota');
}
function getRealDist(mes, distId, linhaD) {
  var d = DADOS_CACHE[mes]; if (!d) return 0;
  var arr = (linhaD === 'NEXUS' ? (d.prodDistNex||[]) : (d.prodDistVit||[]))
    .filter(function(r){ return r.distrito_id === distId; });
  return sumField(arr, 'realizado');
}

// Cota/Realizado por produto (regional)
function getCotaProd(mes, produto, linha) {
  var d = DADOS_CACHE[mes]; if (!d) return 0;
  var arr = linha === 'NEXUS' ? (d.prodNex||[]) : (d.prodVit||[]);
  for (var i = 0; i < arr.length; i++) {
    if (normProd(arr[i].produto) === normProd(produto)) return safeFloat(arr[i].cota) || 0;
  }
  return 0;
}
function getRealProd(mes, produto, linha) {
  var d = DADOS_CACHE[mes]; if (!d) return 0;
  var arr = linha === 'NEXUS' ? (d.prodNex||[]) : (d.prodVit||[]);
  for (var i = 0; i < arr.length; i++) {
    if (normProd(arr[i].produto) === normProd(produto)) return safeFloat(arr[i].realizado) || 0;
  }
  return 0;
}

// YTD: soma de todos os meses disponíveis
function calcYTD(meses, getFn) {
  return meses.reduce(function(s, m) { return s + (getFn(m) || 0); }, 0);
}

            afterBody: function(items) {
              var c = items[0] ? items[0].parsed.y : 0;

              if (!c || !r) return [];
              return ['  Atingimento:  ' + (r / c * 100).toFixed(1) + '%'];

      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11, weight: '700' } } },

            if (v >= 1e6) return 'R$ ' + (v/1e6).toFixed(1) + 'M';
            return 'R$ ' + (v/1e3).toFixed(0) + 'k';
          }, font: { size: 10 } },
          grid: { color: '#f0f0f0' }
        }
      }
    }

// ── Incremento de Cota ───────────────────────────────────────────

// Calcula array de deltas mês a mês: [{abs, pct}] — índice 0 = null (sem mês anterior)
function calcIncrementos(meses, getCotaFn) {
  return meses.map(function(m, i) {
    if (i === 0) return null;
    var prev = getCotaFn(meses[i - 1]);
    var curr = getCotaFn(m);
    if (!prev || !curr) return null;
    return { abs: curr - prev, pct: (curr - prev) / prev * 100 };
  });
}

            return '  Δ Cota:  ' + (v >= 0 ? '+' : '') + fmtBRL(Math.abs(v)).replace('R$ ', (v >= 0 ? '+R$ ' : '-R$ '));

function _incrRowCells(meses, getCotaFn) {
  var cells = '', prev = null;

    } else {
      var dAbs = (prev !== null && prev > 0) ? curr - prev : null;
      var dPct = (prev !== null && prev > 0) ? (curr - prev) / prev * 100 : null;
      var cls  = dAbs !== null ? (dAbs >= 0 ? 'cota-pct-ok' : 'cota-pct-crit') : '';
      var absStr = dAbs !== null
        ? (dAbs >= 0 ? '+R$ ' : '-R$ ') + Math.abs(Math.round(dAbs)).toLocaleString('pt-BR')
        : '—';
      var pctStr = dPct !== null ? (dPct >= 0 ? '+' : '') + dPct.toFixed(1) + '%' : '—';

      cells += '<td class="' + cls + '">' + absStr + '</td>';

function renderCotaIncrementoTable(meses, distritos) {
  var nexusDists = distritos.filter(function(d){ return d.linha === 'NEXUS'; });
  var vitalDists = distritos.filter(function(d){ return d.linha === 'VITAL'; });
  // Total de colunas de dados: 1 (base) + (n-1)*3
  var nDataCols = 1 + (meses.length - 1) * 3;

  var html = '<div class="cota-table-wrap"><table class="cota-table">';
  html += '<thead><tr>';
  html += '<th class="th-label" rowspan="2">Nível / Distrito</th>';
  html += _incrMakeHeaderCols(meses);
  html += '</tr><tr>' + _incrMakeSubCols(meses) + '</tr></thead><tbody>';

  // Regional / NEXUS / VITAL
  html += '<tr class="row-total"><td class="td-label">Total Regional</td>' + _incrRowCells(meses, function(m){ return getCotaReg(m, null); }) + '</tr>';
  html += '<tr class="row-nexus"><td class="td-label">↳ NEXUS</td>' + _incrRowCells(meses, function(m){ return getCotaReg(m, 'NEXUS'); }) + '</tr>';
  html += '<tr class="row-vital"><td class="td-label">↳ VITAL</td>' + _incrRowCells(meses, function(m){ return getCotaReg(m, 'VITAL'); }) + '</tr>';

  // Distritos NEXUS
  html += '<tr class="row-nexus"><td class="td-label" colspan="' + (nDataCols + 1) + '" style="font-size:9.5px;letter-spacing:.8px;padding:6px 10px">NEXUS — distritos</td></tr>';
  nexusDists.forEach(function(d, i) {
    var cor = ANUAL_NEXUS_COLORS[i % ANUAL_NEXUS_COLORS.length];
    html += '<tr class="row-dist"><td class="td-label"><span style="display:inline-flex;align-items:center;gap:6px">' +
      '<span style="width:7px;height:7px;border-radius:50%;background:' + cor + ';flex-shrink:0"></span>' +
      (d.ab || d.nome || d.distrito_id) + '</span></td>' +
      _incrRowCells(meses, function(m){ return getCotaDist(m, d.distrito_id, 'NEXUS'); }) + '</tr>';
  });

  // Distritos VITAL
  html += '<tr class="row-vital"><td class="td-label" colspan="' + (nDataCols + 1) + '" style="font-size:9.5px;letter-spacing:.8px;padding:6px 10px">VITAL — distritos</td></tr>';
  vitalDists.forEach(function(d, i) {
    var cor = ANUAL_VITAL_COLORS[i % ANUAL_VITAL_COLORS.length];
    html += '<tr class="row-dist"><td class="td-label"><span style="display:inline-flex;align-items:center;gap:6px">' +
      '<span style="width:7px;height:7px;border-radius:50%;background:' + cor + ';flex-shrink:0"></span>' +
      (d.ab || d.nome || d.distrito_id) + '</span></td>' +
      _incrRowCells(meses, function(m){ return getCotaDist(m, d.distrito_id, 'VITAL'); }) + '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

// Tabela de incremento por produto (NEXUS ou VITAL)
function renderCotaIncrementoProdutoTable(meses, linha) {
  // Coleta todos os produtos únicos (union dos meses)
  var produtosSet = {};
  meses.forEach(function(m) {
    var d = DADOS_CACHE[m]; if (!d) return;
    var arr = linha === 'NEXUS' ? (d.prodNex || []) : (d.prodVit || []);
    arr.forEach(function(r) { if (r.produto) produtosSet[normProd(r.produto)] = r.produto; });
  });
  var produtos = Object.keys(produtosSet).sort(function(a, b) {
    var ak = isMarcaChave(a, linha) ? 0 : 1;
    var bk = isMarcaChave(b, linha) ? 0 : 1;
    return ak !== bk ? ak - bk : a.localeCompare(b);
  });

  if (!produtos.length) {
    return '<p style="color:var(--gray);font-size:12px;padding:12px 0">Sem dados de produto para ' + linha + '.</p>';
  }

  var nDataCols = 1 + (meses.length - 1) * 3;

  var html = '<div class="cota-table-wrap"><table class="cota-table">';
  html += '<thead><tr>';
  html += '<th class="th-label" rowspan="2">Produto</th>';
  html += _incrMakeHeaderCols(meses);
  html += '</tr><tr>' + _incrMakeSubCols(meses) + '</tr></thead><tbody>';

  produtos.forEach(function(pNorm) {
    var pNome = produtosSet[pNorm];
    var isMC  = isMarcaChave(pNorm, linha);
    html += '<tr class="row-prod' + (isMC ? ' row-prod-chave' : '') + '">';
    html += '<td class="td-label">' + pNome + (isMC ? '<span class="mc-badge">★ CHAVE</span>' : '') + '</td>';
    html += _incrRowCells(meses, function(m){ return getCotaProd(m, pNorm, linha); });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

async function abrirEvolucaoCota() {
  VIEW_ATUAL = 'cota';
  DISTRITO_ATIVO = null;
  var meses = CONFIG._meses || [];
  window._mesesDisponiveis = meses;
  renderCycleBar(meses, null);
  mostrarLoading(true);
  try {
    setLoadingTxt('Carregando evolução de cota…');
    var promises = meses.map(function(m){ return carregarMes(m).catch(function(){}); });
    await Promise.all(promises);
    var mesPivot = meses[meses.length - 1];
    var dadosPivot = DADOS_CACHE[mesPivot];
    if (!dadosPivot) throw new Error('Sem dados para montar a evolução de cota.');
    renderEvolucaoCota(meses, dadosPivot.distritos || []);
  } catch(e) {
    renderErro(e.message);
  }
  mostrarLoading(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Renderização: Distrito cards ──────────────────────────────────

function renderDistritoCard(d, reps) {
  var cls     = d.linha === 'NEXUS' ? 'nc' : 'vc';
  var _dprod  = safeFloat(d.prod);
  var prodPct = _dprod !== null ? (_dprod * 100).toFixed(1) : '—';
  var ativo   = DISTRITO_ATIVO === d.distrito_id ? ' ativo' : '';

  // Mini-jornada da equipe do distrito
  var repsD = reps.filter(function(r) {
    return r.distrito_id === d.distrito_id && r.vago !== 'True' && r.vago !== true;
  });
  var miniJ = {};
  repsD.forEach(function(r) {
    var e = getJornadaRep(r.setor_id, r.nome);
    miniJ[e] = (miniJ[e] || 0) + 1;
  });
  var miniJHtml = '';
  if (Object.keys(miniJ).length) {
    miniJHtml = '<div class="jornada-mini">' +
      JORNADA_ORDER.filter(function(s){return miniJ[s];}).map(function(s){
        var c = jornadaCfg(s);
        return '<span style="display:inline-block;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:700;background:' + c.bg + ';color:' + c.color + ';border:1px solid ' + c.border + '">' + s + ' ' + miniJ[s] + '</span>';
      }).join('') +
    '</div>';
  }

  return '<div class="dcard ' + cls + ativo + '" onclick="abrirDistrito(\'' + d.distrito_id + '\')">' +
    '<div class="dcard-hd">' +
      '<div class="dcard-linha">' + d.linha + '</div>' +
      '<div class="dcard-nome">' + (d.ab || d.nm || d.distrito_id) + '</div>' +
      '<div class="dcard-cod">' + d.distrito_id + '</div>' +
      '<div class="prod-badge"><div class="pb-n">' + prodPct + '%</div><div class="pb-l">PROD MDV</div></div>' +
    '</div>' +
    '<div class="dcard-body">' +
      '<div class="diag ' + dgClass(d.diagnostico) + '">' + dgIcon(d.diagnostico) + ' ' +
        (d.diagnostico === 'ok' ? 'Prod. 100%+' : d.diagnostico === 'warn' ? 'Prod. abaixo da meta' : 'Crítico — Plano urgente') +
      '</div>' +
      miniJHtml +
    '</div>' +
    '<div class="dcard-ft">' +
      '<span class="dcard-reps">' + (d.reps_ativos || '—') + ' reps ativos</span>' +
      '<span class="dcard-cta">' + (DISTRITO_ATIVO === d.distrito_id ? 'Fechar ✕' : 'Ver detalhes →') + '</span>' +
    '</div>' +
  '</div>';
}

// ── Distrito detalhe ─────────────────────────────────────────────

function abrirDistrito(distritoId) {
  // Toggle
  if (DISTRITO_ATIVO === distritoId) {
    fecharDistrito();
    return;
  }
  fecharDistrito(true);
  DISTRITO_ATIVO = distritoId;

  var d = window._D;
  if (!d) return;

  var distrito = d.distritos.find(function(x) { return x.distrito_id === distritoId; });
  if (!distrito) return;

  var repsD = d.reps.filter(function(r) {
    return r.distrito_id === distritoId && r.vago !== 'True' && r.vago !== true;
  });

  var isNexus = distrito.linha === 'NEXUS';
  var linhaColor = isNexus ? 'var(--nexus)' : 'var(--red)';
  var prodRepD = (isNexus ? d.prodRepNex : d.prodRepVit)
    .filter(function(p) { return p.distrito_id === distritoId; });

  // Header
  var html = '<div class="dd-hdr">' +
    '<span class="dd-linha-tag" style="background:' + (isNexus ? 'var(--nexus-l)' : 'var(--red-l)') + ';color:' + linhaColor + '">' + distrito.linha + '</span>' +
    '<span class="dd-title">' + (distrito.ab || distrito.nm || distritoId) + '</span>' +
    '<span class="dd-cod">' + distritoId + '</span>' +
    '<button class="dd-close" onclick="fecharDistrito()">✕</button>' +
  '</div>';

  // Tabela de reps com jornada
  html += '<div class="dd-section-lbl">Equipe &amp; Jornada da Evolução</div>';
  html += '<div style="overflow-x:auto"><table class="dd-rep-table"><thead><tr>' +
    '<th>Representante</th><th>Setor</th><th>Jornada</th>' +
    '<th>Prod. %</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Cob. Painel</th>' +
    '</tr></thead><tbody>';

  repsD.forEach(function(r) {
    var etapa   = getJornadaRep(r.setor_id, r.nome);
    var prodPct = safeFloat(r.prod);
    html += '<tr>' +
      '<td style="font-weight:600">' + (r.nome || '—') + '</td>' +
      '<td style="color:var(--gray);font-size:11px">' + (r.setor_id || '—') + '</td>' +
      '<td>' + jornadaBadge(etapa) + '</td>' +
      '<td style="' + prodColor(prodPct) + ';font-weight:700">' + (prodPct !== null ? prodPct.toFixed(1) + '%' : '—') + '</td>' +
      '<td>' + pct(r.q1) + '</td>' +
      '<td>' + pct(r.q2) + '</td>' +
      '<td>' + pct(r.q3) + '</td>' +
      '<td>' + pct(r.q4) + '</td>' +
      '<td>' + pct(r.cob_painel) + '</td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';

  // Tabela de produto por rep (se disponível)
  if (prodRepD.length) {
    var produtos = [];
    prodRepD.forEach(function(p) { if (produtos.indexOf(p.produto) < 0) produtos.push(p.produto); });
    var linhaD = isNexus ? 'NEXUS' : 'VITAL';
    // Marcas chave primeiro, depois restante alfabético
    produtos.sort(function(a, b) {
      var ak = isMarcaChave(a, linhaD) ? 0 : 1;
      var bk = isMarcaChave(b, linhaD) ? 0 : 1;
      if (ak !== bk) return ak - bk;
      return a.localeCompare(b);
    });

    html += '<div class="dd-section-lbl" style="margin-top:18px">Atingimento por Produto — Representante</div>';
    html += '<div style="overflow-x:auto"><table class="prod-table"><thead><tr><th>Produto</th>';
    repsD.forEach(function(r) {
      var primeiro = (r.nome || r.setor_id).split(' ')[0];
      html += '<th class="r" title="' + (r.nome || r.setor_id) + '">' + primeiro + '</th>';
    });
    html += '</tr></thead><tbody>';

    produtos.forEach(function(produto) {
      var isMC = isMarcaChave(produto, linhaD);
      html += '<tr' + (isMC ? ' class="prod-chave"' : '') + '>' +
        '<td class="prod-nome">' + produto + (isMC ? '<span class="mc-badge">★ CHAVE</span>' : '') + '</td>';
      repsD.forEach(function(r) {
        var reg = prodRepD.find(function(p) { return p.produto === produto && p.setor_id === r.setor_id; });
        if (reg && reg.ating_pct !== null && reg.ating_pct !== undefined && reg.ating_pct !== '') {
          var at = parseFloat(reg.ating_pct);
          html += '<td class="r ' + atClass(at) + '">' + at.toFixed(1) + '%</td>';
        } else {
          html += '<td class="r" style="color:#ccc">—</td>';
        }
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  } else {
    html += '<div style="margin-top:12px;font-size:11px;color:var(--gray);padding:10px;background:var(--light);border-radius:6px">💡 Dados de produto por representante disponíveis após executar <code>ingest.py --mes ' + MES_ATUAL + '</code></div>';
  }

  // Exibe no painel correto
  var panelId = isNexus ? 'detalhe-nexus' : 'detalhe-vital';
  var panel   = document.getElementById(panelId);
  if (panel) {
    panel.innerHTML = html;
    panel.classList.add('open');
    // Re-renderiza os cards para marcar o ativo
    reRenderGrids(d.distritos, d.reps);
    setTimeout(function() { panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
  }
}

function fecharDistrito(silencioso) {
  DISTRITO_ATIVO = null;
  document.querySelectorAll('.distrito-detalhe').forEach(function(el) {
    el.classList.remove('open');
    el.innerHTML = '';
  });
  if (!silencioso && window._D) {
    reRenderGrids(window._D.distritos, window._D.reps);
  }
}

function reRenderGrids(distritos, reps) {
  var nexus = distritos.filter(function(d){ return d.linha === 'NEXUS'; });
  var vital = distritos.filter(function(d){ return d.linha === 'VITAL'; });
  var gn = document.getElementById('grid-nexus');
  var gv = document.getElementById('grid-vital');
  if (gn) gn.innerHTML = nexus.map(function(d){ return renderDistritoCard(d, reps); }).join('');
  if (gv) gv.innerHTML = vital.map(function(d){ return renderDistritoCard(d, reps); }).join('');
}

// ── Renderização: Produto Atingimento ────────────────────────────

function renderProdutoAtingimento(dados) {
  var html = '<div class="prod-ating-card" id="prod-ating">';
  html += '<div class="card-title"><div class="cc-bar"></div>Atingimento por Produto</div>';

  // Linha tabs (Nexus | Vital)
  html += '<div class="prod-tabs-row">' +
    '<button class="ptab linha-nexus' + (PROD_LINHA === 'NEXUS' ? ' active' : '') + '" onclick="switchProdLinha(\'NEXUS\')">NEXUS</button>' +
    '<button class="ptab' + (PROD_LINHA === 'VITAL' ? ' active' : '') + '" onclick="switchProdLinha(\'VITAL\')">VITAL</button>' +
    '<div class="ptab-sep"></div>' +
    '<button class="ptab' + (PROD_NIVEL === 'regional' ? ' active' : '') + '" onclick="switchProdNivel(\'regional\')">Regional</button>' +
    '<button class="ptab' + (PROD_NIVEL === 'distrito' ? ' active' : '') + '" onclick="switchProdNivel(\'distrito\')">Por Distrito</button>' +
    '<button class="ptab' + (PROD_NIVEL === 'rep' ? ' active' : '') + '" onclick="switchProdNivel(\'rep\')">Por Representante</button>' +
  '</div>';

  html += '<div id="prod-content"></div>';
  html += '</div>';
  return html;
}

function switchProdLinha(linha) {
  PROD_LINHA = linha;
  PROD_DIST_SEL = null;
  // Atualiza estilo dos botões de linha
  document.querySelectorAll('.prod-ating-card .ptab.linha-nexus').forEach(function(b){
    b.classList.toggle('active', linha === 'NEXUS');
  });
  document.querySelectorAll('.prod-ating-card .ptab:not(.linha-nexus)').forEach(function(b, i){
    if (i === 0) b.classList.toggle('active', linha === 'VITAL');
  });
  atualizarProdContent();
}

function switchProdNivel(nivel) {
  PROD_NIVEL = nivel;
  PROD_DIST_SEL = null;
  // Re-renderiza a seção inteira para atualizar estados dos botões
  var card = document.getElementById('prod-ating');
  if (card && window._D) {
    var novoHtml = renderProdutoAtingimento(window._D);
    card.outerHTML = novoHtml;
    atualizarProdContent();
  }
}

function selectProdDist(did) {
  PROD_DIST_SEL = did;
  atualizarProdContent();
  // Atualiza visual dos botões de distrito
  document.querySelectorAll('.pdist-btn').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-did') === did);
  });
}

function atualizarProdContent() {
  var p = window._D;
  if (!p) return;
  var el = document.getElementById('prod-content');
  if (!el) return;

  var prodReg  = PROD_LINHA === 'NEXUS' ? p.prodNex      : p.prodVit;
  var prodDist = PROD_LINHA === 'NEXUS' ? p.prodDistNex  : p.prodDistVit;
  var prodRep  = PROD_LINHA === 'NEXUS' ? p.prodRepNex   : p.prodRepVit;
  var distrLinha = p.distritos.filter(function(d){ return d.linha === PROD_LINHA; });

  var html = '';

  if (PROD_NIVEL === 'regional') {
    html = renderProdTableSimples(prodReg, PROD_LINHA);

  } else if (PROD_NIVEL === 'distrito') {
    html += renderDistPills(distrLinha);
    if (PROD_DIST_SEL) {
      var filtrado = prodDist.filter(function(p) { return p.distrito_id === PROD_DIST_SEL; });
      html += filtrado.length
        ? renderProdTableSimples(filtrado, PROD_LINHA)
        : '<div class="prod-empty">Sem dados de produto por distrito. Execute <code>ingest.py --mes ' + MES_ATUAL + '</code></div>';
    } else {
      html += '<div class="prod-empty">Selecione um distrito acima.</div>';
    }

  } else if (PROD_NIVEL === 'rep') {
    html += renderDistPills(distrLinha);
    if (PROD_DIST_SEL) {
      var filtradoRep = prodRep.filter(function(p) { return p.distrito_id === PROD_DIST_SEL; });
      html += filtradoRep.length
        ? renderProdTablePorRep(filtradoRep, PROD_LINHA)
        : '<div class="prod-empty">Sem dados de produto por representante. Execute <code>ingest.py --mes ' + MES_ATUAL + '</code></div>';
    } else {
      html += '<div class="prod-empty">Selecione um distrito acima.</div>';
    }
  }

  el.innerHTML = html;
}

function renderDistPills(distritos) {
  return '<div class="prod-dist-pills">' +
    distritos.map(function(d) {
      return '<button class="pdist-btn' + (PROD_DIST_SEL === d.distrito_id ? ' active' : '') +
        '" data-did="' + d.distrito_id + '" onclick="selectProdDist(\'' + d.distrito_id + '\')">' +
        (d.ab || d.distrito_id) + '</button>';
    }).join('') +
  '</div>';
}

function renderProdTableSimples(dados, linha) {
  if (!dados || !dados.length) {
    return '<div class="prod-empty">Sem dados de produto disponíveis para este período.</div>';
  }
  // Marcas chave primeiro, depois restante alfabético
  var sorted = dados.slice().sort(function(a, b) {
    var ak = isMarcaChave(a.produto, linha) ? 0 : 1;
    var bk = isMarcaChave(b.produto, linha) ? 0 : 1;
    if (ak !== bk) return ak - bk;
    return (a.produto || '').localeCompare(b.produto || '');
  });
  var temAting = sorted.some(function(r) { return r.ating_pct !== null && r.ating_pct !== undefined && r.ating_pct !== ''; });
  var temCresc  = sorted.some(function(r) { return r.crescimento !== null && r.crescimento !== undefined && r.crescimento !== ''; });
  var temCob    = sorted.some(function(r) { return r.cobertura   !== null && r.cobertura   !== undefined && r.cobertura   !== ''; });

  var html = '<div style="overflow-x:auto"><table class="prod-table"><thead><tr>' +
    '<th>Produto</th><th class="r">Cota</th><th class="r">Realizado</th>';
  if (temAting) html += '<th class="r">Ating. %</th>';
  if (temCresc) html += '<th class="r">Cresc. %</th>';
  if (temCob)   html += '<th class="r">Cob. %</th>';
  html += '</tr></thead><tbody>';

  sorted.forEach(function(r) {
    var isMC = isMarcaChave(r.produto, linha);
    var at = (r.ating_pct !== null && r.ating_pct !== '' && r.ating_pct !== undefined)
      ? parseFloat(r.ating_pct) : null;
    if (at === null && r.cota && r.realizado && parseFloat(r.cota) > 0) {
      at = parseFloat(r.realizado) / parseFloat(r.cota) * 100;
    }
    html += '<tr' + (isMC ? ' class="prod-chave"' : '') + '>' +
      '<td class="prod-nome">' + (r.produto || '—') +
        (isMC ? '<span class="mc-badge">★ CHAVE</span>' : '') + '</td>' +
      '<td class="r">' + numBR(r.cota) + '</td>' +
      '<td class="r">' + numBR(r.realizado) + '</td>';
    if (temAting) html += '<td class="r ' + atClass(at) + '">' + (at !== null ? at.toFixed(1) + '%' : '—') + '</td>';
    if (temCresc) html += '<td class="r">' + pct(r.crescimento) + '</td>';
    if (temCob)   html += '<td class="r">' + pct(r.cobertura)   + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderProdTablePorRep(dados, linha) {
  if (!dados || !dados.length) {
    return '<div class="prod-empty">Sem dados.</div>';
  }
  var produtos = [];
  dados.forEach(function(p) { if (produtos.indexOf(p.produto) < 0) produtos.push(p.produto); });
  // Marcas chave primeiro, depois restante alfabético
  produtos.sort(function(a, b) {
    var ak = isMarcaChave(a, linha) ? 0 : 1;
    var bk = isMarcaChave(b, linha) ? 0 : 1;
    if (ak !== bk) return ak - bk;
    return a.localeCompare(b);
  });

  var repsIds = [];
  var repNomes = {};
  dados.forEach(function(r) {
    if (repsIds.indexOf(r.setor_id) < 0) repsIds.push(r.setor_id);
    repNomes[r.setor_id] = r.nome || r.setor_id;
  });

  var html = '<div style="overflow-x:auto"><table class="prod-table"><thead><tr><th>Produto</th>';
  repsIds.forEach(function(rid) {
    var primo = (repNomes[rid] || rid).split(' ')[0];
    html += '<th class="r" title="' + (repNomes[rid] || rid) + '">' + primo + '</th>';
  });
  html += '</tr></thead><tbody>';

  produtos.forEach(function(produto) {
    var isMC = isMarcaChave(produto, linha);
    html += '<tr' + (isMC ? ' class="prod-chave"' : '') + '>' +
      '<td class="prod-nome">' + produto + (isMC ? '<span class="mc-badge">★ CHAVE</span>' : '') + '</td>';
    repsIds.forEach(function(rid) {
      var reg = dados.find(function(p) { return p.produto === produto && p.setor_id === rid; });
      var at = null;
      if (reg) {
        if (reg.ating_pct !== null && reg.ating_pct !== undefined && reg.ating_pct !== '') {
          at = parseFloat(reg.ating_pct);
        } else if (reg.cota && reg.realizado && parseFloat(reg.cota) > 0) {
          at = parseFloat(reg.realizado) / parseFloat(reg.cota) * 100;
        }
      }
      if (at !== null) {
        html += '<td class="r ' + atClass(at) + '">' + at.toFixed(1) + '%</td>';
      } else {
        html += '<td class="r" style="color:#ccc">—</td>';
      }
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

// ── Achados e Chart ───────────────────────────────────────────────

function renderAchados(distritos) {
  var criticos = distritos.filter(function(d){ return d.diagnostico === 'crit'; });
  var destaque = distritos.filter(function(d){ return d.diagnostico === 'ok';   });
  var atencao  = distritos.filter(function(d){ return d.diagnostico === 'warn'; });

  var html = '<div class="achados"><div class="sec-hdr"><div class="sec-title">Achados Estratégicos</div><div class="sec-line"></div></div>';

  if (criticos.length) {
    html += '<div class="achado r"><div class="achado-dim">🔴 Crítico</div><div class="achado-txt">' +
      criticos.map(function(d){ return (d.ab||d.distrito_id) + ' (' + d.linha + ')'; }).join(' · ') +
      ' — produtividade abaixo de 80%. Plano de ação imediato.</div></div>';
  }
  if (atencao.length) {
    html += '<div class="achado y"><div class="achado-dim">⚠ Atenção</div><div class="achado-txt">' +
      atencao.map(function(d){ return (d.ab||d.distrito_id); }).join(' · ') +
      ' — entre 80% e 99%. Monitorar tendência.</div></div>';
  }
  if (destaque.length) {
    html += '<div class="achado g"><div class="achado-dim">✔ Destaque</div><div class="achado-txt">' +
      destaque.map(function(d){ return (d.ab||d.distrito_id); }).join(' · ') +
      ' — atingiram 100%+. Identificar e replicar boas práticas.</div></div>';
  }
  html += '</div>';
  return html;
}

function renderChartProdutividade(distritos, mes) {
  return '<div class="chart-card">' +
    '<div class="card-title"><div class="cc-bar"></div>Produtividade por Distrito — ' + mes + '/2026</div>' +
    '<canvas id="chart-prod" height="80"></canvas>' +
    '</div>';
}

function buildChartProdutividade(distritos) {
  var el = document.getElementById('chart-prod');
  if (!el) return;
  if (CHART_PROD) { CHART_PROD.destroy(); CHART_PROD = null; }

  var labels = distritos.map(function(d){ return (d.ab||d.distrito_id) + '\n' + d.linha; });
  var valores = distritos.map(function(d){ return d.prod !== null ? parseFloat(d.prod)*100 : 0; });
  var cores = distritos.map(function(d){
    var p = parseFloat(d.prod)||0;
    return p >= 1.0 ? 'rgba(21,105,58,.75)' : p >= 0.8 ? 'rgba(232,119,34,.75)' : 'rgba(200,16,46,.8)';
  });

  CHART_PROD = new Chart(el.getContext('2d'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{ data: valores, backgroundColor: cores, borderRadius: 6, borderSkipped: false }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function(c){ return c.parsed.y.toFixed(1)+'%'; } } }
      },
      scales: {
        y: {
          beginAtZero: true, max: 130,
          ticks: { callback: function(v){ return v+'%'; } },
          grid: { color: '#f0f0f0' }
        },
        x: { grid: { display: false } }
      }
    }
  });
}

// ── Controller ────────────────────────────────────────────────────

function renderTudo(dados, mes) {
  PROD_DIST_SEL = null; // reset seleção de distrito no produto

  var distritos  = dados.distritos  || [];
  var reps       = dados.reps       || [];
  var nexus      = distritos.filter(function(d){ return d.linha === 'NEXUS'; });
  var vital      = distritos.filter(function(d){ return d.linha === 'VITAL'; });

  // Salva dados globalmente para uso nos painéis interativos
  window._D = dados;

  var html = '';

  // 1. KPIs
  html += renderKPIs(dados);

  // 2. JORNADA DA EVOLUÇÃO
  html += renderJornada(reps, distritos);

  // 3. PEX
  html += renderPEX(dados.pex || [], distritos);

  // 4. ANÁLISE & ALERTAS (preview — abre página dedicada)
  html += renderBotaoAnalise(dados, mes);

  // 6. NEXUS – cards + painel de detalhe
  html += '<div class="sec-hdr"><div class="sec-title">NEXUS</div><div class="sec-line"></div><span class="badge n">4 distritos</span></div>';
  html += '<div class="dgrid" id="grid-nexus">' + nexus.map(function(d){ return renderDistritoCard(d, reps); }).join('') + '</div>';
  html += '<div class="distrito-detalhe" id="detalhe-nexus"></div>';

  // 5. VITAL – cards + painel de detalhe
  html += '<div class="sec-hdr"><div class="sec-title">VITAL</div><div class="sec-line"></div><span class="badge v">4 distritos</span></div>';
  html += '<div class="dgrid" id="grid-vital">' + vital.map(function(d){ return renderDistritoCard(d, reps); }).join('') + '</div>';
  html += '<div class="distrito-detalhe" id="detalhe-vital"></div>';

  // 6. PRODUTO ATINGIMENTO
  html += renderProdutoAtingimento(dados);

  // 7. Chart
  html += renderChartProdutividade(distritos, mes);

  // 8. Achados
  html += renderAchados(distritos);

  document.getElementById('main-content').innerHTML = html;

  // Inicializa o conteúdo de produto
  atualizarProdContent();

  requestAnimationFrame(function(){ buildChartProdutividade(distritos); });
}

async function trocarMes(mes) {
  var wasAnual   = VIEW_ATUAL === 'anual';
  var wasCota    = VIEW_ATUAL === 'cota';
  var wasVisitas = VIEW_ATUAL === 'visitas';
  if (wasAnual || wasCota || wasVisitas) VIEW_ATUAL = 'principal';
  if (MES_ATUAL === mes && !wasAnual && !wasCota && !wasVisitas) return;
  MES_ATUAL = mes;
  DISTRITO_ATIVO = null;

  document.getElementById('pill-mes').textContent = mes + '/2026';
  document.querySelectorAll('.cycle-btn').forEach(function(btn){
    if (btn.classList.contains('anual-btn') || btn.classList.contains('cota-btn') || btn.classList.contains('visitas-btn')) {
      btn.classList.remove('active');
    } else {
      btn.classList.toggle('active', btn.textContent.startsWith(mes));
    }
  });

  mostrarLoading(true);
  try {
    var mesAnt = getMesAnterior(mes);
    var promises = [carregarMes(mes)];
    if (mesAnt) promises.push(carregarMes(mesAnt).catch(function(){}));
    var resultados = await Promise.all(promises);
    if (VIEW_ATUAL === 'analise') {
      renderViewAnalise(resultados[0], mes);
    } else {
      renderTudo(resultados[0], mes);
    }
  } catch(e) {
    renderErro(e.message);
  }
  mostrarLoading(false);
}

function renderErro(msg) {
  document.getElementById('main-content').innerHTML =
    '<div class="error-card">' +
    '<div class="error-icon">⚠️</div>' +
    '<div class="error-title">Erro ao carregar dados</div>' +
    '<div class="error-sub">' + (msg || 'Verifique a conexão e as configurações.') + '</div>' +
    '</div>';
}

function mostrarLoading(show) {
  document.getElementById('loading').style.display = show ? 'flex' : 'none';
}
function setLoadingTxt(txt) {
  var el = document.getElementById('loading-txt');
  if (el) el.textContent = txt;
}

// ── Init ──────────────────────────────────────────────────────────

async function init() {
  mostrarLoading(true);

  try {
    // Carregar config local (credenciais)
    setLoadingTxt('Carregando configuração…');
    var res = await fetch('config.json');
    if (!res.ok) throw new Error('config.json não encontrado. Execute python scripts/setup.py primeiro.');
    CONFIG = await res.json();

    if (!CONFIG.spreadsheet_id || !CONFIG.api_key) {
      throw new Error('SPREADSHEET_ID ou API_KEY não configurados em config.json.');
    }

    // ── Item 1: Meses ao vivo direto do Sheets ──
    setLoadingTxt('Buscando meses disponíveis…');
    var meses = CONFIG.meses_disponiveis || [];
    try {
      var cfgRows = await fetchAba('config');
      var mesesStr = '';
      cfgRows.forEach(function(r) {
        if (r.chave === 'meses_disponiveis') mesesStr = r.valor || '';
      });
      if (mesesStr) {
        var mesesSheets = mesesStr.split(',').map(function(m){ return m.trim(); }).filter(Boolean);
        if (mesesSheets.length) meses = mesesSheets; // usa o Sheets (mais atualizado)
      }
    } catch(e) {
      console.warn('Não foi possível ler meses do Sheets — usando config.json');
    }

    if (!meses.length) throw new Error('Nenhum mês disponível. Execute pipeline.py primeiro.');

    CONFIG._meses = meses; // guarda para uso em abrirVisaoAnual()

    var mesInicial = CONFIG.mes_padrao || meses[meses.length - 1];
    MES_ATUAL = mesInicial;

    document.getElementById('pill-mes').textContent = mesInicial + '/2026';
    document.getElementById('pill-atualizacao').textContent =
      'Atualizado: ' + (CONFIG.ultima_atualizacao ? CONFIG.ultima_atualizacao.substring(0,10) : '—');

    renderCycleBar(meses, mesInicial);

    // Carrega jornada, mês atual e mês anterior (para análise comparativa) em paralelo
    setLoadingTxt('Carregando dados do time…');
    var mesAntInicial = getMesAnterior(mesInicial);
    var initPromises = [carregarJornada(), carregarMes(mesInicial)];
    if (mesAntInicial) initPromises.push(carregarMes(mesAntInicial).catch(function(){}));
    await Promise.all(initPromises);

    renderTudo(DADOS_CACHE[mesInicial], mesInicial);

  } catch(e) {
    renderErro(e.message);
  }

  mostrarLoading(false);
}

init();
</script>
