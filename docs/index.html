function renderPEX(pex, distritos) {
  if (!pex || !pex.length) {
    return '<div class="pex-wrap">' +
      '<div class="jornada-sec-hdr">' +
        '<div class="sec-title" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px">Panorama — PEX</div>' +
        '<div class="sec-line" style="flex:1;height:1px;background:var(--border)"></div>' +
      '</div>' +
      '<div style="background:#fff;border-radius:12px;padding:28px;text-align:center;color:var(--gray);font-size:13px;box-shadow:0 1px 8px rgba(0,0,0,.06)">' +
        '📊 Dados de PEX ainda não disponíveis para este mês.<br>' +
        '<span style="font-size:11px;margin-top:6px;display:inline-block">Execute: <code>python scripts/ingest.py --pex --mes ' + (MES_ATUAL||'MES') + '</code></span>' +
      '</div>' +
    '</div>';
  }

  // Agrupa por medalha
  var grupos = {};
  PEX_ORDER.forEach(function(m) { grupos[m] = []; });
  pex.forEach(function(r) {
    var med = (r.medalha || 'CRÍTICO').toUpperCase();
    // normaliza acentuação
    if (med === 'ATENCAO' || med === 'ATENÇAO' || med === 'ATENÇÃO') med = 'ATENÇÃO';
    if (med === 'CRITICO' || med === 'CRÍTICO') med = 'CRÍTICO';
    if (!grupos[med]) med = 'CRÍTICO';
    grupos[med].push(r);
  });

  var totalReps = pex.length;

  function buildPexCol(medal) {
    var cfg   = PEX_CFG[medal];
    var ptCol = PEX_PT_COLOR[medal] || 'color:var(--gray)';
    var grup  = grupos[medal] || [];

    // Ordena por pts desc
    grup.sort(function(a, b) {
      var pa = parseFloat(a.pts) || 0;
      var pb = parseFloat(b.pts) || 0;
      return pb - pa;
    });

    var n = grup.length;

    var linhas = grup.map(function(r) {
      var pts    = (r.pts !== null && r.pts !== undefined && r.pts !== '') ? parseFloat(r.pts) : null;
      var ptsStr = pts !== null ? pts.toFixed(1) : '—';
      // Busca GD abreviado pelo distrito_id do rep
      var gd = r.ab || getGDAbrev(r.distrito_id, distritos) || '';
      return '<div class="pexrep">' +
        '<span class="pexrep-nome" title="' + (r.nome||'') + '">' + (r.nome||'—') + '</span>' +
        '<span class="pexrep-gd">' + gd + '</span>' +
        '<span class="pexrep-pts" style="' + ptCol + '">' + ptsStr + '</span>' +
      '</div>';
    }).join('');

    return '<div class="pexcol ' + cfg.cls + '">' +
      // Header
      '<div class="pexcol-hdr">' +
        '<div class="pexcol-icon">' + cfg.icon + '</div>' +
        '<div class="pexcol-titulo">' + medal + '</div>' +
        '<div class="pexcol-range">' + cfg.range + '</div>' +
        '<div class="pexcol-count">' +
          '<div class="pexcol-num">' + n + '</div>' +
          '<div class="pexcol-label">Reps</div>' +
        '</div>' +
      '</div>' +
      // Lista
      '<div class="pexcol-list">' +
        (linhas || '<div class="pex-empty">Nenhum representante</div>') +
      '</div>' +
    '</div>';
  }

  var colunasHtml = PEX_ORDER.map(buildPexCol).join('');

  return '<div class="pex-wrap">' +
    '<div class="jornada-sec-hdr">' +
      '<div class="sec-title" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px">Panorama — PEX</div>' +
      '<div class="sec-line" style="flex:1;height:1px;background:var(--border)"></div>' +
      '<span style="font-size:11px;color:var(--gray);font-weight:600">' + totalReps + ' reps avaliados</span>' +
    '</div>' +
    '<div class="pex-panorama">' + colunasHtml + '</div>' +
  '</div>';
}

// ── Renderização: Análise & Alertas ──────────────────────────────

function mediaProdDistritos(dists) {
  var vals = (dists || [])
    .map(function(d){ var f = safeFloat(d.prod); return f !== null ? f * 100 : null; })
    .filter(function(v){ return v !== null; });
  return vals.length ? vals.reduce(function(a,b){return a+b;},0) / vals.length : null;
}

// ── Helpers de produto para análise ──────────────────────────────

function mediaAtProdArr(arr) {
  var vals = (arr || []).map(function(r){ return safeFloat(r.ating_pct); })
                        .filter(function(v){ return v !== null && v > 0; });
  return vals.length ? vals.reduce(function(a,b){return a+b;},0) / vals.length : null;
}

function mediaAtProdDist(arr, distId) {
  return mediaAtProdArr((arr || []).filter(function(r){ return r.distrito_id === distId; }));
}

// Helper: média de um campo Q para os reps de um distrito
function mediaQDist(repsArr, distId, qKey) {
  var vals = repsArr
    .filter(function(r){ return r.distrito_id === distId; })
    .map(function(r){ return safeFloat(r[qKey]); })
    .filter(function(v){ return v !== null; });
  return vals.length ? vals.reduce(function(a,b){return a+b;},0) / vals.length : null;
}

// Grid de 8 distritos mostrando Q1-Q4 com delta vs mês anterior
function buildEvoGridQ(dists, repsAtu, repsAnt) {
  var QS = [
    { key:'q1', label:'Q1' }, { key:'q2', label:'Q2' },
    { key:'q3', label:'Q3' }, { key:'q4', label:'Q4' }
  ];
  var html = '<div class="evo-grid">';
  dists.forEach(function(d) {
    var linhaClr = d.linha === 'NEXUS' ? 'var(--nexus)' : 'var(--red)';
    var algumQ   = false;
    var rows     = '';
    QS.forEach(function(qItem) {
      var pAt = mediaQDist(repsAtu, d.distrito_id, qItem.key);
      var pAn = mediaQDist(repsAnt, d.distrito_id, qItem.key);
      if (pAt === null && pAn === null) return;
      algumQ = true;
      var del     = (pAt !== null && pAn !== null) ? pAt - pAn : null;
      var delCls  = del === null ? 'color:#aaa' : del >= 1 ? 'color:#059669' : del <= -1 ? 'color:#ef4444' : 'color:#d97706';
      var delIcon = del === null ? '' : del >= 1 ? '▲' : del <= -1 ? '▼' : '●';
      var delStr  = del !== null ? (del >= 0 ? '+' : '') + del.toFixed(1) + 'pp' : '—';
      rows += '<div style="display:flex;align-items:center;gap:4px;font-size:11px;border-top:1px solid #f0f0f0;padding:3px 0">' +
        '<span style="color:var(--gray);font-weight:700;min-width:18px">' + qItem.label + '</span>' +
        '<span style="color:#bbb;font-size:10px">' + (pAn !== null ? pAn.toFixed(1)+'%' : '—') + '</span>' +
        '<span style="color:#ddd;font-size:10px">→</span>' +
        '<span style="font-weight:800;flex:1">' + (pAt !== null ? pAt.toFixed(1)+'%' : '—') + '</span>' +
        '<span style="' + delCls + ';font-weight:700;font-size:10px;white-space:nowrap">' + delIcon + (del !== null ? ' '+delStr : '') + '</span>' +
      '</div>';
    });
    html += '<div class="evo-dist-item" style="background:#f9fafb">' +
      '<div class="evo-dist-linha" style="color:' + linhaClr + '">' + d.linha + '</div>' +
      '<div class="evo-dist-nome" title="' + (d.nm||d.ab||d.distrito_id) + '">' + (d.ab||d.distrito_id) + '</div>' +
      (algumQ ? rows : '<div style="font-size:10px;color:#ccc;margin-top:6px">Sem dados Q</div>') +
    '</div>';
  });
  html += '</div>';
  return html;
}

// Retorna badge de delta (evo card) — reutilizável
function evoBadge(del, suffix) {
  suffix = suffix || 'pp';
  var cls  = del === null ? 'color:#aaa' : del >=  0.5 ? 'color:#059669' : del <= -0.5 ? 'color:#ef4444' : 'color:#d97706';
  var icon = del === null ? '' : del >= 0.5 ? '▲ +' : del <= -0.5 ? '▼ ' : '● ±';
  var str  = del !== null ? Math.abs(del).toFixed(1) + suffix : '—';
  var bg   = del === null ? '#f3f4f6' : del >= 0.5 ? '#f0fdf4' : del <= -0.5 ? '#fff1f2' : '#fffbeb';
  return { cls: cls, icon: icon, str: str, bg: bg };
}

// Monta grid de 8 distritos para evo card
function buildEvoGrid(dists, getAt, getAn) {
  var html = '<div class="evo-grid">';
  dists.forEach(function(d) {
    var pAt = getAt(d);
    var pAn = getAn(d);
    var del = (pAt !== null && pAn !== null) ? pAt - pAn : null;
    var delCls  = del === null ? 'color:#aaa' : del >=  1 ? 'color:#059669' : del <= -1 ? 'color:#ef4444' : 'color:#d97706';
    var delIcon = del === null ? '—' : del >= 1 ? '▲' : del <= -1 ? '▼' : '●';
    var delStr  = del !== null ? (del >= 0 ? '+' : '') + del.toFixed(1) + 'pp' : '—';
    var bgItem  = del === null ? '#f9f9f9' : del >= 2 ? '#f0fdf4' : del <= -2 ? '#fff1f2' : '#fffbeb';
    var linhaClr = d.linha === 'NEXUS' ? 'var(--nexus)' : 'var(--red)';
    html += '<div class="evo-dist-item" style="background:' + bgItem + '">' +
      '<div class="evo-dist-linha" style="color:' + linhaClr + '">' + d.linha + '</div>' +
      '<div class="evo-dist-nome" title="' + (d.nm||d.ab||d.distrito_id) + '">' + (d.ab||d.distrito_id) + '</div>' +
      '<div class="evo-dist-prods">' +
        '<span style="color:#aaa;font-size:11px">' + (pAn !== null ? pAn.toFixed(1)+'%' : '—') + '</span>' +
        '<span style="color:#ccc;font-size:10px">→</span>' +
        '<span style="font-weight:800;font-size:13px">' + (pAt !== null ? pAt.toFixed(1)+'%' : '—') + '</span>' +
      '</div>' +
      '<div class="evo-dist-delta" style="' + delCls + '">' + delIcon + ' ' + delStr + '</div>' +
    '</div>';
  });
  html += '</div>';
  return html;
}

function renderAnalise(dados, mes) {
  var mesAnt    = getMesAnterior(mes);
  var dadosAnt  = mesAnt && DADOS_CACHE[mesAnt] ? DADOS_CACHE[mesAnt] : null;
  var distritos = dados.distritos || [];
  var reps      = dados.reps      || [];
  var ativos    = reps.filter(function(r){
    return r.vago !== 'True' && r.vago !== true && r.vago !== '1';
  });

  var html = '<div class="analise-wrap">';
  html += '<div class="sec-hdr"><div class="sec-title">Análise &amp; Alertas</div><div class="sec-line"></div></div>';

  if (dadosAnt) {
    html += renderEvolucao(dados, dadosAnt, mes, mesAnt, distritos);
  } else if (mesAnt) {
    html += '<div style="background:#fff;border-radius:10px;padding:14px 18px;margin-bottom:14px;font-size:12px;color:var(--gray);box-shadow:0 1px 6px rgba(0,0,0,.06)">' +
      '📅 Dados de <strong>' + mesAnt + '</strong> ainda não carregados — clique no mês anterior e volte para ver a comparação.' +
    '</div>';
  }

  html += renderAlertas(dados, dadosAnt, ativos, mes, mesAnt, distritos);
  html += '</div>';
  return html;
}

function renderEvolucao(dados, dadosAnt, mes, mesAnt, distritos) {
  var dists    = distritos;
  var distsAnt = dadosAnt.distritos || [];

  // ── MDV ──────────────────────────────────────────────────────────
  var mdvAt  = mediaProdDistritos(dists);
  var mdvAn  = mediaProdDistritos(distsAnt);
  var mdvDel = (mdvAt !== null && mdvAn !== null) ? mdvAt - mdvAn : null;
  var mdvB   = evoBadge(mdvDel);

  // ── Produto ───────────────────────────────────────────────────────
  var allProdAtu = (dados.prodDistNex    || []).concat(dados.prodDistVit    || []);
  var allProdAnt = (dadosAnt.prodDistNex || []).concat(dadosAnt.prodDistVit || []);
  var temProd    = allProdAtu.length > 0;

  var atProdAtu  = mediaAtProdArr(allProdAtu);
  var atProdAnt  = mediaAtProdArr(allProdAnt);
  var atProdDel  = (atProdAtu !== null && atProdAnt !== null) ? atProdAtu - atProdAnt : null;
  var atProdB    = evoBadge(atProdDel);

  var html = '<div class="evo-card">';

  // — MDV section —
  html += '<div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">' +
    '<div>' +
      '<div class="evo-card-title"><div class="cc-bar"></div>Evolução ' + mesAnt + ' → ' + mes + '</div>' +
    '</div>' +
  '</div>';

  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
    '<span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gray)">📊 Produtividade (MDV)</span>' +
    '<span class="evo-regional-delta" style="' + mdvB.cls + ';background:' + mdvB.bg + '">' + mdvB.icon + mdvB.str + ' &nbsp;Regional MDV</span>' +
  '</div>';
  html += buildEvoGrid(dists,
    function(d){ var v = safeFloat(d.prod); return v !== null ? v*100 : null; },
    function(d){ var dAn = distsAnt.find(function(x){ return x.distrito_id === d.distrito_id; }); var v = dAn ? safeFloat(dAn.prod) : null; return v !== null ? v*100 : null; }
  );

  // — Q1-Q4 section —
  var repsAtu = (dados.reps||[]).filter(function(r){ return r.vago !== 'True' && r.vago !== true && r.vago !== '1'; });
  var repsAntQ = (dadosAnt.reps||[]).filter(function(r){ return r.vago !== 'True' && r.vago !== true; });
  var temQ = repsAtu.some(function(r){ return safeFloat(r.q1) !== null || safeFloat(r.q2) !== null; });
  if (temQ) {
    // Média geral de todos os Qs disponíveis na regional (para badge)
    function avgQRegional(repsArr) {
      var vals = [];
      ['q1','q2','q3','q4'].forEach(function(q){
        repsArr.forEach(function(r){ var v = safeFloat(r[q]); if (v !== null) vals.push(v); });
      });
      return vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null;
    }
    var qRegAt = avgQRegional(repsAtu);
    var qRegAn = avgQRegional(repsAntQ);
    var qRegDel = (qRegAt !== null && qRegAn !== null) ? qRegAt - qRegAn : null;
    var qRegB = evoBadge(qRegDel);

    html += '<div style="border-top:1px solid var(--border);margin:14px 0 10px"></div>';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
      '<span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gray)">📋 Bimestres (Q1 · Q2 · Q3 · Q4)</span>' +
      '<span class="evo-regional-delta" style="' + qRegB.cls + ';background:' + qRegB.bg + '">' + qRegB.icon + qRegB.str + ' &nbsp;Média Qs Regional</span>' +
    '</div>';
    html += buildEvoGridQ(dists, repsAtu, repsAntQ);
  }

  // — Produto section —
  if (temProd) {
    html += '<div style="border-top:1px solid var(--border);margin:14px 0 10px"></div>';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
      '<span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gray)">📦 Atingimento de Produto</span>' +
      '<span class="evo-regional-delta" style="' + atProdB.cls + ';background:' + atProdB.bg + '">' + atProdB.icon + atProdB.str + ' &nbsp;Regional Produto</span>' +
    '</div>';
    html += buildEvoGrid(dists,
      function(d){ return mediaAtProdDist(allProdAtu, d.distrito_id); },
      function(d){ return mediaAtProdDist(allProdAnt, d.distrito_id); }
    );
  }

  html += '</div>'; // evo-card
  return html;
}

function renderAlertas(dados, dadosAnt, ativos, mes, mesAnt, distritos) {
  var repsAnt    = dadosAnt ? (dadosAnt.reps||[]).filter(function(r){ return r.vago !== 'True' && r.vago !== true; }) : [];
  var allProdDist = (dados.prodDistNex||[]).concat(dados.prodDistVit||[]);
  var allProdRep  = (dados.prodRepNex ||[]).concat(dados.prodRepVit ||[]);
  var allProdDistAnt = dadosAnt ? (dadosAnt.prodDistNex||[]).concat(dadosAnt.prodDistVit||[]) : [];
  var temProdDist = allProdDist.length > 0;
  var temProdRep  = allProdRep.length  > 0;

  var html = '<div class="alertas-card">';
  html += '<div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px">' +
    '<div class="card-title" style="margin-bottom:0"><div class="cc-bar"></div>Alertas da Regional</div>' +
    '<span style="font-size:10px;color:var(--gray)">MDV = Produtividade &nbsp;|&nbsp; Produto = Atingimento médio dos produtos</span>' +
  '</div>';

  var temAlerta = false;

  distritos.forEach(function(d) {
    var prodD  = safeFloat(d.prod); if (prodD !== null) prodD *= 100;
    var repsD  = ativos.filter(function(r){ return r.distrito_id === d.distrito_id; });
    var prodsD = repsD.map(function(r){ return safeFloat(r.prod); }).filter(function(v){ return v !== null; });
    var mediaD = prodsD.length ? prodsD.reduce(function(a,b){return a+b;},0)/prodsD.length : null;

    // ── MDV: reps críticos ──
    var criticosMDV = repsD.filter(function(r){
      var p = safeFloat(r.prod);
      if (p === null) return false;
      return p < 80 || (mediaD !== null && p < mediaD - 15);
    }).sort(function(a,b){ return (safeFloat(a.prod)||999)-(safeFloat(b.prod)||999); });

    // ── MDV: regressão vs mês anterior ──
    var regressoesMDV = [];
    if (repsAnt.length) {
      repsD.forEach(function(r){
        var pAt = safeFloat(r.prod);
        var rAn = repsAnt.find(function(x){ return x.setor_id === r.setor_id; });
        var pAn = rAn ? safeFloat(rAn.prod) : null;
        if (pAt !== null && pAn !== null && (pAt-pAn) <= -10)
          regressoesMDV.push({ rep:r, pAt:pAt, pAn:pAn, delta:pAt-pAn });
      });
      regressoesMDV.sort(function(a,b){ return a.delta-b.delta; });
    }

    // ── Produto: produtos do distrito abaixo de 80% ──
    var prodDistD     = allProdDist.filter(function(r){ return r.distrito_id === d.distrito_id; });
    var prodAbaixo80  = prodDistD.filter(function(r){
      var at = safeFloat(r.ating_pct);
      return at !== null && at < 80;
    }).sort(function(a,b){ return (safeFloat(a.ating_pct)||0)-(safeFloat(b.ating_pct)||0); });

    // Média produto do distrito (para referência)
    var mediaAtDistProd = mediaAtProdArr(prodDistD);

    // ── Produto: regressão de produto por distrito ──
    var regressoesProd = [];
    if (allProdDistAnt.length && prodDistD.length) {
      var atProdAtu = mediaAtProdArr(prodDistD);
      var atProdAnt = mediaAtProdArr(allProdDistAnt.filter(function(r){ return r.distrito_id === d.distrito_id; }));
      if (atProdAtu !== null && atProdAnt !== null && (atProdAtu - atProdAnt) <= -5) {
        regressoesProd.push({ pAt: atProdAtu, pAn: atProdAnt, delta: atProdAtu - atProdAnt });
      }
    }

    // ── Produto: reps puxando produto para baixo ──
    var repsProdCrit = [];
    if (temProdRep) {
      var prodRepD = allProdRep.filter(function(r){ return r.distrito_id === d.distrito_id; });
      // Agrupa por setor_id → média de ating_pct
      var repGrp = {};
      prodRepD.forEach(function(r){
        if (!repGrp[r.setor_id]) repGrp[r.setor_id] = { nome: r.nome, vals: [] };
        var at = safeFloat(r.ating_pct);
        if (at !== null) repGrp[r.setor_id].vals.push(at);
      });
      var repAvgs = Object.keys(repGrp).map(function(sid){
        var g = repGrp[sid];
        var avg = g.vals.length ? g.vals.reduce(function(a,b){return a+b;},0)/g.vals.length : null;
        return { setor_id: sid, nome: g.nome, avg: avg };
      });
      var mediaDistProdRep = (function(){
        var v = repAvgs.map(function(r){return r.avg;}).filter(function(v){return v!==null;});
        return v.length ? v.reduce(function(a,b){return a+b;},0)/v.length : null;
      })();
      repsProdCrit = repAvgs.filter(function(r){
        return r.avg !== null && (r.avg < 80 || (mediaDistProdRep !== null && r.avg < mediaDistProdRep - 15));
      }).sort(function(a,b){ return (a.avg||0)-(b.avg||0); });
    }

    // ── Q1-Q4: calcula antes do guard ────────────────────────────
    var QS_ALERT = ['q1','q2','q3','q4'];
    var repsQCrit = repsD.filter(function(r){
      return QS_ALERT.some(function(q){ var v = safeFloat(r[q]); return v !== null && v < 80; });
    }).sort(function(a,b){
      var wA = Math.min.apply(null, QS_ALERT.map(function(q){ var v = safeFloat(a[q]); return v !== null ? v : 999; }));
      var wB = Math.min.apply(null, QS_ALERT.map(function(q){ var v = safeFloat(b[q]); return v !== null ? v : 999; }));
      return wA - wB;
    });
    var repsQReg = [];
    if (repsAnt.length) {
      repsD.forEach(function(r){
        var rAn = repsAnt.find(function(x){ return x.setor_id === r.setor_id; });
        if (!rAn) return;
        QS_ALERT.forEach(function(q){
          var pAt = safeFloat(r[q]); var pAn = safeFloat(rAn[q]);
          if (pAt !== null && pAn !== null && (pAt - pAn) <= -10)
            repsQReg.push({ nome: r.nome||r.setor_id, q: q.toUpperCase(), pAt:pAt, pAn:pAn, delta:pAt-pAn });
        });
      });
      repsQReg.sort(function(a,b){ return a.delta-b.delta; });
    }

    // ── Guard: só exibe bloco se houver algo a mostrar ────────────
    var temBlocoMDV  = criticosMDV.length || regressoesMDV.length;
    var temBlocoQ    = repsQCrit.length   || repsQReg.length;
    var temBlocoProd = prodAbaixo80.length || regressoesProd.length || repsProdCrit.length;
    if (!temBlocoMDV && !temBlocoQ && !temBlocoProd) return;
    temAlerta = true;

    var linhaClr     = d.linha === 'NEXUS' ? 'var(--nexus)' : 'var(--red)';
    var atProdDistStr = mediaAtDistProd !== null ? ' &nbsp;|&nbsp; Produto: ' + mediaAtDistProd.toFixed(1) + '%' : '';

    html += '<div class="alerta-dist-bloco">';
    html += '<div class="alerta-dist-titulo">' +
      '<span class="alerta-dist-linha" style="color:' + linhaClr + '">' + d.linha + '</span>' +
      '<span class="alerta-dist-nome">' + (d.ab||d.distrito_id) + '</span>' +
      (prodD !== null ? '<span class="alerta-dist-prod" style="' + prodColor(prodD) + '">MDV: ' + prodD.toFixed(1) + '%</span>' : '') +
      '<span style="font-size:10px;color:var(--gray);margin-left:2px">' + atProdDistStr + '</span>' +
    '</div>';

    // ─── MDV alerts ───────────────────────────────────────────────
    if (criticosMDV.length) {
      html += '<div class="alerta-subsec">🔴 MDV — Abaixo da meta ou puxando o distrito para baixo</div>';
      criticosMDV.forEach(function(r){
        var p = safeFloat(r.prod);
        var dm = (mediaD !== null && p !== null) ? (p-mediaD) : null;
        var motivo = p < 80 ? 'abaixo de 80%' : 'distante da média';
        html += '<div class="alerta-rep r">' +
          '<span class="alerta-rep-nome" title="Setor ' + (r.setor_id||'') + '">' + (r.nome||r.setor_id) + '</span>' +
          '<span class="alerta-rep-info">' +
            '<span style="color:#ef4444;font-weight:700">' + (p!==null?p.toFixed(1)+'%':'—') + '</span>' +
            (dm!==null ? '<span style="color:#aaa;font-size:10px">' + dm.toFixed(1) + 'pp vs média</span>' : '') +
            '<span style="font-size:10px;color:#aaa;padding:2px 6px;border-radius:8px;background:#fee2e2">' + motivo + '</span>' +
          '</span>' +
        '</div>';
      });
    }
    if (regressoesMDV.length) {
      html += '<div class="alerta-subsec">📉 MDV — Regressão vs ' + (mesAnt||'mês anterior') + '</div>';
      regressoesMDV.forEach(function(item){
        var sev = item.delta <= -20 ? 'color:#ef4444' : 'color:#f59e0b';
        html += '<div class="alerta-rep y">' +
          '<span class="alerta-rep-nome">' + (item.rep.nome||item.rep.setor_id) + '</span>' +
          '<span class="alerta-rep-info">' +
            '<span style="color:#aaa">' + item.pAn.toFixed(1) + '%</span>' +
            '<span style="color:#ccc;font-size:10px">→</span>' +
            '<span style="font-weight:700">' + item.pAt.toFixed(1) + '%</span>' +
            '<span style="' + sev + ';font-weight:800">' + item.delta.toFixed(1) + 'pp</span>' +
          '</span>' +
        '</div>';
      });
    }

    // ─── Q1-Q4 alerts ────────────────────────────────────────────
    if (repsQCrit.length) {
      html += '<div class="alerta-subsec">📋 Bimestre — Rep com Q abaixo de 80%</div>';
      repsQCrit.forEach(function(r){
        var qDetails = QS_ALERT.map(function(q){
          var v = safeFloat(r[q]);
          if (v === null) return null;
          var cls = v < 80 ? 'color:#ef4444;font-weight:800' : 'color:#059669';
          return '<span style="font-size:10px;' + cls + '">' + q.toUpperCase() + ':' + v.toFixed(0) + '%</span>';
        }).filter(Boolean).join('<span style="color:#e5e7eb;margin:0 2px">|</span>');
        html += '<div class="alerta-rep r">' +
          '<span class="alerta-rep-nome">' + (r.nome||r.setor_id) + '</span>' +
          '<span class="alerta-rep-info" style="gap:3px">' + qDetails + '</span>' +
        '</div>';
      });
    }
    if (repsQReg.length) {
      html += '<div class="alerta-subsec">📉 Bimestre — Regressão de Q vs ' + (mesAnt||'mês anterior') + '</div>';
      repsQReg.forEach(function(item){
        var sev = item.delta <= -15 ? 'color:#ef4444' : 'color:#f59e0b';
        html += '<div class="alerta-rep y">' +
          '<span class="alerta-rep-nome">' + item.nome + '</span>' +
          '<span class="alerta-rep-info">' +
            '<span style="font-size:10px;color:var(--gray);font-weight:700">' + item.q + '</span>' +
            '<span style="color:#aaa">' + item.pAn.toFixed(1) + '%</span>' +
            '<span style="color:#ccc;font-size:10px">→</span>' +
            '<span style="font-weight:700">' + item.pAt.toFixed(1) + '%</span>' +
            '<span style="' + sev + ';font-weight:800">' + item.delta.toFixed(1) + 'pp</span>' +
          '</span>' +
        '</div>';
      });
    }

    // ─── Produto alerts ───────────────────────────────────────────
    if (regressoesProd.length) {
      regressoesProd.forEach(function(item){
        html += '<div class="alerta-subsec">📉 Produto — Regressão vs ' + (mesAnt||'mês anterior') + '</div>';
        html += '<div class="alerta-rep y">' +
          '<span class="alerta-rep-nome">Média geral dos produtos do distrito</span>' +
          '<span class="alerta-rep-info">' +
            '<span style="color:#aaa">' + item.pAn.toFixed(1) + '%</span>' +
            '<span style="color:#ccc;font-size:10px">→</span>' +
            '<span style="font-weight:700">' + item.pAt.toFixed(1) + '%</span>' +
            '<span style="color:#f59e0b;font-weight:800">' + item.delta.toFixed(1) + 'pp</span>' +
          '</span>' +
        '</div>';
      });
    }
    if (prodAbaixo80.length) {
      html += '<div class="alerta-subsec">📦 Produto — Abaixo de 80% no distrito</div>';
      prodAbaixo80.forEach(function(r){
        var at = safeFloat(r.ating_pct);
        html += '<div class="alerta-rep r">' +
          '<span class="alerta-rep-nome">' + (r.produto||'—') + '</span>' +
          '<span class="alerta-rep-info">' +
            '<span style="color:#ef4444;font-weight:700">' + (at!==null?at.toFixed(1)+'%':'—') + '</span>' +
          '</span>' +
        '</div>';
      });
    }
    if (repsProdCrit.length) {
      html += '<div class="alerta-subsec">👤 Produto — Reps com atingimento baixo nos produtos</div>';
      repsProdCrit.forEach(function(r){
        var motivo = r.avg < 80 ? 'abaixo de 80%' : 'distante da média';
        html += '<div class="alerta-rep r">' +
          '<span class="alerta-rep-nome">' + (r.nome||r.setor_id) + '</span>' +
          '<span class="alerta-rep-info">' +
            '<span style="color:#ef4444;font-weight:700">' + (r.avg!==null?r.avg.toFixed(1)+'%':'—') + '</span>' +
            '<span style="font-size:10px;color:#aaa;padding:2px 6px;border-radius:8px;background:#fee2e2">' + motivo + '</span>' +
          '</span>' +
        '</div>';
      });
    }

    html += '</div>'; // alerta-dist-bloco
  });

  if (!temAlerta) {
    html += '<div class="alerta-ok">✅ Nenhum alerta identificado para este período. Regional dentro dos parâmetros.</div>';
  }
  html += '</div>';
  return html;
}

function buildAnualChart(canvasId, datasets, meses, isPts, refLines) {
  var el = document.getElementById(canvasId);
  if (!el) return null;
  if (ANUAL_CHARTS[canvasId]) { ANUAL_CHARTS[canvasId].destroy(); }

  var chart = new Chart(el.getContext('2d'), {
    type: 'line',
    data: { labels: meses, datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(17,24,39,.93)',
          titleFont: { size: 12, weight: '700' }, bodyFont: { size: 11 },
          padding: 12, cornerRadius: 10,
          itemSort: function(a, b) { return (b.parsed.y || 0) - (a.parsed.y || 0); },
          callbacks: {
            label: function(ctx) {
              var v = ctx.parsed.y;
              if (v === null || v === undefined) return null;
              return '  ' + ctx.dataset.label + ':  ' + (isPts ? v.toFixed(1) + ' pts' : v.toFixed(1) + '%');
            }
          },
          filter: function(item) { return item.parsed.y !== null && item.parsed.y !== undefined; }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 11, weight: '700' } }
        },
        y: {
          grid: {
            color: function(ctx) {
              if (!refLines) return '#f0f0f0';
              for (var i = 0; i < refLines.length; i++) {
                if (Math.abs(ctx.tick.value - refLines[i].v) < 0.1) return refLines[i].color;
              }
              return '#f0f0f0';
            },
            lineWidth: function(ctx) {
              if (!refLines) return 1;
              for (var i = 0; i < refLines.length; i++) {
                if (Math.abs(ctx.tick.value - refLines[i].v) < 0.1) return 1.8;
              }
              return 1;
            }
          },
          ticks: {
            callback: function(v) { return isPts ? v + ' pts' : v + '%'; },
            font: { size: 11 }
          }
        }
      },
      spanGaps: true
    }
  });

  ANUAL_CHARTS[canvasId] = chart;
  return chart;
}

function anualSyncToggleBtns(filterBar, chart) {
  filterBar.querySelectorAll('.adtbtn').forEach(function(b) {
    var distId = b.getAttribute('data-dist');
    var marca  = b.getAttribute('data-marca');
    var datasets = chart.data.datasets;
    for (var j = 0; j < datasets.length; j++) {
      var ds = datasets[j];
      if ((distId && ds._distId === distId) || (marca && ds._marca === marca)) {
        b.classList.toggle('active', chart.isDatasetVisible(j));
        break;
      }
    }
  });
}

function anualFilter(chartId, mode, btn) {
  var chart = ANUAL_CHARTS[chartId];
  if (!chart) return;

  if (btn) {
    var grpBar = btn.closest('.anual-filter-groups');
    if (grpBar) grpBar.querySelectorAll('.afbtn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
  }

  var datasets = chart.data.datasets;
  datasets.forEach(function(ds, i) {
    var g = ds._group;
    var show = true;
    if      (mode === 'medias') show = (g === 'regional' || g === 'nexus-avg' || g === 'vital-avg');
    else if (mode === 'nexus')  show = (g === 'regional' || g === 'nexus-avg' || g === 'nexus');
    else if (mode === 'vital')  show = (g === 'regional' || g === 'vital-avg' || g === 'vital');
    chart.setDatasetVisibility(i, show);
  });

  if (btn) {
    var fb = btn.closest('.anual-filter-bar');
    if (fb) anualSyncToggleBtns(fb, chart);
  }
  chart.update();
}

function anualToggleDist(chartId, distId, btn) {
  var chart = ANUAL_CHARTS[chartId];
  if (!chart) return;
  var datasets = chart.data.datasets;
  for (var j = 0; j < datasets.length; j++) {
    var ds = datasets[j];
    var match = (distId === '__regional__')
      ? (ds._group === 'regional')
      : (ds._distId === distId);
    if (match) {
      var vis = chart.isDatasetVisible(j);
      chart.setDatasetVisibility(j, !vis);
      btn.classList.toggle('active', !vis);
      break;
    }
  }
  chart.update();
}

async function abrirVisaoAnual() {
  VIEW_ATUAL = 'anual';
  DISTRITO_ATIVO = null;

  var meses = CONFIG._meses || [];
  window._mesesDisponiveis = meses;
  renderCycleBar(meses, null);

  mostrarLoading(true);
  try {
    // Carrega todos os meses disponíveis em paralelo
    setLoadingTxt('Carregando visão anual…');
    var promises = meses.map(function(m){ return carregarMes(m).catch(function(){}); });
    await Promise.all(promises);

    // Usa o mês mais recente como pivot para estrutura de distritos
    var mesPivot = meses[meses.length - 1];
    var dadosPivot = DADOS_CACHE[mesPivot];
    if (!dadosPivot) throw new Error('Sem dados para montar a visão anual.');

    renderVisaoAnual(meses, dadosPivot.distritos || []);
  } catch(e) {
    renderErro(e.message);
  }
  mostrarLoading(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function irParaMes(mes) {
  VIEW_ATUAL = 'principal';
  DISTRITO_ATIVO = null;
  MES_ATUAL = mes;
  document.getElementById('pill-mes').textContent = mes + '/2026';
  var meses = CONFIG._meses || [];
  renderCycleBar(meses, mes);
  mostrarLoading(true);
  try {
    var mesAnt = getMesAnterior(mes);
    var promises = [carregarMes(mes)];
    if (mesAnt) promises.push(carregarMes(mesAnt).catch(function(){}));
    var resultados = await Promise.all(promises);
    renderTudo(resultados[0], mes);
  } catch(e) {
    renderErro(e.message);
  }
  mostrarLoading(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Evolução de Cota ─────────────────────────────────────────────

var COTA_CHARTS  = {};
var COTA_LINHA_BAR = 'TOTAL'; // estado do toggle do gráfico de barras

function fmtBRL(v) {
  if (v === null || v === undefined || isNaN(v) || v === 0) return '—';
  return 'R$ ' + Math.round(v).toLocaleString('pt-BR');
}

function cotaPctClass(v) {
  if (v === null || isNaN(v)) return '';
  return v >= 100 ? 'cota-pct-ok' : v >= 80 ? 'cota-pct-warn' : 'cota-pct-crit';
}

function sumField(arr, field) {
  return arr.reduce(function(s, r) {
    var v = safeFloat(r[field]);
    return s + (v !== null && v > 0 ? v : 0);
  }, 0);
}

// Cota/Realizado regional por linha ('NEXUS','VITAL',null=total)
function isMesParcial(mes) {
  return CONFIG && CONFIG.mes_parcial && mes === CONFIG.mes_parcial;
}

function getCotaReg(mes, linha) {
  var d = DADOS_CACHE[mes]; if (!d) return 0;
  if (linha === 'NEXUS') return sumField(d.prodNex || [], 'cota');
  if (linha === 'VITAL') return sumField(d.prodVit || [], 'cota');
  return sumField((d.prodNex||[]).concat(d.prodVit||[]), 'cota');
}
function getRealReg(mes, linha) {
  if (isMesParcial(mes)) return null;
  var d = DADOS_CACHE[mes]; if (!d) return 0;
  if (linha === 'NEXUS') return sumField(d.prodNex || [], 'realizado');
  if (linha === 'VITAL') return sumField(d.prodVit || [], 'realizado');
  return sumField((d.prodNex||[]).concat(d.prodVit||[]), 'realizado');
}

// Cota/Realizado por distrito
function getCotaDist(mes, distId, linhaD) {
  var d = DADOS_CACHE[mes]; if (!d) return 0;
  var arr = (linhaD === 'NEXUS' ? (d.prodDistNex||[]) : (d.prodDistVit||[]))
    .filter(function(r){ return r.distrito_id === distId; });
  return sumField(arr, 'cota');
}
function getRealDist(mes, distId, linhaD) {
  if (isMesParcial(mes)) return null;
  var d = DADOS_CACHE[mes]; if (!d) return 0;
  var arr = (linhaD === 'NEXUS' ? (d.prodDistNex||[]) : (d.prodDistVit||[]))
    .filter(function(r){ return r.distrito_id === distId; });
  return sumField(arr, 'realizado');
}

// Cota/Realizado por produto (regional)
function getCotaProd(mes, produto, linha) {
  var d = DADOS_CACHE[mes]; if (!d) return 0;
  var arr = linha === 'NEXUS' ? (d.prodNex||[]) : (d.prodVit||[]);
  for (var i = 0; i < arr.length; i++) {
    if (normProd(arr[i].produto) === normProd(produto)) return safeFloat(arr[i].cota) || 0;
  }
  return 0;
}
function getRealProd(mes, produto, linha) {
  if (isMesParcial(mes)) return null;
  var d = DADOS_CACHE[mes]; if (!d) return 0;
  var arr = linha === 'NEXUS' ? (d.prodNex||[]) : (d.prodVit||[]);
  for (var i = 0; i < arr.length; i++) {
    if (normProd(arr[i].produto) === normProd(produto)) return safeFloat(arr[i].realizado) || 0;
  }
  return 0;
}

// YTD: soma de todos os meses — meses parciais excluídos do realizado (null)
function calcYTD(meses, getFn) {
  return meses.reduce(function(s, m) {
    var v = getFn(m);
    return s + (v !== null ? (v || 0) : 0);
  }, 0);
}

// ── Chart: barras cota vs realizado ──────────────────────────────
function buildCotaBarChart(canvasId, meses, cotaArr, realArr) {
  var el = document.getElementById(canvasId); if (!el) return;
  if (COTA_CHARTS[canvasId]) COTA_CHARTS[canvasId].destroy();
  COTA_CHARTS[canvasId] = new Chart(el.getContext('2d'), {
    type: 'bar',
    data: {
      labels: meses,
      datasets: [
        { label: 'Cota',
          data: cotaArr,
          backgroundColor: 'rgba(107,114,128,.22)',
          borderColor: 'rgba(107,114,128,.55)',
          borderWidth: 1.5, borderRadius: 5, order: 2 },
        { label: 'Realizado',
          data: realArr,
          backgroundColor: 'rgba(21,105,58,.65)',
          borderColor: 'rgba(21,105,58,.9)',
          borderWidth: 1.5, borderRadius: 5, order: 1 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, position: 'top', labels: { boxWidth: 12, font: { size: 11 }, padding: 16 } },
        tooltip: {
          backgroundColor: 'rgba(17,24,39,.93)',
          titleFont: { size: 12, weight: '700' }, bodyFont: { size: 11 },
          padding: 12, cornerRadius: 10,
          callbacks: {
            label: function(ctx) {
              var v = ctx.parsed.y;
              if (!v) return null;
              return '  ' + ctx.dataset.label + ':  ' + fmtBRL(v);
            },
            afterBody: function(items) {
              var c = items[0] ? items[0].parsed.y : 0;
              var r = items[1] ? items[1].parsed.y : 0;
              if (!c || !r) return [];
              return ['  Atingimento:  ' + (r / c * 100).toFixed(1) + '%'];
            }
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11, weight: '700' } } },
        y: {
          ticks: { callback: function(v) {
            if (v >= 1e6) return 'R$ ' + (v/1e6).toFixed(1) + 'M';
            return 'R$ ' + (v/1e3).toFixed(0) + 'k';
          }, font: { size: 10 } },
          grid: { color: '#f0f0f0' }
        }
      }
    }
  });
}

      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, position: 'top', labels: { boxWidth: 14, font: { size: 11 }, padding: 16 } },
        tooltip: {
          backgroundColor: 'rgba(17,24,39,.93)',
          titleFont: { size: 12, weight: '700' }, bodyFont: { size: 11 },
          padding: 12, cornerRadius: 10,
          filter: function(item) { return item.parsed.y !== null; },
          callbacks: { label: function(ctx) {
            var v = ctx.parsed.y;
            return v !== null ? '  ' + ctx.dataset.label + ':  ' + v.toFixed(1) + '%' : null;
          }}
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11, weight: '700' } } },

            }
          }
        }
      },
      spanGaps: true
    }

// ── Incremento de Cota ───────────────────────────────────────────

// Calcula array de deltas mês a mês: [{abs, pct}] — índice 0 = null (sem mês anterior)
function calcIncrementos(meses, getCotaFn) {
  return meses.map(function(m, i) {
    if (i === 0) return null;
    var prev = getCotaFn(meses[i - 1]);
    var curr = getCotaFn(m);
    if (!prev || !curr) return null;
    return { abs: curr - prev, pct: (curr - prev) / prev * 100 };
  });
}

// Gráfico de barras — Δ R$ por mês (verde positivo, vermelho negativo)
var COTA_INCR_LINHA = 'TOTAL'; // estado do toggle

function buildCotaIncrementoChart(canvasId, meses, linhaKey) {
  var getLinha = linhaKey === 'TOTAL' ? null : linhaKey;
  var incrs = calcIncrementos(meses, function(m){ return getCotaReg(m, getLinha); });
  var absArr = incrs.map(function(d){ return d ? d.abs : null; });

  var bgColors = absArr.map(function(v) {
    if (v === null) return 'rgba(156,163,175,.25)';
    return v >= 0 ? 'rgba(21,105,58,.6)' : 'rgba(185,28,28,.6)';
  });
  var bdColors = absArr.map(function(v) {
    if (v === null) return 'rgba(156,163,175,.4)';
    return v >= 0 ? 'rgba(21,105,58,.9)' : 'rgba(185,28,28,.9)';
  });

  var el = document.getElementById(canvasId); if (!el) return;
  if (COTA_CHARTS[canvasId]) COTA_CHARTS[canvasId].destroy();
  COTA_CHARTS[canvasId] = new Chart(el.getContext('2d'), {
    type: 'bar',
    data: {
      labels: meses,
      datasets: [{
        label: 'Δ Cota (R$)',
        data: absArr,
        backgroundColor: bgColors,
        borderColor: bdColors,
        borderWidth: 1.5, borderRadius: 5
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(17,24,39,.93)',
          titleFont: { size: 12, weight: '700' }, bodyFont: { size: 11 },
          padding: 12, cornerRadius: 10,
          callbacks: { label: function(ctx) {
            var v = ctx.parsed.y;
            if (v === null) return '  Mês base (sem incremento)';
            return '  Δ Cota:  ' + (v >= 0 ? '+' : '') + fmtBRL(Math.abs(v)).replace('R$ ', (v >= 0 ? '+R$ ' : '-R$ '));
          }}
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11, weight: '700' } } },
        y: {
          ticks: { callback: function(v) {
            if (Math.abs(v) >= 1e6) return (v >= 0 ? '+' : '') + 'R$ ' + (v/1e6).toFixed(1) + 'M';
            return (v >= 0 ? '+' : '') + 'R$ ' + (v/1e3).toFixed(0) + 'k';
          }, font: { size: 10 } },
          grid: {
            color: function(ctx) { return Math.abs(ctx.tick.value) < 0.01 ? 'rgba(0,0,0,.25)' : '#f0f0f0'; },
            lineWidth: function(ctx) { return Math.abs(ctx.tick.value) < 0.01 ? 2.5 : 1; }
          }
        }
      }
    }
  });
}

// Tabela de incremento: Regional + NEXUS + VITAL + distritos
// Helper compartilhado para cabeçalhos e células dos incrementos
// Cada mês mostra: Cota | ΔR$ | Δ% (exceto o primeiro que só tem Cota)
function _incrMakeHeaderCols(meses) {
  return meses.map(function(m, i) {
    return i === 0
      ? '<th class="th-mes-hdr" colspan="1">' + m + '</th>'
      : '<th class="th-mes-hdr" colspan="3">' + m + '</th>';
  }).join('');
}
function _incrMakeSubCols(meses) {
  return meses.map(function(m, i) {
    return i === 0
      ? '<th class="th-sub" style="border-left:1px solid #f5f5f5">Cota</th>'
      : '<th class="th-sub">Cota</th><th class="th-sub">Δ R$</th><th class="th-sub">Δ%</th>';
  }).join('');
}
function _incrRowCells(meses, getCotaFn) {
  var cells = '', prev = null;
  meses.forEach(function(m, i) {
    var curr = getCotaFn(m);
    if (i === 0) {
      cells += '<td style="border-left:1px solid #f0f0f0;text-align:right">' + fmtBRL(curr) + '</td>';
    } else {
      var dAbs = (prev !== null && prev > 0) ? curr - prev : null;
      var dPct = (prev !== null && prev > 0) ? (curr - prev) / prev * 100 : null;
      var cls  = dAbs !== null ? (dAbs >= 0 ? 'cota-pct-ok' : 'cota-pct-crit') : '';
      var absStr = dAbs !== null
        ? (dAbs >= 0 ? '+R$ ' : '-R$ ') + Math.abs(Math.round(dAbs)).toLocaleString('pt-BR')
        : '—';
      var pctStr = dPct !== null ? (dPct >= 0 ? '+' : '') + dPct.toFixed(1) + '%' : '—';
      cells += '<td class="td-mes-sep">' + fmtBRL(curr) + '</td>';
      cells += '<td class="' + cls + '">' + absStr + '</td>';
      cells += '<td class="' + cls + '">' + pctStr + '</td>';
    }
    prev = curr;
  });
  return cells;
}

async function abrirEvolucaoCota() {
  VIEW_ATUAL = 'cota';
  DISTRITO_ATIVO = null;
  var meses = CONFIG._meses || [];
  window._mesesDisponiveis = meses;
  renderCycleBar(meses, null);
  mostrarLoading(true);
  try {
    setLoadingTxt('Carregando evolução de cota…');
    var promises = meses.map(function(m){ return carregarMes(m).catch(function(){}); });
    await Promise.all(promises);
    var mesPivot = meses[meses.length - 1];
    var dadosPivot = DADOS_CACHE[mesPivot];
    if (!dadosPivot) throw new Error('Sem dados para montar a evolução de cota.');
    renderEvolucaoCota(meses, dadosPivot.distritos || []);
  } catch(e) {
    renderErro(e.message);
  }
  mostrarLoading(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Renderização: Distrito cards ──────────────────────────────────

function renderDistritoCard(d, reps) {
  var cls     = d.linha === 'NEXUS' ? 'nc' : 'vc';
  var _dprod  = safeFloat(d.prod);
  var prodPct = _dprod !== null ? (_dprod * 100).toFixed(1) : '—';
  var ativo   = DISTRITO_ATIVO === d.distrito_id ? ' ativo' : '';

  // Mini-jornada da equipe do distrito
  var repsD = reps.filter(function(r) {
    return r.distrito_id === d.distrito_id && r.vago !== 'True' && r.vago !== true;
  });
  var miniJ = {};
  repsD.forEach(function(r) {
    var e = getJornadaRep(r.setor_id, r.nome);
    miniJ[e] = (miniJ[e] || 0) + 1;
  });
  var miniJHtml = '';
  if (Object.keys(miniJ).length) {
    miniJHtml = '<div class="jornada-mini">' +
      JORNADA_ORDER.filter(function(s){return miniJ[s];}).map(function(s){
        var c = jornadaCfg(s);
        return '<span style="display:inline-block;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:700;background:' + c.bg + ';color:' + c.color + ';border:1px solid ' + c.border + '">' + s + ' ' + miniJ[s] + '</span>';
      }).join('') +
    '</div>';
  }

  return '<div class="dcard ' + cls + ativo + '" onclick="abrirDistrito(\'' + d.distrito_id + '\')">' +
    '<div class="dcard-hd">' +
      '<div class="dcard-linha">' + d.linha + '</div>' +
      '<div class="dcard-nome">' + (d.ab || d.nm || d.distrito_id) + '</div>' +
      '<div class="dcard-cod">' + d.distrito_id + '</div>' +
      '<div class="prod-badge"><div class="pb-n">' + prodPct + '%</div><div class="pb-l">PROD MDV</div></div>' +
    '</div>' +
    '<div class="dcard-body">' +
      '<div class="diag ' + dgClass(d.diagnostico) + '">' + dgIcon(d.diagnostico) + ' ' +
        (d.diagnostico === 'ok' ? 'Prod. 100%+' : d.diagnostico === 'warn' ? 'Prod. abaixo da meta' : 'Crítico — Plano urgente') +
      '</div>' +
      miniJHtml +
    '</div>' +
    '<div class="dcard-ft">' +
      '<span class="dcard-reps">' + (d.reps_ativos || '—') + ' reps ativos</span>' +
      '<span class="dcard-cta">' + (DISTRITO_ATIVO === d.distrito_id ? 'Fechar ✕' : 'Ver detalhes →') + '</span>' +
    '</div>' +
  '</div>';
}

// ── Distrito detalhe ─────────────────────────────────────────────

function abrirDistrito(distritoId) {
  // Toggle
  if (DISTRITO_ATIVO === distritoId) {
    fecharDistrito();
    return;
  }
  fecharDistrito(true);
  DISTRITO_ATIVO = distritoId;

  var d = window._D;
  if (!d) return;

  var distrito = d.distritos.find(function(x) { return x.distrito_id === distritoId; });
  if (!distrito) return;

  var repsD = d.reps.filter(function(r) {
    return r.distrito_id === distritoId && r.vago !== 'True' && r.vago !== true;
  });

  var isNexus = distrito.linha === 'NEXUS';
  var linhaColor = isNexus ? 'var(--nexus)' : 'var(--red)';
  var prodRepD = (isNexus ? d.prodRepNex : d.prodRepVit)
    .filter(function(p) { return p.distrito_id === distritoId; });

  // Header
  var html = '<div class="dd-hdr">' +
    '<span class="dd-linha-tag" style="background:' + (isNexus ? 'var(--nexus-l)' : 'var(--red-l)') + ';color:' + linhaColor + '">' + distrito.linha + '</span>' +
    '<span class="dd-title">' + (distrito.ab || distrito.nm || distritoId) + '</span>' +
    '<span class="dd-cod">' + distritoId + '</span>' +
    '<button class="dd-close" onclick="fecharDistrito()">✕</button>' +
  '</div>';

  // Tabela de reps com jornada
  html += '<div class="dd-section-lbl">Equipe &amp; Jornada da Evolução</div>';
  html += '<div style="overflow-x:auto"><table class="dd-rep-table"><thead><tr>' +
    '<th>Representante</th><th>Setor</th><th>Jornada</th>' +
    '<th>Prod. %</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Cob. Painel</th>' +
    '</tr></thead><tbody>';

  repsD.forEach(function(r) {
    var etapa   = getJornadaRep(r.setor_id, r.nome);
    var prodPct = safeFloat(r.prod);
    html += '<tr>' +
      '<td style="font-weight:600">' + (r.nome || '—') + '</td>' +
      '<td style="color:var(--gray);font-size:11px">' + (r.setor_id || '—') + '</td>' +
      '<td>' + jornadaBadge(etapa) + '</td>' +
      '<td style="' + prodColor(prodPct) + ';font-weight:700">' + (prodPct !== null ? prodPct.toFixed(1) + '%' : '—') + '</td>' +
      '<td>' + pct(r.q1) + '</td>' +
      '<td>' + pct(r.q2) + '</td>' +
      '<td>' + pct(r.q3) + '</td>' +
      '<td>' + pct(r.q4) + '</td>' +
      '<td>' + pct(r.cob_painel) + '</td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';

  // Tabela de produto por rep (se disponível)
  if (prodRepD.length) {
    var produtos = [];
    prodRepD.forEach(function(p) { if (produtos.indexOf(p.produto) < 0) produtos.push(p.produto); });
    var linhaD = isNexus ? 'NEXUS' : 'VITAL';
    // Marcas chave primeiro, depois restante alfabético
    produtos.sort(function(a, b) {
      var ak = isMarcaChave(a, linhaD) ? 0 : 1;
      var bk = isMarcaChave(b, linhaD) ? 0 : 1;
      if (ak !== bk) return ak - bk;
      return a.localeCompare(b);
    });

    html += '<div class="dd-section-lbl" style="margin-top:18px">Atingimento por Produto — Representante</div>';
    html += '<div style="overflow-x:auto"><table class="prod-table"><thead><tr><th>Produto</th>';
    repsD.forEach(function(r) {
      var primeiro = (r.nome || r.setor_id).split(' ')[0];
      html += '<th class="r" title="' + (r.nome || r.setor_id) + '">' + primeiro + '</th>';
    });
    html += '</tr></thead><tbody>';

    produtos.forEach(function(produto) {
      var isMC = isMarcaChave(produto, linhaD);
      html += '<tr' + (isMC ? ' class="prod-chave"' : '') + '>' +
        '<td class="prod-nome">' + produto + (isMC ? '<span class="mc-badge">★ CHAVE</span>' : '') + '</td>';
      repsD.forEach(function(r) {
        var reg = prodRepD.find(function(p) { return p.produto === produto && p.setor_id === r.setor_id; });
        if (reg && reg.ating_pct !== null && reg.ating_pct !== undefined && reg.ating_pct !== '') {
          var at = parseFloat(reg.ating_pct);
          html += '<td class="r ' + atClass(at) + '">' + at.toFixed(1) + '%</td>';
        } else {
          html += '<td class="r" style="color:#ccc">—</td>';
        }
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  } else {
    html += '<div style="margin-top:12px;font-size:11px;color:var(--gray);padding:10px;background:var(--light);border-radius:6px">💡 Dados de produto por representante disponíveis após executar <code>ingest.py --mes ' + MES_ATUAL + '</code></div>';
  }

  // Exibe no painel correto
  var panelId = isNexus ? 'detalhe-nexus' : 'detalhe-vital';
  var panel   = document.getElementById(panelId);
  if (panel) {
    panel.innerHTML = html;
    panel.classList.add('open');
    // Re-renderiza os cards para marcar o ativo
    reRenderGrids(d.distritos, d.reps);
    setTimeout(function() { panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
  }
}

function fecharDistrito(silencioso) {
  DISTRITO_ATIVO = null;
  document.querySelectorAll('.distrito-detalhe').forEach(function(el) {
    el.classList.remove('open');
    el.innerHTML = '';
  });
  if (!silencioso && window._D) {
    reRenderGrids(window._D.distritos, window._D.reps);
  }
}

function reRenderGrids(distritos, reps) {
  var nexus = distritos.filter(function(d){ return d.linha === 'NEXUS'; });
  var vital = distritos.filter(function(d){ return d.linha === 'VITAL'; });
  var gn = document.getElementById('grid-nexus');
  var gv = document.getElementById('grid-vital');
  if (gn) gn.innerHTML = nexus.map(function(d){ return renderDistritoCard(d, reps); }).join('');
  if (gv) gv.innerHTML = vital.map(function(d){ return renderDistritoCard(d, reps); }).join('');
}

// ── Renderização: Produto Atingimento ────────────────────────────

function renderProdutoAtingimento(dados) {
  var html = '<div class="prod-ating-card" id="prod-ating">';
  html += '<div class="card-title"><div class="cc-bar"></div>Atingimento por Produto</div>';

  // Linha tabs (Nexus | Vital)
  html += '<div class="prod-tabs-row">' +
    '<button class="ptab linha-nexus' + (PROD_LINHA === 'NEXUS' ? ' active' : '') + '" onclick="switchProdLinha(\'NEXUS\')">NEXUS</button>' +
    '<button class="ptab' + (PROD_LINHA === 'VITAL' ? ' active' : '') + '" onclick="switchProdLinha(\'VITAL\')">VITAL</button>' +
    '<div class="ptab-sep"></div>' +
    '<button class="ptab' + (PROD_NIVEL === 'regional' ? ' active' : '') + '" onclick="switchProdNivel(\'regional\')">Regional</button>' +
    '<button class="ptab' + (PROD_NIVEL === 'distrito' ? ' active' : '') + '" onclick="switchProdNivel(\'distrito\')">Por Distrito</button>' +

  '</div>';

  html += '<div id="prod-content"></div>';
  html += '</div>';
  return html;
}

function switchProdLinha(linha) {
  PROD_LINHA = linha;
  PROD_DIST_SEL = null;
  // Atualiza estilo dos botões de linha
  document.querySelectorAll('.prod-ating-card .ptab.linha-nexus').forEach(function(b){
    b.classList.toggle('active', linha === 'NEXUS');
  });
  document.querySelectorAll('.prod-ating-card .ptab:not(.linha-nexus)').forEach(function(b, i){
    if (i === 0) b.classList.toggle('active', linha === 'VITAL');
  });
  atualizarProdContent();
}

function switchProdNivel(nivel) {
  PROD_NIVEL = nivel;
  PROD_DIST_SEL = null;
  // Re-renderiza a seção inteira para atualizar estados dos botões
  var card = document.getElementById('prod-ating');
  if (card && window._D) {
    var novoHtml = renderProdutoAtingimento(window._D);
    card.outerHTML = novoHtml;
    atualizarProdContent();
  }
}

function selectProdDist(did) {
  PROD_DIST_SEL = did;
  atualizarProdContent();
  // Atualiza visual dos botões de distrito
  document.querySelectorAll('.pdist-btn').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-did') === did);
  });
}

function atualizarProdContent() {
  var p = window._D;
  if (!p) return;
  var el = document.getElementById('prod-content');
  if (!el) return;

  var prodReg  = PROD_LINHA === 'NEXUS' ? p.prodNex      : p.prodVit;
  var prodDist = PROD_LINHA === 'NEXUS' ? p.prodDistNex  : p.prodDistVit;
  var prodRep  = PROD_LINHA === 'NEXUS' ? p.prodRepNex   : p.prodRepVit;
  var distrLinha = p.distritos.filter(function(d){ return d.linha === PROD_LINHA; });

  var html = '';

  if (PROD_NIVEL === 'regional') {
    html = renderProdTableSimples(prodReg, PROD_LINHA);

  } else if (PROD_NIVEL === 'distrito') {
    html += renderDistPills(distrLinha);
    if (PROD_DIST_SEL) {
      var filtrado = prodDist.filter(function(p) { return p.distrito_id === PROD_DIST_SEL; });
      html += filtrado.length
        ? renderProdTableSimples(filtrado, PROD_LINHA)
        : '<div class="prod-empty">Sem dados de produto por distrito. Execute <code>ingest.py --mes ' + MES_ATUAL + '</code></div>';
    } else {
      html += '<div class="prod-empty">Selecione um distrito acima.</div>';
    }

  } else if (PROD_NIVEL === 'rep') {
    html += renderDistPills(distrLinha);
    if (PROD_DIST_SEL) {
      var filtradoRep = prodRep.filter(function(p) { return p.distrito_id === PROD_DIST_SEL; });
      html += filtradoRep.length
        ? renderProdTablePorRep(filtradoRep, PROD_LINHA)
        : '<div class="prod-empty">Sem dados de produto por representante. Execute <code>ingest.py --mes ' + MES_ATUAL + '</code></div>';
    } else {
      html += '<div class="prod-empty">Selecione um distrito acima.</div>';
    }
  }

  el.innerHTML = html;
}

function renderDistPills(distritos) {
  return '<div class="prod-dist-pills">' +
    distritos.map(function(d) {
      return '<button class="pdist-btn' + (PROD_DIST_SEL === d.distrito_id ? ' active' : '') +
        '" data-did="' + d.distrito_id + '" onclick="selectProdDist(\'' + d.distrito_id + '\')">' +
        (d.ab || d.distrito_id) + '</button>';
    }).join('') +
  '</div>';
}

function renderProdTableSimples(dados, linha) {
  if (!dados || !dados.length) {
    return '<div class="prod-empty">Sem dados de produto disponíveis para este período.</div>';
  }
  // Marcas chave primeiro, depois restante alfabético
  var sorted = dados.slice().sort(function(a, b) {
    var ak = isMarcaChave(a.produto, linha) ? 0 : 1;
    var bk = isMarcaChave(b.produto, linha) ? 0 : 1;
    if (ak !== bk) return ak - bk;
    return (a.produto || '').localeCompare(b.produto || '');
  });
  var temAting = sorted.some(function(r) { return r.ating_pct !== null && r.ating_pct !== undefined && r.ating_pct !== ''; });
  var temCresc  = sorted.some(function(r) { return r.crescimento !== null && r.crescimento !== undefined && r.crescimento !== ''; });
  var temCob    = sorted.some(function(r) { return r.cobertura   !== null && r.cobertura   !== undefined && r.cobertura   !== ''; });

  var html = '<div style="overflow-x:auto"><table class="prod-table"><thead><tr>' +
    '<th>Produto</th><th class="r">Cota</th><th class="r">Realizado</th>';
  if (temAting) html += '<th class="r">Ating. %</th>';
  if (temCresc) html += '<th class="r">Cresc. %</th>';
  if (temCob)   html += '<th class="r">Cob. %</th>';
  html += '</tr></thead><tbody>';

  sorted.forEach(function(r) {
    var isMC = isMarcaChave(r.produto, linha);
    var at = (r.ating_pct !== null && r.ating_pct !== '' && r.ating_pct !== undefined)
      ? parseFloat(r.ating_pct) : null;
    if (at === null && r.cota && r.realizado && parseFloat(r.cota) > 0) {
      at = parseFloat(r.realizado) / parseFloat(r.cota) * 100;
    }
    html += '<tr' + (isMC ? ' class="prod-chave"' : '') + '>' +
      '<td class="prod-nome">' + (r.produto || '—') +
        (isMC ? '<span class="mc-badge">★ CHAVE</span>' : '') + '</td>' +
      '<td class="r">' + numBR(r.cota) + '</td>' +
      '<td class="r">' + numBR(r.realizado) + '</td>';
    if (temAting) html += '<td class="r ' + atClass(at) + '">' + (at !== null ? at.toFixed(1) + '%' : '—') + '</td>';
    if (temCresc) html += '<td class="r">' + pct(r.crescimento) + '</td>';
    if (temCob)   html += '<td class="r">' + pct(r.cobertura)   + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderProdTablePorRep(dados, linha) {
  if (!dados || !dados.length) {
    return '<div class="prod-empty">Sem dados.</div>';
  }
  var produtos = [];
  dados.forEach(function(p) { if (produtos.indexOf(p.produto) < 0) produtos.push(p.produto); });
  // Marcas chave primeiro, depois restante alfabético
  produtos.sort(function(a, b) {
    var ak = isMarcaChave(a, linha) ? 0 : 1;
    var bk = isMarcaChave(b, linha) ? 0 : 1;
    if (ak !== bk) return ak - bk;
    return a.localeCompare(b);
  });

  var repsIds = [];
  var repNomes = {};
  dados.forEach(function(r) {
    if (repsIds.indexOf(r.setor_id) < 0) repsIds.push(r.setor_id);
    repNomes[r.setor_id] = r.nome || r.setor_id;
  });

  var html = '<div style="overflow-x:auto"><table class="prod-table"><thead><tr><th>Produto</th>';
  repsIds.forEach(function(rid) {
    var primo = (repNomes[rid] || rid).split(' ')[0];
    html += '<th class="r" title="' + (repNomes[rid] || rid) + '">' + primo + '</th>';
  });
  html += '</tr></thead><tbody>';

  produtos.forEach(function(produto) {
    var isMC = isMarcaChave(produto, linha);
    html += '<tr' + (isMC ? ' class="prod-chave"' : '') + '>' +
      '<td class="prod-nome">' + produto + (isMC ? '<span class="mc-badge">★ CHAVE</span>' : '') + '</td>';
    repsIds.forEach(function(rid) {
      var reg = dados.find(function(p) { return p.produto === produto && p.setor_id === rid; });
      var at = null;
      if (reg) {
        if (reg.ating_pct !== null && reg.ating_pct !== undefined && reg.ating_pct !== '') {
          at = parseFloat(reg.ating_pct);
        } else if (reg.cota && reg.realizado && parseFloat(reg.cota) > 0) {
          at = parseFloat(reg.realizado) / parseFloat(reg.cota) * 100;
        }
      }
      if (at !== null) {
        html += '<td class="r ' + atClass(at) + '">' + at.toFixed(1) + '%</td>';
      } else {
        html += '<td class="r" style="color:#ccc">—</td>';
      }
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

// ── Achados e Chart ───────────────────────────────────────────────

function renderAchados(dados, mes) {
  var distritos   = (dados && dados.distritos)    || [];
  var pex         = (dados && dados.pex)          || [];
  var allVisitas  = ((dados && dados.visitasNex)  || []).concat((dados && dados.visitasVit)  || []);
  var allProdDist = ((dados && dados.prodDistNex) || []).concat((dados && dados.prodDistVit) || []);

  var mesAnt   = getMesAnterior(mes);
  var dadosAnt = (mesAnt && DADOS_CACHE[mesAnt]) ? DADOS_CACHE[mesAnt] : null;

  var criticos = distritos.filter(function(d){ return d.diagnostico === 'crit'; });
  var atencao  = distritos.filter(function(d){ return d.diagnostico === 'warn'; });
  var destaque = distritos.filter(function(d){ return d.diagnostico === 'ok';   });

  function pctCol(v, ok, warn) {
    if (v === null || isNaN(v)) return '';
    return v >= ok ? 'color:#059669' : v >= warn ? 'color:#d97706' : 'color:#ef4444';
  }

  function metricas(d) {
    var mdv = (d.prod != null && d.prod !== '') ? parseFloat(d.prod) * 100 : null;

    var dp  = allProdDist.filter(function(p){ return String(p.distrito_id) === String(d.distrito_id); });
    var ats = dp.map(function(p){ return parseFloat(p.ating_pct); }).filter(function(v){ return !isNaN(v) && isFinite(v); });
    var avgAt = ats.length ? ats.reduce(function(a,b){return a+b;},0)/ats.length : null;

    var vis  = allVisitas.find(function(v){ return String(v.distrito_id) === String(d.distrito_id); });
    var cobV = vis ? parseFloat(vis.cob_pct) : null;
    var diasV = vis ? parseInt(vis.dias) : null;

    var dp2  = pex.filter(function(p){ return String(p.distrito_id) === String(d.distrito_id); });
    var ppts = dp2.map(function(p){ return parseFloat(p.pts); }).filter(function(v){ return !isNaN(v) && isFinite(v); });
    var avgPex = ppts.length ? ppts.reduce(function(a,b){return a+b;},0)/ppts.length : null;

    var mdvAnt = null;
    if (dadosAnt && dadosAnt.distritos) {
      var da = dadosAnt.distritos.find(function(x){ return String(x.distrito_id) === String(d.distrito_id); });
      if (da && da.prod != null) mdvAnt = parseFloat(da.prod) * 100;
    }
    return { mdv:mdv, avgAt:avgAt, cobV:cobV, diasV:diasV, avgPex:avgPex, mdvAnt:mdvAnt, reps:parseInt(d.reps_ativos)||0 };
  }

  function distCard(d) {
    var m   = metricas(d);
    var lnc = d.linha === 'NEXUS' ? 'n' : 'v';
    var mdvStr = m.mdv !== null ? m.mdv.toFixed(1) + '%' : '—';
    var mdvCol = pctCol(m.mdv, 100, 80);

    var deltaHtml = '';
    if (m.mdv !== null && m.mdvAnt !== null) {
      var delta = m.mdv - m.mdvAnt;
      var dSign = delta >= 0 ? '▲' : '▼';
      var dCol  = delta >= 0 ? '#059669' : '#ef4444';
      deltaHtml = '<span class="adc-delta" style="color:' + dCol + '">' + dSign + Math.abs(delta).toFixed(1) + 'pp vs ' + mesAnt + '</span>';
    }

    function met(lbl, val, col, extra) {
      return '<div class="adc-metric"><div class="adc-mlbl">' + lbl + '</div>' +
        '<div class="adc-mval" style="' + col + '">' + val + (extra||'') + '</div></div>';
    }

    var mets = met('Prod. MDV', mdvStr, mdvCol, deltaHtml);
    if (m.avgAt  !== null) mets += met('Produto Ating.',   m.avgAt.toFixed(1)+'%',    pctCol(m.avgAt,100,80),  '');
    if (m.cobV   !== null) mets += met('Visitas GD',       m.cobV.toFixed(1)+'%',     pctCol(m.cobV,100,80),
      (m.diasV ? '&nbsp;<span style="font-size:10px;color:#888;font-weight:600">'+m.diasV+'d</span>' : ''));
    if (m.avgPex !== null) mets += met('PEX médio',        m.avgPex.toFixed(1)+' pts', pctCol(m.avgPex,95,80), '');

    return '<div class="achado-dist-card">' +
      '<div class="adc-hdr"><span class="badge ' + lnc + '">' + d.linha + '</span>' +
      '<span class="adc-nome">' + (d.ab||d.nm||d.distrito_id) + '</span>' +
      (m.reps ? '<span class="adc-reps">' + m.reps + ' reps</span>' : '') + '</div>' +
      '<div class="adc-metrics">' + mets + '</div></div>';
  }

  function grupo(list, icone, cls, titulo, msg) {
    if (!list.length) return '';
    return '<div class="achado ' + cls + ' achado-bloco">' +
      '<div class="achado-titulo">' + icone + ' <span>' + titulo + '</span></div>' +
      '<div class="achado-msg">' + msg + '</div>' +
      '<div class="adc-grid">' + list.map(distCard).join('') + '</div></div>';
  }

  var html = '<div class="achados"><div class="sec-hdr"><div class="sec-title">Achados Estratégicos</div><div class="sec-line"></div></div>';
  html += grupo(criticos, '🔴', 'r', 'Crítico',  'Produtividade abaixo de 80% — plano de ação imediato.');
  html += grupo(atencao,  '⚠️', 'y', 'Atenção',  'Entre 80% e 99% — monitorar e intensificar acompanhamento.');
  html += grupo(destaque, '✅', 'g', 'Destaque', 'Atingiram 100%+ em produtividade — identificar e replicar boas práticas.');
  if (!criticos.length && !atencao.length && !destaque.length) {
    html += '<p style="color:var(--gray);font-size:13px;padding:8px 0">Sem dados disponíveis.</p>';
  }
  html += '</div>';
  return html;
}

function renderChartProdutividade(distritos, mes) {
  return '<div class="chart-card">' +
    '<div class="card-title"><div class="cc-bar"></div>Produtividade por Distrito — ' + mes + '/2026</div>' +
    '<canvas id="chart-prod" height="80"></canvas>' +
    '</div>';
}

function buildChartProdutividade(distritos) {
  var el = document.getElementById('chart-prod');
  if (!el) return;
  if (CHART_PROD) { CHART_PROD.destroy(); CHART_PROD = null; }

  var labels = distritos.map(function(d){ return (d.ab||d.distrito_id) + '\n' + d.linha; });
  var valores = distritos.map(function(d){ return d.prod !== null ? parseFloat(d.prod)*100 : 0; });
  var cores = distritos.map(function(d){
    var p = parseFloat(d.prod)||0;
    return p >= 1.0 ? 'rgba(21,105,58,.75)' : p >= 0.8 ? 'rgba(232,119,34,.75)' : 'rgba(200,16,46,.8)';
  });

  CHART_PROD = new Chart(el.getContext('2d'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{ data: valores, backgroundColor: cores, borderRadius: 6, borderSkipped: false }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function(c){ return c.parsed.y.toFixed(1)+'%'; } } }
      },
      scales: {
        y: {
          beginAtZero: true, max: 130,
          ticks: { callback: function(v){ return v+'%'; } },
          grid: { color: '#f0f0f0' }
        },
        x: { grid: { display: false } }
      }
    }
  });
}

// ── Matriz na View Principal ──────────────────────────────────────

function renderMatrizPrincipal(dados, mes) {
  var meses = (CONFIG && CONFIG._meses) ? CONFIG._meses : [mes];

  var tabs = meses.slice().map(function(m) {
    return '<button class="mtz-p-tab' + (m === mes ? ' active' : '') + '" ' +
      'onclick="mtzPrincipalTab(\'' + m + '\')">' + m + '</button>';
  }).join('');

  var grid = _mtzPrincipalGrid(dados);

  return '<div class="mtz-p-wrap">' +
    '<div class="jornada-sec-hdr" style="margin-bottom:12px">' +
      '<div class="sec-title" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px">🎯 Matriz de Performance</div>' +
    '</div>' +
    '<div class="mtz-p-tabs">' + tabs + '</div>' +
    '<div id="mtz-p-grid" class="mtz-p-grid">' + grid + '</div>' +
  '</div>';
}

function _mtzPrincipalGrid(dados) {
  var reps = _mtzBuildReps(null, dados, null);
  if (!reps.length) {
    return '<div class="mtz-p-loading" style="grid-column:1/-1">Sem dados para este mês.</div>';
  }
  var buckets = [[], [], [], []];
  reps.forEach(function(r) { buckets[_mtzQuad(r)].push(r); });
  [0,1].forEach(function(i){ buckets[i].sort(function(a,b){ return (b._at||0)-(a._at||0); }); });
  [2,3].forEach(function(i){ buckets[i].sort(function(a,b){ return (a._at||0)-(b._at||0); }); });

  return _MTZ_QUADS.map(function(q, i) {
    var cards = buckets[i].map(function(r) {
      return '<div class="mtz-rep-card">' +
        '<div class="mtz-rep-name" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
          '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (r.nome || r.setor_id || '—') + '</span>' +
          jornadaBadge(r.etapa || 'Start') +
        '</div>' +
        '<div class="mtz-rep-dist">' + (r._dist||'—') + ' · ' + (r.linha||'') + '</div>' +
        '<div class="mtz-rep-metrics">' +
          _mtzMetric('MDV',  r._mdv!==null ? r._mdv.toFixed(1)+'%' : '—', cotaPctClass(r._mdv)) +
          _mtzMetric('Q1',   _mtzPct(r.q1)) +
          _mtzMetric('Q2',   _mtzPct(r.q2)) +
          _mtzMetric('Q3',   _mtzPct(r.q3)) +
          _mtzMetric('Q4',   _mtzPct(r.q4)) +
          _mtzMetric('Cota', r._at!==null ? r._at.toFixed(1)+'%' : '—', cotaPctClass(r._at)) +
        '</div>' +
      '</div>';
    }).join('');

    return '<div class="mtz-quad-col ' + q.cls + '">' +
      '<div class="mtz-quad-hdr">' +
        '<span class="mtz-q-icon">' + q.icon + '</span>' +
        '<div><div class="mtz-q-label">' + q.label + '</div>' +
        '<div class="mtz-q-desc">' + q.desc + '</div></div>' +
        '<div class="mtz-q-count">' + buckets[i].length + '</div>' +
      '</div>' +
      '<div class="mtz-quad-body">' +
        (cards || '<div class="mtz-q-empty">Nenhum rep neste quadrante</div>') +
      '</div>' +
    '</div>';
  }).join('');
}

async function mtzPrincipalTab(mes) {
  // Atualiza aba ativa
  document.querySelectorAll('.mtz-p-tab').forEach(function(b) {
    b.classList.toggle('active', b.textContent.trim() === mes);
  });
  var el = document.getElementById('mtz-p-grid');
  if (!el) return;
  // Mostra spinner enquanto carrega
  el.innerHTML = '<div class="mtz-p-loading" style="grid-column:1/-1">⏳ Carregando ' + mes + '…</div>';
  var dados = await carregarMes(mes).catch(function() { return {}; });
  el.innerHTML = _mtzPrincipalGrid(dados);
}

// ── Controller ────────────────────────────────────────────────────

function renderTudo(dados, mes) {
  PROD_DIST_SEL = null; // reset seleção de distrito no produto

  var distritos  = dados.distritos  || [];
  var reps       = dados.reps       || [];
  var nexus      = distritos.filter(function(d){ return d.linha === 'NEXUS'; });
  var vital      = distritos.filter(function(d){ return d.linha === 'VITAL'; });

  // Salva dados globalmente para uso nos painéis interativos
  window._D = dados;

  var html = '';

  // 1. KPIs
  html += renderKPIs(dados);

  // 2. JORNADA DA EVOLUÇÃO
  html += renderJornada(reps, distritos);

  // 2.5 DIAGNÓSTICO DE MARCAS
  html += renderDiagnostico(dados.diagnostico || []);

  // 3. PEX
  html += renderPEX(dados.pex || [], distritos);

  // 3.5 MATRIZ DE PERFORMANCE (inline, abaixo do PEX)
  html += renderMatrizPrincipal(dados, mes);

  // 4. VISITAS GD do mês
  html += renderVisitasMes(dados, mes, distritos);

  // 4.5 CRM CHAVE
  html += renderCrmChave(dados.crm || [], mes);

  // 5. ANÁLISE & ALERTAS (preview — abre página dedicada)
  html += renderBotaoAnalise(dados, mes);

  // 6. NEXUS – cards + painel de detalhe
  html += '<div class="sec-hdr"><div class="sec-title">NEXUS</div><div class="sec-line"></div><span class="badge n">4 distritos</span></div>';
  html += '<div class="dgrid" id="grid-nexus">' + nexus.map(function(d){ return renderDistritoCard(d, reps); }).join('') + '</div>';
  html += '<div class="distrito-detalhe" id="detalhe-nexus"></div>';

  // 5. VITAL – cards + painel de detalhe
  html += '<div class="sec-hdr"><div class="sec-title">VITAL</div><div class="sec-line"></div><span class="badge v">4 distritos</span></div>';
  html += '<div class="dgrid" id="grid-vital">' + vital.map(function(d){ return renderDistritoCard(d, reps); }).join('') + '</div>';
  html += '<div class="distrito-detalhe" id="detalhe-vital"></div>';

  // 6. PRODUTO ATINGIMENTO
  html += renderProdutoAtingimento(dados);

  // 7. Chart
  html += renderChartProdutividade(distritos, mes);

  // 8. Achados
  html += renderAchados(dados, mes);

  document.getElementById('main-content').innerHTML = html;

  // Inicializa o conteúdo de produto
  atualizarProdContent();

  requestAnimationFrame(function(){ buildChartProdutividade(distritos); });
}

async function trocarMes(mes) {
  var wasAnual   = VIEW_ATUAL === 'anual';
  var wasCota    = VIEW_ATUAL === 'cota';
  var wasVisitas = VIEW_ATUAL === 'visitas';
  var wasGloss   = VIEW_ATUAL === 'glossario';
  var wasGap     = VIEW_ATUAL === 'gap';
  var wasMatrix  = VIEW_ATUAL === 'matrix';
  if (wasAnual || wasCota || wasVisitas || wasGloss || wasGap || wasMatrix) VIEW_ATUAL = 'principal';
  if (MES_ATUAL === mes && !wasAnual && !wasCota && !wasVisitas && !wasGloss && !wasGap && !wasMatrix) return;
  MES_ATUAL = mes;
  DISTRITO_ATIVO = null;

  document.getElementById('pill-mes').textContent = mes + '/2026';
  document.querySelectorAll('.cycle-btn').forEach(function(btn){
    if (btn.classList.contains('anual-btn') || btn.classList.contains('cota-btn') ||
        btn.classList.contains('visitas-btn') || btn.classList.contains('gloss-btn') ||
        btn.classList.contains('gap-btn') || btn.classList.contains('mtz-btn')) {
      btn.classList.remove('active');
    } else {
      btn.classList.toggle('active', btn.textContent.startsWith(mes));
    }
  });

  mostrarLoading(true);
  try {
    var mesAnt = getMesAnterior(mes);
    var promises = [carregarMes(mes)];
    if (mesAnt) promises.push(carregarMes(mesAnt).catch(function(){}));
    var resultados = await Promise.all(promises);
    if (VIEW_ATUAL === 'analise') {
      renderViewAnalise(resultados[0], mes);
    } else {
      renderTudo(resultados[0], mes);
    }
  } catch(e) {
    renderErro(e.message);
  }
  mostrarLoading(false);
}

function renderErro(msg) {
  document.getElementById('main-content').innerHTML =
    '<div class="error-card">' +
    '<div class="error-icon">⚠️</div>' +
    '<div class="error-title">Erro ao carregar dados</div>' +
    '<div class="error-sub">' + (msg || 'Verifique a conexão e as configurações.') + '</div>' +
    '</div>';
}

function mostrarLoading(show) {
  document.getElementById('loading').style.display = show ? 'flex' : 'none';
}
function setLoadingTxt(txt) {
  var el = document.getElementById('loading-txt');
  if (el) el.textContent = txt;
}

// ── Init ──────────────────────────────────────────────────────────

async function init() {
  mostrarLoading(true);

  try {
    // Carregar config local (credenciais)
    setLoadingTxt('Carregando configuração…');
    var res = await fetch('config.json');
    if (!res.ok) throw new Error('config.json não encontrado. Execute python scripts/setup.py primeiro.');
    CONFIG = await res.json();

    if (!CONFIG.spreadsheet_id || !CONFIG.api_key) {
      throw new Error('SPREADSHEET_ID ou API_KEY não configurados em config.json.');
    }

    // ── Item 1: Meses ao vivo direto do Sheets ──
    setLoadingTxt('Buscando meses disponíveis…');
    var meses = CONFIG.meses_disponiveis || [];
    try {
      var cfgRows = await fetchAba('config');
      var mesesStr = '';
      cfgRows.forEach(function(r) {
        if (r.chave === 'meses_disponiveis') mesesStr = r.valor || '';
      });
      if (mesesStr) {
        var mesesSheets = mesesStr.split(',').map(function(m){ return m.trim(); }).filter(Boolean);
        if (mesesSheets.length) meses = mesesSheets; // usa o Sheets (mais atualizado)
      }
    } catch(e) {
      console.warn('Não foi possível ler meses do Sheets — usando config.json');
    }

    if (!meses.length) throw new Error('Nenhum mês disponível. Execute pipeline.py primeiro.');

    CONFIG._meses = meses; // guarda para uso em abrirVisaoAnual()

    var mesInicial = CONFIG.mes_padrao || meses[meses.length - 1];
    MES_ATUAL = mesInicial;

    document.getElementById('pill-mes').textContent = mesInicial + '/2026';
    document.getElementById('pill-atualizacao').textContent =
      'Atualizado: ' + (CONFIG.ultima_atualizacao ? CONFIG.ultima_atualizacao.substring(0,10) : '—');

    renderCycleBar(meses, mesInicial);

    // Carrega jornada, mês atual e mês anterior (para análise comparativa) em paralelo
    setLoadingTxt('Carregando dados do time…');
    var mesAntInicial = getMesAnterior(mesInicial);
    var initPromises = [carregarJornada(), carregarMes(mesInicial)];
    if (mesAntInicial) initPromises.push(carregarMes(mesAntInicial).catch(function(){}));
    await Promise.all(initPromises);

    renderTudo(DADOS_CACHE[mesInicial], mesInicial);

  } catch(e) {
    renderErro(e.message);
  }

  mostrarLoading(false);
}
