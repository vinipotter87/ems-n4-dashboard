<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>EMS | Radar de Tendências N4</title>
<style>
:root{--red:#C8102E;--red-d:#8B0B1F;--red-l:#fce8ec;--orange:#E87722;--orange-l:#FFF3E0;
--nexus:#1A3A6B;--nexus-l:#EEF2FA;--green:#15693A;--green-l:#E8F5EE;
--dark:#111827;--gray:#6B7280;--light:#F3F4F6;--border:#E5E7EB;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#ECEDF0;color:var(--dark);min-height:100vh}
.hdr{background:linear-gradient(135deg,#0f766e,#0d9488 55%,#14b8a6);position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.25)}
.hdr-inner{display:flex;align-items:center;padding:12px 28px;gap:16px}
.logo{background:#fff;padding:4px 10px;border-radius:6px;font-size:20px;font-weight:900;color:#0d9488;letter-spacing:-1px}
.hdr-sep{width:1px;height:36px;background:rgba(255,255,255,.2)}
.hdr-text h1{color:#fff;font-size:15px;font-weight:700}
.hdr-text p{color:rgba(255,255,255,.65);font-size:11px;margin-top:2px}
.hdr-pills{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.hpill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.hpill.hi{background:#fff;color:#0d9488}
.main{padding:22px 28px;max-width:1440px;margin:0 auto}

.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loading-spinner{width:48px;height:48px;border:4px solid #ccfbf1;border-top:4px solid #0d9488;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:14px;font-weight:600;color:var(--gray)}

.error-card{background:#fff;border-radius:12px;padding:28px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.error-icon{font-size:32px;margin-bottom:10px}
.error-title{font-size:15px;font-weight:800;margin-bottom:6px}
.error-sub{font-size:13px;color:var(--gray)}

.tend-page-hdr{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding:16px 22px;background:#fff;border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.07)}
.tend-linha-hdr{font-size:13px;font-weight:800;display:flex;align-items:center;gap:10px;margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.tend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.tend-card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:18px 20px;border-top:3px solid var(--border)}
.tend-card.melhorando{border-top-color:var(--green)}
.tend-card.piorando{border-top-color:var(--red)}
.tend-card.estavel{border-top-color:var(--gray)}
.tend-card-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.tend-card-nome{font-size:14px;font-weight:800;color:var(--dark)}
.tend-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 10px;border-radius:12px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.tend-badge.melhorando{background:var(--green-l);color:var(--green)}
.tend-badge.piorando{background:var(--red-l);color:var(--red)}
.tend-badge.estavel{background:var(--light);color:var(--gray)}
.tend-resumo{font-size:12.5px;color:var(--gray);line-height:1.5;margin-bottom:12px}
.tend-score{font-size:11px;color:var(--gray);margin-bottom:12px}
.tend-score b{color:var(--dark);font-size:13px}
.tend-subsec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gray);margin:12px 0 6px}
.tend-item{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:11.5px}
.tend-item.alto{border-left:3px solid var(--red);background:var(--red-l)}
.tend-item.medio{border-left:3px solid var(--orange);background:var(--orange-l)}
.tend-item.melhora{border-left:3px solid var(--green);background:var(--green-l)}
.tend-item-titulo{font-weight:700;color:var(--dark)}
.tend-item-meta{color:var(--gray);font-size:10.5px;margin-top:2px}
.tend-empty{padding:24px;text-align:center;color:var(--gray);font-size:12px;background:#fff;border-radius:12px}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-txt" id="loading-txt">Carregando radar de tendências…</div>
</div>

<div class="hdr">
  <div class="hdr-inner">
    <div class="logo">EMS</div>
    <div class="hdr-sep"></div>
    <div class="hdr-text">
      <h1>🧭 Radar de Tendências N4</h1>
      <p>Regional SPI OESTE · Cardiometabólico</p>
    </div>
    <div class="hdr-pills">
      <span class="hpill hi" id="pill-ciclo">—</span>
    </div>
  </div>
</div>

<div class="main" id="main-content"></div>

<script>
var CONFIG = {};

function sheetsUrl(aba) {
  return 'https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.spreadsheet_id +
    '/values/' + encodeURIComponent(aba) + '?key=' + CONFIG.api_key;
}

async function fetchAba(aba, tentativa) {
  tentativa = tentativa || 0;
  var res = await fetch(sheetsUrl(aba), { cache: 'no-store' });
  if (res.status === 429 && tentativa < 6) {
    var espera = 500 * Math.pow(1.8, tentativa) + Math.random() * 400;
    await new Promise(function(r) { setTimeout(r, espera); });
    return fetchAba(aba, tentativa + 1);
  }
  if (!res.ok) throw new Error('Erro ao buscar aba: ' + aba + ' (' + res.status + ')');
  var json = await res.json();
  var rows = json.values || [];
  if (rows.length < 2) return [];
  var headers = rows[0];
  return rows.slice(1).map(function(row) {
    var obj = {};
    headers.forEach(function(h, i) { obj[h] = row[i] !== undefined ? row[i] : null; });
    return obj;
  });
}

function tendSafeJSON(v, fallback) {
  if (!v) return fallback;
  try { var p = JSON.parse(v); return p === null || p === undefined ? fallback : p; }
  catch(e) { return fallback; }
}

function tendNormTrend(t) {
  t = (t || '').toString().toLowerCase();
  if (t.indexOf('melhor') > -1) return 'melhorando';
  if (t.indexOf('pior') > -1) return 'piorando';
  return 'estavel';
}

function tendSeveridadeClass(sev) {
  sev = (sev || '').toString().toLowerCase();
  if (sev.indexOf('alto') > -1 || sev.indexOf('crit') > -1) return 'alto';
  if (sev.indexOf('melhor') > -1) return 'melhora';
  return 'medio';
}

function tendCard(row) {
  var trend   = tendNormTrend(row.tendencia_qualidade);
  var trendLbl = trend === 'melhorando' ? '📈 Melhorando' : trend === 'piorando' ? '📉 Piorando' : '➖ Estável';
  var score   = row.score_qualidade_atual !== '' && row.score_qualidade_atual !== undefined && !isNaN(parseFloat(row.score_qualidade_atual))
                ? parseFloat(row.score_qualidade_atual).toFixed(1) : '—';
  var recorrencias = tendSafeJSON(row.recorrencias_json, []);
  var riscos        = tendSafeJSON(row.risco_kpi_json, []);

  var recHtml = recorrencias.length
    ? recorrencias.map(function(r){
        return '<div class="tend-item medio">' +
          '<div class="tend-item-titulo">🔁 ' + (r.tema || 'Tema não identificado') + '</div>' +
          '<div class="tend-item-meta">' + (r.meses || []).join(' → ') +
            (r.causa_provavel ? ' · ' + r.causa_provavel : '') + '</div>' +
        '</div>';
      }).join('')
    : '<div class="tend-item-meta" style="padding:4px 2px">Nenhuma recorrência não resolvida identificada no período.</div>';

  var riscoHtml = riscos.length
    ? riscos.map(function(r){
        var cls = tendSeveridadeClass(r.severidade);
        var icone = cls === 'alto' ? '🔴' : cls === 'melhora' ? '🟢' : '🟡';
        return '<div class="tend-item ' + cls + '">' +
          '<div class="tend-item-titulo">' + icone + ' ' + (r.kpi || '') + '</div>' +
          '<div class="tend-item-meta">' + (r.meses || []).join(' → ') +
            (r.detalhe ? ' · ' + r.detalhe : '') + '</div>' +
        '</div>';
      }).join('')
    : '<div class="tend-item-meta" style="padding:4px 2px">Nenhum risco de KPI recorrente identificado.</div>';

  return '<div class="tend-card ' + trend + '">' +
    '<div class="tend-card-hdr">' +
      '<div class="tend-card-nome">' + (row.nm || '') + '</div>' +
      '<span class="tend-badge ' + trend + '">' + trendLbl + '</span>' +
    '</div>' +
    '<div class="tend-resumo">' + (row.resumo || 'Sem resumo disponível.') + '</div>' +
    '<div class="tend-score">Qualidade dos combinados (mês mais recente): <b>' + score + ' / 5</b></div>' +
    '<div class="tend-subsec">🔁 Recorrências não resolvidas</div>' + recHtml +
    '<div class="tend-subsec">⚠️ Riscos de KPI</div>' + riscoHtml +
  '</div>';
}

function renderTendencias(registros, ciclo) {
  document.getElementById('pill-ciclo').textContent = 'até ' + ciclo + '/2026';

  if (!registros.length) {
    document.getElementById('main-content').innerHTML =
      '<div class="tend-empty">Nenhum dado de tendências encontrado ainda.<br>' +
      'Rode o fluxo dos agentes 09→12 (coletor-atas-notion → motor-tendencias → gerador-dossies → publicar_tendencias.py) para gerar a aba <code>tendencias_' + ciclo + '</code>.</div>';
    return;
  }

  var nexus = registros.filter(function(r){ return r.linha === 'NEXUS'; });
  var vital = registros.filter(function(r){ return r.linha === 'VITAL'; });

  var html = '';
  if (nexus.length) {
    html += '<div class="tend-linha-hdr">🔵 NEXUS</div><div class="tend-grid">' +
      nexus.map(tendCard).join('') + '</div>';
  }
  if (vital.length) {
    html += '<div class="tend-linha-hdr">🔴 VITAL</div><div class="tend-grid">' +
      vital.map(tendCard).join('') + '</div>';
  }

  document.getElementById('main-content').innerHTML = html;
}

function renderErro(msg) {
  document.getElementById('main-content').innerHTML =
    '<div class="error-card">' +
    '<div class="error-icon">⚠️</div>' +
    '<div class="error-title">Erro ao carregar dados</div>' +
    '<div class="error-sub">' + (msg || 'Verifique a conexão e as configurações.') + '</div>' +
    '</div>';
}

function mostrarLoading(show) {
  document.getElementById('loading').style.display = show ? 'flex' : 'none';
}

function setLoadingTxt(txt) {
  document.getElementById('loading-txt').textContent = txt;
}

async function init() {
  mostrarLoading(true);
  try {
    setLoadingTxt('Carregando configuração…');
    var res = await fetch('config.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('config.json não encontrado.');
    CONFIG = await res.json();
    if (!CONFIG.spreadsheet_id || !CONFIG.api_key) {
      throw new Error('SPREADSHEET_ID ou API_KEY não configurados em config.json.');
    }

    setLoadingTxt('Buscando ciclos disponíveis…');
    var meses = CONFIG.meses_disponiveis || [];
    try {
      var cfgRows = await fetchAba('config');
      var mesesStr = '';
      cfgRows.forEach(function(r) { if (r.chave === 'meses_disponiveis') mesesStr = r.valor || ''; });
      if (mesesStr) {
        var mesesSheets = mesesStr.split(',').map(function(m){ return m.trim(); }).filter(Boolean);
        if (mesesSheets.length) meses = mesesSheets;
      }
    } catch(e) {
      console.warn('Não foi possível ler meses do Sheets — usando config.json');
    }

    setLoadingTxt('Carregando radar de tendências…');
    // A aba tendencias_{ciclo} pode existir para um ciclo mais recente do que os
    // já "fechados" em meses_disponiveis (ex.: briefing pré-N4 do mês em
    // andamento). Tenta esse +1 além dos meses já disponíveis, além dos
    // próprios meses conhecidos — evita disparar muitos requests seguidos.
    var TODOS_MESES = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
    var candidatos = meses.slice().reverse();
    var idxUltimo = TODOS_MESES.indexOf(meses[meses.length - 1]);
    if (idxUltimo > -1 && idxUltimo + 1 < TODOS_MESES.length) {
      candidatos.unshift(TODOS_MESES[idxUltimo + 1]);
    }
    var registros = [];
    var cicloEncontrado = meses[meses.length - 1] || '';
    for (var i = 0; i < candidatos.length; i++) {
      try {
        var rows = await fetchAba('tendencias_' + candidatos[i]);
        if (rows.length) { registros = rows; cicloEncontrado = candidatos[i]; break; }
      } catch(e) { /* aba ainda não existe para esse ciclo — tenta o anterior */ }
    }
    renderTendencias(registros, cicloEncontrado);
  } catch(e) {
    renderErro(e.message);
  }
  mostrarLoading(false);
}

init();
</script>
</body>
</html>
