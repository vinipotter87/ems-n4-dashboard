<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>EMS | Atas de N4</title>
<style>
:root{--red:#C8102E;--gray:#6B7280;--light:#F3F4F6;--border:#E5E7EB;--brand:#0057B8;--brand-d:#003D82;--text:#111827}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:#ECEDF0;color:var(--text);font-size:13px;display:flex;flex-direction:column}
button,select,input{font-family:inherit}
.hdr{background:linear-gradient(135deg,var(--brand-d),var(--brand));color:#fff;padding:14px 28px;display:flex;align-items:center;gap:16px;flex:none}
.logo{background:#fff;color:var(--brand);font-weight:900;font-size:16px;padding:5px 11px;border-radius:7px}
.hdr h1{font-size:19px;font-weight:800}
.hdr p{font-size:12px;opacity:.85;margin-top:2px}
.hdr .sp{flex:1}
.hdr a{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;white-space:nowrap}
.bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none}
.bar label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}
.bar select,.bar input{border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff}
.bar input{min-width:240px}
.bar button{margin-left:auto;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--brand);cursor:pointer}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;padding:16px 28px 20px}
.lista{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);overflow:auto}
.lista h2{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--gray);padding:12px 16px 8px;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border)}
.item{display:block;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--border);border-left:4px solid transparent;padding:10px 14px;cursor:pointer}
.item:hover{background:#f8fafc}
.item.on{background:#eff6ff;border-left-color:var(--brand)}
.item b{display:block;font-size:13px}
.item span{display:block;font-size:11.5px;color:var(--gray);margin-top:2px;line-height:1.4}
.tag{display:inline-block;font-size:10px;font-weight:800;border-radius:20px;padding:2px 9px;white-space:nowrap;margin-right:4px}
.tag.col{background:#e0e7ff;color:#3730a3}.tag.ind{background:#fef3c7;color:#92400e}.tag.ok{background:#dcfce7;color:#166534}.tag.sem{background:#f3f4f6;color:#6b7280}
.doc{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);overflow:auto;padding:26px 34px 40px}
.doc .cab{border-bottom:3px solid var(--brand);padding-bottom:12px;margin-bottom:16px;display:flex;gap:16px;align-items:flex-start}
.doc .cab h2{font-size:20px;font-weight:800;color:var(--brand-d);line-height:1.25}
.doc .cab p{font-size:12px;color:var(--gray);margin-top:5px;line-height:1.5}
.doc .cab button{margin-left:auto;flex:none;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--brand);cursor:pointer}
.txt{max-width:980px;font-size:14px;line-height:1.65}
.txt h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--brand-d);background:#eff6ff;border-left:4px solid var(--brand);border-radius:0 8px 8px 0;padding:7px 12px;margin:22px 0 10px}
.txt h4{font-size:14.5px;font-weight:800;margin:16px 0 6px;color:var(--text)}
.txt p{margin:0 0 8px}
.txt p b{color:var(--brand-d)}
.txt p.meta{margin:0 0 3px}
.txt p.tit{font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:13px}
th{background:#f1f5f9;color:#334155;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:8px 9px;text-align:left;font-weight:800}
td{padding:8px 9px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.45}
.st{display:inline-block;font-size:11.5px;font-weight:800;border-radius:8px;padding:3px 9px;border:1.5px solid;white-space:nowrap}
.st.Pendente{color:#b45309;border-color:#fcd34d;background:#fffbeb}.st.Em{color:#1d4ed8;border-color:#93c5fd;background:#eff6ff}
.st.Resolvido{color:#15803d;border-color:#86efac;background:#f0fdf4}.st.Nao{color:#b91c1c;border-color:#fca5a5;background:#fef2f2}
.aviso{background:#fef9c3;color:#854d0e;font-size:12.5px;font-weight:700;padding:10px 14px;border-radius:8px;margin-bottom:14px;line-height:1.5}
.vazio{text-align:center;color:var(--gray);padding:60px 20px;line-height:1.7}
.vazio b{display:block;font-size:16px;color:var(--text)}
@media(max-width:1000px){body{display:block;height:auto}.cols{grid-template-columns:1fr}.lista{max-height:320px}}
@media print{.hdr a,.bar,.lista,.doc .cab button{display:none}.cols{display:block;padding:0}.doc{box-shadow:none;overflow:visible;padding:0}body{background:#fff;display:block}}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">EMS</div>
  <div><h1>📄 Atas de N4</h1><p><span id="pg-reg">Regional SPI Oeste</span> · atas completas das reuniões N4 (GRD × GD) anexadas no modo apresentação</p></div>
  <span class="sp"></span>
  <a href="index.html" id="pg-volta">← Dashboard</a>
</div>

<div class="bar">
  <label for="f-gd">GD</label><select id="f-gd"><option value="">Todos</option></select>
  <label for="f-mes">Mês dos dados</label><select id="f-mes"><option value="">Todos</option></select>
  <input id="f-busca" type="search" placeholder="Buscar no texto das atas">
  <button id="btn-atualizar">🔄 Atualizar</button>
</div>

<div class="cols">
  <div class="lista" id="lista"><div class="vazio">Carregando atas…</div></div>
  <div class="doc" id="doc"><div class="vazio"><b>Escolha uma ata na lista</b>O texto completo aparece aqui.</div></div>
</div>

<script>
// ── Atas de N4 ───────────────────────────────────────────────────
// Leitura das atas de N4 que os GDs anexam no modo apresentação do dashboard
// (index.html / leste.html → ▶ Apresentação → último slide). Cada ata são duas
// linhas da aba budget_lancamentos, com gd = "N4:<distrito_id>" e crm =
// "ata|<mês da apresentação>": produto N4_ATA guarda os combinados (com status)
// e produto N4_ATA_DOC guarda o texto integral extraído do PDF. Atas anexadas
// antes de o texto integral existir têm só os combinados. A mesma página serve
// às duas regionais: atas-n4.html (SPI Oeste) e atas-n4.html?regional=LESTE.
// Página somente de leitura.
var TAB = 'budget_lancamentos', MESES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
var REGIONAL_LESTE = /[?&]regional=leste(&|$)/i.test(window.location.search);
var CONFIG = {}, ATAS = [], GDS = {}, SEL = null;
var TOPO = /^(RESUMO DA REUNI[ÃA]O|O QUE FOI DISCUTIDO POR BLOCO|IDEIAS E INICIATIVAS.*|COMBINADOS DA REUNI[ÃA]O|PR[ÓO]XIMA N4)$/;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dataBr(iso){ var x = String(iso || '').split('-'); return x.length === 3 ? x[2] + '/' + x[1] + '/' + x[0] : ''; }
function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function daRegional(distrito){ return (REGIONAL_LESTE ? /^(1105|1165)/ : /^(1103|1163)/).test(distrito); }
if (REGIONAL_LESTE){ document.title = 'EMS | Atas de N4 — Leste'; $('pg-reg').textContent = 'Regional Leste'; $('pg-volta').href = 'leste.html'; }

async function fetchAba(aba, tent){
  tent = tent || 0;
  var res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.spreadsheet_id + '/values/' + encodeURIComponent(aba) + '?key=' + CONFIG.api_key, {cache:'no-store'});
  if (res.status === 429 && tent < 6){ await new Promise(function(r){ setTimeout(r, 600 * Math.pow(1.8, tent)); }); return fetchAba(aba, tent + 1); }
  if (res.status === 400) return [];
  if (!res.ok) throw new Error('Erro ao buscar a aba ' + aba + ' (' + res.status + ')');
  var rows = (await res.json()).values || [];
  if (rows.length < 2) return [];
  var h = rows[0];
  return rows.slice(1).map(function(r){ var o = {}; h.forEach(function(k, i){ o[k] = r[i] !== undefined ? r[i] : ''; }); return o; });
}

async function carregar(){
  $('lista').innerHTML = '<div class="vazio">Carregando atas…</div>';
  var linhas = await fetchAba(TAB), docs = {};
  if (!Object.keys(GDS).length){ // nomes dos GDs: último mês com a aba de distritos
    var cfg = await fetchAba('config'), meses = MESES.slice();
    cfg.forEach(function(r){ if (r.chave === 'meses_disponiveis') meses = r.valor.split(',').map(function(s){ return s.trim(); }); });
    for (var i = meses.length - 1; i >= 0 && !Object.keys(GDS).length; i--) (await fetchAba('distritos_' + meses[i])).forEach(function(d){ GDS[d.distrito_id] = d; });
  }
  linhas.forEach(function(l){ if (l.produto === 'N4_ATA_DOC'){ try { docs[l.gd + '§' + l.crm] = JSON.parse(l.acao); } catch(e){} } });
  ATAS = [];
  linhas.forEach(function(l){
    if (l.produto !== 'N4_ATA' || String(l.gd).indexOf('N4:') !== 0 || !/^ata\|[A-Z]{3}$/.test(l.crm)) return;
    var distrito = String(l.gd).slice(3); if (!daRegional(distrito)) return;
    var a; try { a = JSON.parse(l.acao); } catch(e){ return; }
    var g = GDS[distrito] || {};
    ATAS.push({ id: l.id, distrito: distrito, gd: g.nm || distrito, linha: g.linha || l.linha, mes: l.crm.slice(4), anexada: l.data, ata: a, doc: docs[l.gd + '§' + l.crm] || null, criado: Number(l.criadoEm) || 0 });
  });
  ATAS.sort(function(p, q){ return MESES.indexOf(q.mes) - MESES.indexOf(p.mes) || p.gd.localeCompare(q.gd) || q.criado - p.criado; });
  function opcoes(id, vals, rot){ var sel = $(id), atual = sel.value; sel.innerHTML = '<option value="">Todos</option>' + vals.map(function(v){ return '<option value="' + v[0] + '">' + esc(v[1]) + '</option>'; }).join(''); sel.value = atual; }
  var vg = {}, vm = {}; ATAS.forEach(function(t){ vg[t.distrito] = t.gd; vm[t.mes] = 1; });
  opcoes('f-gd', Object.keys(vg).map(function(k){ return [k, vg[k]]; }).sort(function(a, b){ return a[1].localeCompare(b[1]); }));
  opcoes('f-mes', MESES.filter(function(m){ return vm[m]; }).reverse().map(function(m){ return [m, m + '/2026']; }));
  var pedido = (location.search.match(/[?&]id=([^&]+)/) || [])[1];
  if (!SEL && pedido && ATAS.some(function(t){ return t.id === pedido; })) SEL = pedido;
  desenharLista(); desenharDoc();
}

function filtradas(){
  var gd = $('f-gd').value, mes = $('f-mes').value, b = norm($('f-busca').value.trim());
  return ATAS.filter(function(t){
    if (gd && t.distrito !== gd) return false;
    if (mes && t.mes !== mes) return false;
    if (b){ var txt = norm([t.gd, t.ata.titulo, t.ata.arquivo, t.doc ? t.doc.texto : ''].concat(t.ata.itens.map(function(i){ return i.texto + ' ' + i.resp; })).join(' ')); if (txt.indexOf(b) < 0) return false; }
    return true;
  });
}
function desenharLista(){
  var ls = filtradas();
  if (!ATAS.length){ $('lista').innerHTML = '<div class="vazio"><b>Nenhuma ata anexada</b>As atas aparecem aqui quando são anexadas no último slide da apresentação da N4.</div>'; return; }
  $('lista').innerHTML = '<h2>' + ls.length + ' de ' + ATAS.length + ' atas · mais recentes primeiro</h2>' + (ls.length ? ls.map(function(t){
    var res = t.ata.itens.filter(function(i){ return i.status === 'Resolvido'; }).length;
    return '<button class="item' + (t.id === SEL ? ' on' : '') + '" onclick="abrir(\'' + t.id + '\')"><b>' + esc(t.ata.titulo || 'Ata N4 · ' + t.gd) + '</b>' +
      '<span><i class="tag col" style="font-style:normal">dados de ' + t.mes + '/2026</i><i class="tag ' + (t.doc ? 'ok' : 'sem') + '" style="font-style:normal">' + (t.doc ? 'ata completa' : 'só combinados') + '</i></span>' +
      '<span>' + esc(t.gd) + ' · ' + t.ata.itens.length + ' combinados · ' + res + ' resolvidos</span></button>'; }).join('') : '<div class="vazio">Nenhuma ata com esses filtros.</div>');
}
function abrir(id){ SEL = id; desenharLista(); desenharDoc(); $('doc').scrollTop = 0; }

function combinadosHtml(t){
  if (!t.ata.itens.length) return '<p>Nenhum combinado registrado.</p>';
  return '<table><thead><tr><th style="width:36px">#</th><th>Combinado</th><th style="width:150px">Responsável</th><th style="width:190px">Prazo</th><th style="width:130px">Status</th></tr></thead><tbody>' + t.ata.itens.map(function(i){
    var st = i.status || 'Pendente';
    return '<tr><td>' + i.n + '</td><td>' + esc(i.texto) + '</td><td>' + esc(i.resp) + '</td><td>' + esc(i.prazo) + '</td><td><span class="st ' + (st === 'Em andamento' ? 'Em' : (st === 'Não executado' ? 'Nao' : st)) + '">' + esc(st) + '</span></td></tr>'; }).join('') + '</tbody></table>';
}
function textoHtml(t){ // parágrafos separados por linha em branco; títulos de seção e de bloco em destaque
  var pos = 0, usou = false, h = '';
  t.doc.texto.split(/\n\s*\n/).forEach(function(par){
    var linha = par.replace(/\s*\n\s*/g, ' ').trim(); if (!linha) return; pos++;
    if (linha === '[[COMBINADOS]]'){ h += combinadosHtml(t); usou = true; return; }
    if (TOPO.test(linha)){ h += '<h3>' + esc(linha) + '</h3>'; return; }
    if (/^B\d\s*[—–-]\s*\S/.test(linha) && linha.length < 70){ h += '<h4>' + esc(linha) + '</h4>'; return; }
    if (pos === 1 && /^ATA N4/i.test(linha)) return; // o título já está no cabeçalho
    if (pos === 2 && linha.length < 40 && !/^Data\b/.test(linha) && !TOPO.test(linha)) return; // resto de um título que quebrou em duas linhas
    var e = esc(linha);
    if (/^• /.test(linha)){ e = e.replace(/^• ([^:]{2,60}:)/, '• <b>$1</b>'); h += '<p style="padding-left:16px;text-indent:-12px">' + e + '</p>'; return; }
    e = e.replace(/^(Data|Data prevista|Pontos de aten[çc][ãa]o para verificar)(:)/, '<b>$1$2</b>').replace(/\|\s*(Dura[çc][ãa]o|Participantes):/g, '| <b>$1:</b>');
    h += '<p>' + e + '</p>';
  });
  if (!usou) h += '<h3>COMBINADOS DA REUNIÃO</h3>' + combinadosHtml(t);
  return h;
}
function desenharDoc(){
  var t = ATAS.filter(function(x){ return x.id === SEL; })[0];
  if (!t){ $('doc').innerHTML = '<div class="vazio"><b>Escolha uma ata na lista</b>O texto completo aparece aqui.</div>'; return; }
  var h = '<div class="cab"><div><h2>' + esc(t.ata.titulo || 'Ata da N4') + '</h2><p>GD ' + esc(t.gd) + (t.linha ? ' · ' + esc(t.linha) : '') + ' · apresentação com dados de <b>' + t.mes + '/2026</b>' + (t.ata.data ? ' · reunião de ' + esc(t.ata.data) : '') +
    '<br>Anexada em ' + dataBr(t.anexada) + (t.ata.arquivo ? ' · arquivo: ' + esc(t.ata.arquivo) : '') + '</p></div><button onclick="window.print()">🖨️ Imprimir / PDF</button></div>';
  if (t.doc && t.doc.texto) h += '<div class="txt">' + textoHtml(t) + '</div>';
  else h += '<div class="aviso">Desta ata só os combinados foram guardados — ela foi anexada antes de a página salvar o texto completo. Para ter a ata inteira aqui, anexe o PDF de novo na apresentação (slide da ata → "Trocar ata").</div>' +
    '<div class="txt"><h3>COMBINADOS DA REUNIÃO</h3>' + combinadosHtml(t) + '</div>';
  $('doc').innerHTML = h;
}

['f-gd', 'f-mes'].forEach(function(id){ $(id).addEventListener('change', desenharLista); });
$('f-busca').addEventListener('input', desenharLista);
$('btn-atualizar').addEventListener('click', function(){ carregar().catch(erro); });
function erro(e){ $('lista').innerHTML = '<div class="vazio"><b>Erro ao carregar</b>' + esc(e.message) + '</div>'; }

(async function(){
  try {
    var res = await fetch('config.json?t=' + Date.now(), {cache:'no-store'}); if (!res.ok) throw new Error('config.json não encontrado.');
    CONFIG = await res.json();
    await carregar();
  } catch(e){ erro(e); }
})();
</script>
</body>
</html>
