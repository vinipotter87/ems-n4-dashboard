<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMS | Copiloto de RPS</title>
<style>
:root{--red:#C8102E;--orange:#E87722;--gray:#6B7280;--light:#F3F4F6;--border:#E5E7EB;--brand:#0057B8;--brand-d:#003D82;--text:#111827}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:#0b1f3f;color:var(--text);font-size:13px;overflow:hidden}
button,select,input,textarea{font-family:inherit}
.top{height:48px;background:var(--brand-d);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;font-size:14px;font-weight:700}
.logo{background:#fff;color:var(--brand);font-weight:900;font-size:14px;padding:3px 9px;border-radius:6px}
.sp{flex:1}
.btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover:not(:disabled){background:rgba(255,255,255,.25)}.btn:disabled{opacity:.35;cursor:default}
.stage{height:calc(100% - 48px - 46px);padding:12px 18px 6px}
.slide{display:none;height:100%;background:#ECEDF0;border-radius:14px;overflow:hidden;flex-direction:column}
.slide.on{display:flex}
.hdr{flex:none;display:flex;align-items:baseline;gap:16px;background:#fff;padding:12px 24px;border-bottom:3px solid var(--brand)}
.hdr h2{font-size:20px;font-weight:800;color:var(--brand-d);white-space:nowrap}
.hdr span{font-size:14px;font-weight:600;color:var(--gray)}
.body{flex:1;min-height:0;overflow:hidden;padding:14px 22px}
.nav{height:46px;display:flex;align-items:center;gap:8px;padding:0 18px;color:#fff}
.dots{flex:1;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.dots button{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:7px;min-width:30px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer}
.dots button.on{background:#fff;color:var(--brand-d)}
#cnt{font-size:12px;font-weight:700;opacity:.8;min-width:54px;text-align:right}
/* capa e entrada */
.capa{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 60px;background:linear-gradient(135deg,var(--brand-d),var(--brand));color:#fff;overflow:auto}
.capa .k{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;opacity:.8}
.capa h2{font-size:42px;font-weight:900;line-height:1.1;margin:8px 0 10px}
.capa .m{font-size:15px;opacity:.9}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:24px}
.grade button{display:flex;align-items:center;gap:10px;text-align:left;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
.grade button:hover{background:rgba(255,255,255,.24)}
.grade b{background:#fff;color:var(--brand-d);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:900}
.modelos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:22px 0 18px;max-width:1080px}
.modelo{background:rgba(255,255,255,.1);border:2px solid transparent;border-radius:14px;padding:18px 20px;color:#fff;text-align:left;cursor:pointer}
.modelo.on{border-color:#fff;background:rgba(255,255,255,.2)}
.modelo:disabled{opacity:.45;cursor:default}
.modelo b{display:block;font-size:19px;margin-bottom:4px}
.modelo span{font-size:12.5px;opacity:.9;line-height:1.45}
.form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;max-width:900px}
.form label{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;opacity:.8;margin-bottom:4px}
.form select,.form input{border:none;border-radius:8px;padding:9px 12px;font-size:14px;min-width:150px}
.form .ir{background:#fff;color:var(--brand-d);border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:800;cursor:pointer}
/* tela de entrada (Copiloto de RPS) */
.capa.ent{position:relative;padding:40px 64px;background:radial-gradient(900px 520px at 78% 8%,#1f6fe0 0%,rgba(31,111,224,0) 62%),radial-gradient(700px 480px at 4% 100%,#0b5bd6 0%,rgba(11,91,214,0) 60%),linear-gradient(135deg,#031a52 0%,#062a7a 45%,#0a3fb0 100%)}
.capa.ent>*{position:relative;z-index:1}
.capa.ent .deco{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.capa.ent .k{font-size:15px;font-weight:600;letter-spacing:5px;opacity:.9}
.capa.ent .k:after{content:'';display:block;width:128px;height:3px;border-radius:3px;margin-top:12px;background:linear-gradient(90deg,#22b8ff,rgba(34,184,255,.15))}
.capa.ent h2{font-size:clamp(40px,5.4vw,74px);font-weight:900;letter-spacing:.5px;text-transform:uppercase;margin:16px 0 12px;text-shadow:0 6px 24px rgba(0,10,60,.45)}
.capa.ent h2 span{background:linear-gradient(90deg,#1f8fff,#38c6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.capa.ent .m{font-size:clamp(14px,1.45vw,19px);opacity:.95}
.capa.ent .modelos{gap:22px;margin:30px 0 34px;max-width:1200px}
.capa.ent .modelo{display:grid;grid-template-columns:66px 1fr;column-gap:18px;row-gap:14px;align-items:center;align-content:start;background:rgba(18,72,170,.42);border:1.5px solid rgba(120,180,255,.28);border-radius:20px;padding:24px 26px;min-height:190px;backdrop-filter:blur(6px);transition:background .15s,border-color .15s,box-shadow .15s}
.capa.ent .modelo:hover{background:rgba(30,100,215,.5);border-color:rgba(120,200,255,.6)}
.capa.ent .modelo.on{background:linear-gradient(160deg,rgba(30,110,235,.85),rgba(12,70,190,.8));border-color:#5cc8ff;box-shadow:0 0 0 1px rgba(92,200,255,.6),0 0 28px rgba(60,170,255,.55)}
.capa.ent .modelo i{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#2b8cff,#0f5fe0);box-shadow:0 6px 18px rgba(0,30,110,.4)}
.capa.ent .modelo i svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.capa.ent .modelo b{font-size:clamp(19px,1.9vw,25px);margin:0}
.capa.ent .modelo span{grid-column:1/-1;font-size:clamp(12.5px,1.15vw,15.5px);line-height:1.5;opacity:.95}
.capa.ent .form{gap:20px;max-width:1200px;flex-wrap:nowrap}
.capa.ent .form>div:first-child{flex:2.3;min-width:0}.capa.ent .form>div{flex:1;min-width:0}
.capa.ent .form label{font-size:12px;letter-spacing:.8px;opacity:.9;margin-bottom:7px}
.capa.ent .form select,.capa.ent .form input{width:100%;min-width:0;height:52px;border-radius:10px;padding:0 16px;font-size:16px;color:#0b1f3f;background:#fff;box-shadow:0 6px 18px rgba(0,20,90,.3)}
.capa.ent .form .ir{flex:1.55;height:60px;border-radius:14px;padding:0 20px;font-size:clamp(15px,1.45vw,19px);font-weight:800;color:#04246b;white-space:nowrap;background:linear-gradient(180deg,#5fd0ff,#2aa5ff);border:1.5px solid #9be2ff;box-shadow:0 0 26px rgba(60,180,255,.6)}
.capa.ent .form .ir:hover{filter:brightness(1.07)}
@media(max-height:760px){.capa.ent{padding:3.5vh 48px}.capa.ent h2{font-size:clamp(30px,8.5vh,60px);margin:1.6vh 0 1.2vh}.capa.ent .k{font-size:12px}.capa.ent .k:after{margin-top:7px}.capa.ent .modelos{margin:3vh 0 3.2vh;gap:16px}
  .capa.ent .modelo{min-height:0;padding:2.4vh 20px;grid-template-columns:48px 1fr;column-gap:14px;row-gap:1.4vh}.capa.ent .modelo i{width:48px;height:48px}.capa.ent .modelo i svg{width:24px;height:24px}
  .capa.ent .form select,.capa.ent .form input{height:44px;font-size:14.5px}.capa.ent .form .ir{height:48px}.capa.ent .form label{margin-bottom:4px}}
@media(max-width:900px){.capa.ent{padding:26px 22px;justify-content:flex-start}.capa.ent .modelos{grid-template-columns:1fr}.capa.ent .modelo{min-height:0}.capa.ent .form{flex-wrap:wrap}.capa.ent .form>div,.capa.ent .form .ir{flex:1 1 100%}}
/* slide de tema ainda sem conteúdo */
.constr{height:100%;min-height:36vh;display:flex;align-items:center;justify-content:center}
.constr span{display:block;width:100%;text-align:center;padding:14px 0;font-size:clamp(20px,2.3vw,30px);font-weight:900;letter-spacing:6px;text-transform:uppercase;color:#1f2937;background:repeating-linear-gradient(-45deg,#facc15 0 28px,#fde047 28px 56px);border-top:6px solid #1f2937;border-bottom:6px solid #1f2937;transform:rotate(-4deg);box-shadow:0 10px 28px rgba(0,0,0,.18)}
/* peças */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:12px;border-top:4px solid var(--brand);padding:10px 14px}
.kpi.ok{border-top-color:#22c55e}.kpi.warn{border-top-color:#f59e0b}.kpi.crit{border-top-color:#ef4444}
.kpi .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}
.kpi .v{font-size:24px;font-weight:800;line-height:1.2}.kpi .s{font-size:11.5px;color:var(--gray)}
.card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--brand-d);margin-bottom:8px}
.card h3 small{font-weight:600;text-transform:none;letter-spacing:0;color:var(--gray);margin-left:6px}
table{width:100%;border-collapse:collapse}
th{background:#f1f5f9;color:#334155;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:7px 9px;text-align:center;font-weight:800}
td{padding:6px 9px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle}
th:first-child,td:first-child{text-align:left}
td.n{font-weight:700;text-align:left}
tr.tot td{background:#f3f4f6;font-weight:800}
.p{font-weight:800}.p.ok{color:#15803d}.p.warn{color:#b45309}.p.crit{color:#b91c1c}
.cel{display:inline-block;min-width:58px;padding:2px 7px;border-radius:6px;font-weight:700}
.cel.ok{background:#dcfce7;color:#166534}.cel.warn{background:#fef3c7;color:#92400e}.cel.crit{background:#fee2e2;color:#991b1b}.cel.na{background:#f3f4f6;color:#9ca3af}
.bar{display:inline-block;width:70px;height:7px;background:#e5e7eb;border-radius:4px;overflow:hidden;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%}.bar i.ok{background:#22c55e}.bar i.warn{background:#f59e0b}.bar i.crit{background:#ef4444}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap}
.tag.OURO{background:#fef3c7;color:#92400e}.tag.PRATA{background:#e5e7eb;color:#374151}.tag.BRONZE{background:#fde5d0;color:#9a3412}.tag.ATENCAO{background:#fef9c3;color:#854d0e}.tag.CRITICO{background:#fee2e2;color:#991b1b}
.tag.Destaque{background:#dcfce7;color:#166534}.tag.Performance{background:#ffedd5;color:#9a3412}.tag.Start{background:#fee2e2;color:#991b1b}
.tag.foco{background:var(--brand);color:#fff}
.nota{font-size:11px;color:var(--gray);line-height:1.5;margin-top:8px}
.aviso{background:#fef9c3;color:#854d0e;font-size:12px;font-weight:700;padding:7px 12px;border-radius:8px;margin-bottom:10px}
.titulo-so{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%}
.titulo-so h2{font-size:46px;font-weight:900;color:var(--brand-d)}
.titulo-so p{font-size:14px;color:var(--gray);margin-top:10px}
/* fundamentos e planos (individual) */
.fund{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.fc{background:#fff;border:1px solid var(--border);border-top:4px solid #22c55e;border-radius:10px;padding:9px 12px}
.fc.desvio{border-top-color:#ef4444;background:#fff7f7}.fc.sem{border-top-color:#d1d5db}
.fc .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}.fc .v{font-size:20px;font-weight:800;line-height:1.2}.fc .s{font-size:10.5px;color:var(--gray)}
.fc .t{font-size:10.5px;font-weight:800;margin-top:3px;color:#15803d}.fc.desvio .t{color:#b91c1c}.fc.sem .t{color:#9ca3af}
.pok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;border-radius:10px;padding:16px 18px;font-size:14px;font-weight:700}
.plano{background:#fff;border:1px solid var(--border);border-left:5px solid var(--brand);border-radius:10px;padding:12px 16px}
.ph{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;color:var(--brand-d);margin-bottom:8px}.ph span{font-size:11px;font-weight:600;color:var(--gray)}
.pl{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);margin:9px 0 4px}.pl small{font-weight:600;text-transform:none;letter-spacing:0}
.plano textarea,.plano input[type=text]{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:6px 9px;font-size:12.5px;line-height:1.4;background:#fffef7;resize:vertical}
.pk{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;margin-top:6px;align-items:center}.pk span{font-weight:700;color:var(--gray)}
.pq{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;margin-bottom:5px}.pq b{font-size:11.5px;color:var(--brand-d)}
.pcr{font-size:12px;margin-top:4px;color:var(--gray)}.pcr b{color:#b91c1c}
.wt td{vertical-align:top;text-align:left;padding:4px 5px}.wt th{text-align:left}.wt.ver td{padding:7px 9px;font-size:12.5px}
.pf{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11.5px;color:var(--gray);flex-wrap:wrap}
.pp{background:#f8fafc;border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.5;margin-bottom:10px}
.pp b,.psub{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);margin-bottom:3px}
.ptags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.ptags span{background:#fee2e2;color:#991b1b;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 9px}
.pcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px}
.pv{border-left:3px solid #cbd5e1;padding:3px 0 3px 10px;margin:0 0 6px;font-size:13px;line-height:1.4}.pv i{display:block;font-style:normal;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--gray)}
.pv.raiz{border-left-color:#ef4444;background:#fef2f2;border-radius:0 8px 8px 0;padding:6px 10px;font-weight:700}.pv.raiz i{color:#b91c1c}
/* histórico do time */
.body.rol{overflow:auto}
.abas{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.abas button{background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:8px 18px;font-size:13px;font-weight:800;color:var(--gray);cursor:pointer}
.abas button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.det{border:1px solid var(--border);border-left:5px solid var(--brand);border-radius:10px;margin-bottom:10px;overflow:hidden}
.det summary{list-style:none;cursor:pointer;padding:10px 14px;background:#fafbfc;font-size:13px}
.det summary::-webkit-details-marker{display:none}
.det summary span{display:block;font-size:11.5px;color:var(--gray);margin-top:2px}
.detc{padding:12px 14px}
/* evolução dos planos */
.evol{margin-top:12px}
.ev{display:inline-block;background:#f3f4f6;border-radius:8px;padding:4px 9px;margin:2px 0;font-size:12.5px;font-weight:700;line-height:1.25;text-align:left}
.ev i{display:block;font-style:normal;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--gray)}
.ev.at{background:#dbeafe;color:var(--brand-d)}.evs{color:#9ca3af;margin:0 5px;font-weight:700}
/* ata */
.vazio{background:#fff;border:2px dashed var(--border);border-radius:14px;padding:38px 30px;text-align:center;color:var(--gray);line-height:1.6}
.vazio b{display:block;font-size:17px;color:var(--text)}.vazio p{max-width:600px;margin:6px auto 16px}
.b1{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-block}
.b2{background:#fff;border:1.5px solid var(--border);border-radius:7px;padding:4px 11px;font-size:11.5px;font-weight:700;color:var(--brand);cursor:pointer;display:inline-block}
.ata-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}.ata-top .ac{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.ata-tb td{vertical-align:top}.ata-tb td.n{font-weight:600;white-space:normal}
.ata-tb textarea,.ata-tb input{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:5px 8px;font-size:12.5px;line-height:1.4;background:#fffef7;resize:vertical}
.st{font-size:12px;font-weight:700;border-radius:8px;padding:4px 8px;border:1.5px solid var(--border);background:#fff;cursor:pointer}
.st.ok{color:#15803d;border-color:#86efac;background:#f0fdf4}.st.warn{color:#b45309;border-color:#fcd34d;background:#fffbeb}.st.crit{color:#b91c1c;border-color:#fca5a5;background:#fef2f2}
#ata-st{font-size:12px;color:var(--gray);margin-top:8px;min-height:16px}
</style>
</head>
<body>
<div class="top"><div class="logo">EMS</div><span id="ctx">Copiloto de RPS — Reunião de Performance Semanal</span><span class="sp"></span>
  <button class="btn" id="b-rep" style="display:none" onclick="telaReps()">⇄ Trocar representante</button><button class="btn" id="b-trocar" style="display:none">⇄ Trocar reunião</button><a class="btn" href="index.html">← Dashboard</a></div>
<div class="stage" id="stage"></div>
<div class="nav"><button class="btn" id="b-prev">← Anterior</button><div class="dots" id="dots"></div><span id="cnt"></span><button class="btn" id="b-next">Próximo →</button></div>

<script>
// ── RPS — apresentação do GD com o time ──────────────────────────
// Página isolada: escolhe o modelo (coletiva ou individual), o GD, o mês e a
// data da reunião. A INDIVIDUAL abre um representante (ver bloco próprio abaixo).
// A COLETIVA é montada por GD com os mesmos dados do
// dashboard da regional (abas do Sheets) — só SPI. Frequência e sobreposição
// são snapshots guardados dentro do index.html; esta página lê de lá para
// não duplicar. Os combinados anteriores vêm da ata da RPS anterior em PDF
// (tabela "Plano de ação consolidado"), lida no navegador e gravada no Sheets
// pelo Apps Script do Budget: 1 linha em budget_lancamentos com produto
// RPS_ATA, gd "N4:<distrito_id>" (as páginas de Budget ignoram) e
// crm "rps|<data da reunião>".
var MESES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
var MARCAS_CHAVE = {
  NEXUS: [{desde:'JAN', m:['BRAMICAR','BRAMICAR HCT','OLIRE','LYBERDIA']}, {desde:'JUL', m:['CONCARDIO','LYBERDIA','OZIVY']}],
  VITAL: [{desde:'JAN', m:['BRASART HCT','BRASART BCC','LINADIB','LINADIB DUO','BUPIUM XL']}, {desde:'JUL', m:['OZIVY','LINADIB','LINADIB DUO','BUPIUM XL']}]
};
var STATUS = ['Pendente', 'Em andamento', 'Resolvido', 'Não executado'], COR = {'Pendente':'warn','Em andamento':'warn','Resolvido':'ok','Não executado':'crit'};
var CONFIG = {}, CACHE = {}, EXTRA = null;
var ST = { modelo: 'coletiva', mes: null, gd: null, data: hoje(), meses: [], distritos: [], d: null, slides: [], i: 0, lanc: [], previa: null, edit: null };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hoje(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function dataBr(iso){ var x = String(iso || '').split('-'); return x.length === 3 ? x[2] + '/' + x[1] + '/' + x[0] : ''; }
function num(v){ var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; }
function p1(v){ return v === null ? '—' : v.toFixed(1).replace('.', ',') + '%'; }
function brl(v){ return v === null ? '—' : 'R$ ' + Math.round(v).toLocaleString('pt-BR'); }
function cls(v, ok, warn){ return v === null ? 'na' : (v >= (ok || 100) ? 'ok' : (v >= (warn || 80) ? 'warn' : 'crit')); }
function barra(v, c){ return '<span class="p ' + c + '">' + p1(v) + '</span><span class="bar"><i class="' + c + '" style="width:' + Math.max(0, Math.min(100, v || 0)) + '%"></i></span>'; }
function norm(s){ return String(s || '').toUpperCase().trim().replace(/\s+/g, ' '); }
function med(m){ return norm(m).replace('Ç','C').replace('Ã','A').replace('Í','I'); }
function marcas(linha, mes){ var out = []; (MARCAS_CHAVE[linha] || []).forEach(function(x){ if (MESES.indexOf(x.desde) <= MESES.indexOf(mes)) out = x.m; }); return out; }
function mesAnt(m){ var i = MESES.indexOf(m); return i > 0 ? MESES[i - 1] : null; }

async function fetchAba(aba, semCache, tent){
  if (!semCache && CACHE[aba]) return CACHE[aba];
  tent = tent || 0;
  var res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.spreadsheet_id + '/values/' + encodeURIComponent(aba) + '?key=' + CONFIG.api_key, {cache:'no-store'});
  if (res.status === 429 && tent < 6){ await new Promise(function(r){ setTimeout(r, 600 * Math.pow(1.8, tent)); }); return fetchAba(aba, semCache, tent + 1); }
  if (!res.ok){ if (res.status === 400) CACHE[aba] = []; return []; }
  var rows = (await res.json()).values || [];
  if (rows.length < 2) return (CACHE[aba] = []);
  var h = rows[0];
  return (CACHE[aba] = rows.slice(1).map(function(r){ var o = {}; h.forEach(function(k, i){ o[k] = r[i] !== undefined ? r[i] : ''; }); return o; }));
}

// Snapshots de frequência e sobreposição + meses com PEX simulado: ficam no index.html
async function carregarExtra(){
  if (EXTRA) return EXTRA;
  EXTRA = { freq: {}, sobrep: {}, pexSim: [] };
  try {
    var txt = await (await fetch('index.html?t=' + Date.now(), {cache:'no-store'})).text();
    function bloco(nome){ var a = txt.indexOf('var ' + nome + ' = {'); if (a < 0) return ''; return txt.substring(a, txt.indexOf('};', a)); }
    function pares(b){ var o = {}, re = /([A-Z]{3}):\s*`([^`]*)`/g, m; while ((m = re.exec(b))) o[m[1]] = m[2].trim().split(/\r?\n/); return o; }
    EXTRA.freq = pares(bloco('FREQ_SETORES_RAW'));
    EXTRA.sobrep = pares(bloco('SOBREP_REPS_RAW'));
    var np = bloco('NOTAS_PEX_POR_MES'), re2 = /'([A-Z]{3})'\s*:/g, m2; while ((m2 = re2.exec(np))) EXTRA.pexSim.push(m2[1]);
  } catch(e){ console.warn('Frequência/sobreposição indisponíveis.', e.message); }
  return EXTRA;
}

async function carregarDistrito(d, m){ // dados de um distrito no mês, cada fonte no último mês que tem resultado
  var L = d.linha;
  function doD(arr){ return (arr || []).filter(function(x){ return x.distrito_id === d.distrito_id; }); }
  function temD(rows){ return doD(rows).length > 0; }
  // em série, por causa da cota do Sheets
  var uR = await ultimaAba(function(x){ return 'reps_' + x; }, m, function(rows){ return doD(rows).some(function(x){ return num(x.prod) !== null; }); });
  var uP = await ultimaAba(function(x){ return 'produtos_rep_' + L + '_' + x; }, m, temD);
  var uX = await ultimaAba(function(x){ return 'pex_' + x; }, m, temD);
  var ref = { reps: uR.mes, prod: uP.mes, pex: uX.mes, freq: m, sob: m }, aR = mesAnt(ref.reps), aX = mesAnt(ref.pex);
  var pd = await fetchAba('produtos_dist_' + L + '_' + ref.prod), jor = await fetchAba('jornada');
  var dRef = ref.reps === m ? d : (doD(await fetchAba('distritos_' + ref.reps))[0] || d);
  var distAnt = aR ? doD(await fetchAba('distritos_' + aR))[0] || null : null, pexAnt = aX ? doD(await fetchAba('pex_' + aX)) : [];
  await carregarExtra();
  var pref = d.distrito_id.substring(0, 6);
  [['freq', EXTRA.freq], ['sob', EXTRA.sobrep]].forEach(function(par){ // frequência e sobreposição têm snapshots em meses diferentes
    for (var mf = m, nf = 0; mf && nf < 6; mf = mesAnt(mf), nf++){ if ((par[1][mf] || []).some(function(l){ return l.substring(0, 6) === pref; })){ ref[par[0]] = mf; break; } } });
  var dist = {}; Object.keys(d).forEach(function(k){ dist[k] = d[k]; }); dist.prod = dRef.prod;
  var o = { dist: dist, ref: ref, antReps: aR, antPex: aX, reps: doD(uR.rows).filter(function(x){ return x.vago !== 'True'; }), pd: doD(pd), pr: doD(uP.rows), pex: doD(uX.rows), pexAnt: pexAnt, jor: jor,
           distAnt: distAnt, histD: [] };
  // evolução do distrito: os três meses até o escolhido, cada um com o dado do próprio mês
  var ms = [mesAnt(mesAnt(m) || ''), mesAnt(m), m].filter(Boolean);
  for (var i = 0; i < ms.length; i++) o.histD.push({ mes: ms[i], dist: doD(await fetchAba('distritos_' + ms[i]))[0] || null, pd: doD(await fetchAba('produtos_dist_' + L + '_' + ms[i])) });
  return o;
}

// ── último resultado disponível ──
// Os resultados não chegam junto com o mês (produto atrasa pelo menos 10 dias).
// Quando o mês escolhido ainda não tem um indicador, o deck mostra o último mês
// que tem e avisa de qual mês é o dado. ST.d.ref guarda o mês efetivo de cada
// fonte: reps (MDV, Q1–Q4, painel), prod (cota/realizado), pex e freq (snapshots).
async function ultimaAba(nomeDe, mes, tem){
  for (var m = mes, n = 0; m && n < 6; m = mesAnt(m), n++){ var rows = await fetchAba(nomeDe(m)); if (tem(rows)) return { mes: m, rows: rows }; }
  return { mes: mes, rows: [] };
}
async function distritosDe(mes){ return (await ultimaAba(function(m){ return 'distritos_' + m; }, mes, function(r){ return r.length > 0; })).rows; }
var FONTE_NOME = { reps: 'Produtividade e coberturas (MDV, Q1 a Q4 e painel)', prod: 'Produtos (cota e realizado)', pex: 'PEX', freq: 'Frequência de visitação', sob: 'Sobreposição' };
function fontesDe(nome){
  if (nome === 'Fechamento do mês') return ST.modelo === 'individual' ? ['reps', 'prod', 'pex', 'freq', 'sob'] : ['reps', 'prod', 'pex'];
  if (nome === 'Marcas-chave' || nome === 'Demais produtos' || nome === 'Prioridades do mês' || /^Marca-chave — /.test(nome)) return ['prod'];
  if (nome === 'Produtividade') return ['reps'];
  if (nome === 'Frequência e sobreposição') return ['freq', 'sob'];
  if (nome === 'Jornada e PEX') return ['pex', 'reps'];
  if (nome === 'Fundamentos') return ['reps', 'freq', 'sob', 'pex'];
  return [];
}
function defasadas(fs){ var ref = (ST.d && ST.d.ref) || {}; return fs.filter(function(f){ return ref[f] && ref[f] !== ST.mes; }); }
function avisoRef(nome){

  return '<div class="aviso">⚠️ Ainda sem resultado de ' + ST.mes + '/2026 — exibindo o último disponível: ' + d.map(function(f){ return '<b>' + FONTE_NOME[f] + ': ' + ref[f] + '/2026</b>'; }).join(' · ') + '.</div>';

function resumoRef(){ var ref = ST.d.ref, d = defasadas(['reps', 'prod', 'pex', 'freq', 'sob']); return d.length ? ' · último resultado disponível — ' + d.map(function(f){ return (f === 'reps' ? 'produtividade' : (f === 'prod' ? 'produtos' : (f === 'pex' ? 'PEX' : (f === 'freq' ? 'frequência' : 'sobreposição')))) + ': ' + ref[f]; }).join(', ') : ''; }

// ── números derivados ──
function prodDist(d){ var p = num(d.prod); return p !== null && p < 5 ? p * 100 : p; }
function coberturaMarcas(){ // por rep: cobertura em cada marca-chave e gap em R$ das que estão abaixo de 100%
  var D = ST.d, ch = marcas(D.dist.linha, ST.mes), reps = {};
  D.pr.forEach(function(r){
    var mk = norm(r.produto); if (ch.indexOf(mk) < 0) return;
    var c = num(r.cota), re = num(r.realizado), o = (reps[r.setor_id] = reps[r.setor_id] || { setor: r.setor_id, nome: r.nome, m: {}, cota: 0, real: 0, gap: 0, abaixo: [] });
    var cob = c ? re / c * 100 : null;
    o.m[mk] = { cob: cob, cota: c, real: re };
    o.cota += c || 0; o.real += re || 0;
    if (cob !== null && cob < 100){ o.gap += c - re; o.abaixo.push({ m: mk, cob: cob, falta: c - re }); }
  });
  return { marcas: ch, reps: Object.keys(reps).map(function(k){ var o = reps[k]; o.cob = o.cota ? o.real / o.cota * 100 : null; return o; }) };
}

// uma nova medição (campo "medicoes", uma por data de RPS). O Histórico do

// acompanhados no plano de Fundamentos são os marcados em "Indicador que

// primeira vez em que são abertos.

async function gravarLinha(reg, obj){ // regrava o JSON de uma linha existente (status de ação ou de combinado)

      produto: reg.produto, crm: reg.crm, medico: reg.medico, valor: 0, acao_lancamento: JSON.stringify(obj), data: reg.data, criadoEm: reg.criadoEm }) });

function histExigidos(){
  var out = {}, guarda = ST.setor;
  ST.d.reps.forEach(function(r){ ST.setor = r.setor_id; var ex = [];
    if (fundamentosRep().some(function(i){ return i.desvio; })) ex.push(['fund', 'Fundamentos']);

    h += '<div class="kpis"><div class="kpi"><div class="l">Representantes com plano</div><div class="v">' + repsCom + ' de ' + nReps + '</div><div class="s">em ' + ST.mes + '/2026</div></div>' +

    if (semBase.length && pode){ HIST.tentou = HIST.tentou || {}; var novos = semBase.filter(function(x){ return !HIST.tentou[x.l.id]; });
      if (novos.length){ novos.forEach(function(x){ HIST.tentou[x.l.id] = 1; }); setTimeout(async function(){ var a1 = ST.gd, a2 = ST.d, a3 = ST.setor, gravou = false;
        for (var i = 0; i < novos.length; i++){ ST.gd = novos[i].gd; ST.d = HIST.dist[ST.gd]; ST.setor = novos[i].setor; if (await planoAcompanhar(novos[i].ch, novos[i].p, novos[i].l, null)) gravou = true; }

    h += nAc ? '<div class="card"><h3>Ações <small>marque o status conforme a execução</small></h3><table><thead><tr>' + thGd + '<th>Representante</th><th>Plano</th><th style="text-align:left">Causa raiz</th><th style="text-align:left">O quê</th><th>Quem</th><th>Quando</th><th>Status</th></tr></thead><tbody>' + acoes + '</tbody></table></div>'

// ── montagem e navegação ──
function montar(){
  var D = ST.d.dist;
  var lista = [{ nome: 'Combinados anteriores', msg: ' ', html: '<div id="ata"></div>' }, sFechamento(), sMarcas(), sProd(), sEvolucao(), sFreqSobrep(), sJornadaPex(), demaisSlide(ST.d.pd, 'distrito')]
    .concat(TEMAS.map(sTitulo), [sPrioridades(), { nome: 'Ata desta reunião', msg: ' ', html: '<div id="ata-nova"></div>' }]); // mesma sequência da individual; só o bloco final muda
  var h = '<div class="slide">' + sCapa(lista) + '</div>';
  lista.forEach(function(s){ h += slideHtml(s); });
  $('stage').innerHTML = h;
  ST.slides = [].slice.call(document.querySelectorAll('.slide'));
  $('ctx').textContent = 'RPS coletiva · ' + D.nm + ' · ' + ST.mes + '/2026 · ' + dataBr(ST.data);
  $('b-trocar').style.display = ''; $('b-rep').style.display = 'none';
  $('dots').innerHTML = ST.slides.map(function(s, k){ return '<button onclick="ir(' + k + ')" title="' + (k ? lista[k - 1].nome : 'Abertura') + '">' + (k + 1) + '</button>'; }).join('');
  desenharAta(); ir(0);
}
function ir(i){
  if (!ST.slides.length) return;
  ST.i = Math.max(0, Math.min(ST.slides.length - 1, i));
  ST.slides.forEach(function(s, k){ s.classList.toggle('on', k === ST.i); });
  [].forEach.call($('dots').children, function(b, k){ b.classList.toggle('on', k === ST.i); });
  $('cnt').textContent = (ST.i + 1) + ' / ' + ST.slides.length;
  $('b-prev').disabled = ST.i === 0; $('b-next').disabled = ST.i === ST.slides.length - 1;
  ajustar();
}
// sem rolagem: ajusta a escala do slide ativo (45% a 135%) para o conteúdo ocupar a tela
function ajustar(){
  var s = ST.slides[ST.i], b = s && s.querySelector('.body'), f = b && b.querySelector('.fit'); if (!f) return;
  var cs = getComputedStyle(b), W = b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), H = b.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom), z = 1;
  function ap(v){ z = v; f.style.zoom = v; f.style.width = (W / v) + 'px'; if (f.querySelector('.titulo-so')) f.style.height = (H / v) + 'px'; }
  ap(1);
  if (f.querySelector('.titulo-so')) return;
  for (var k = 0; k < 8; k++){ var h = f.getBoundingClientRect().height, alvo = Math.max(0.45, Math.min(1.35, z * H / h * 0.985)); if (Math.abs(alvo - z) < 0.01) break; ap(alvo); }
  if (f.getBoundingClientRect().height > H + 1 && z > 0.45) ap(Math.max(0.45, z * 0.97));
}
$('b-prev').onclick = function(){ ir(ST.i - 1); }; $('b-next').onclick = function(){ ir(ST.i + 1); }; $('b-trocar').onclick = telaEntrada;
document.addEventListener('keydown', function(e){
  if (!ST.slides.length || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); ir(ST.i + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); ir(ST.i - 1); }
  else if (e.key === 'Home') ir(0); else if (e.key === 'End') ir(ST.slides.length - 1);
});
window.addEventListener('resize', function(){ if (ST.slides.length) ajustar(); });

(async function(){
  try {
    var res = await fetch('config.json?t=' + Date.now(), {cache:'no-store'}); if (!res.ok) throw new Error('config.json não encontrado.');
    CONFIG = await res.json();
    var cfg = await fetchAba('config'), padrao = null;
    cfg.forEach(function(r){ if (r.chave === 'meses_disponiveis') ST.meses = r.valor.split(',').map(function(s){ return s.trim(); }); if (r.chave === 'mes_padrao') padrao = r.valor; });
    if (!ST.meses.length) ST.meses = MESES.slice(0, 9);
    ST.mes = padrao && ST.meses.indexOf(padrao) >= 0 ? padrao : ST.meses[ST.meses.length - 1];
    ST.distritos = await distritosDe(ST.mes);
    ST.gd = ST.distritos.length ? ST.distritos[0].distrito_id : null;
    telaEntrada();
  } catch(e){ $('stage').innerHTML = '<div class="slide on"><div class="capa"><h2>Erro ao carregar</h2><div class="m">' + esc(e.message) + '</div></div></div>'; }
})();
