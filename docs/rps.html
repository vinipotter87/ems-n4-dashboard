<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMS | Copiloto de RPS</title>
<style>
:root{--red:#C8102E;--orange:#E87722;--gray:#6B7280;--light:#F3F4F6;--border:#E5E7EB;--brand:#0057B8;--brand-d:#003D82;--text:#111827}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:#0b1f3f;color:var(--text);font-size:13px;overflow:hidden}
button,select,input,textarea{font-family:inherit}
.top{height:48px;background:var(--brand-d);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;font-size:14px;font-weight:700}
.logo{background:#fff;color:var(--brand);font-weight:900;font-size:14px;padding:3px 9px;border-radius:6px}
.sp{flex:1}
.btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover:not(:disabled){background:rgba(255,255,255,.25)}.btn:disabled{opacity:.35;cursor:default}
.stage{height:calc(100% - 48px - 46px);padding:12px 18px 6px}
.slide{display:none;height:100%;background:#ECEDF0;border-radius:14px;overflow:hidden;flex-direction:column}
.slide.on{display:flex}
.hdr{flex:none;display:flex;align-items:baseline;gap:16px;background:#fff;padding:12px 24px;border-bottom:3px solid var(--brand)}
.hdr h2{font-size:20px;font-weight:800;color:var(--brand-d);white-space:nowrap}
.hdr span{font-size:14px;font-weight:600;color:var(--gray)}
.body{flex:1;min-height:0;overflow:hidden;padding:14px 22px}
.nav{height:46px;display:flex;align-items:center;gap:8px;padding:0 18px;color:#fff}
.dots{flex:1;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.dots button{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:7px;min-width:30px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer}
.dots button.on{background:#fff;color:var(--brand-d)}
#cnt{font-size:12px;font-weight:700;opacity:.8;min-width:54px;text-align:right}
/* capa e entrada */
.capa{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 60px;background:linear-gradient(135deg,var(--brand-d),var(--brand));color:#fff;overflow:auto}
.capa .k{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;opacity:.8}
.capa h2{font-size:42px;font-weight:900;line-height:1.1;margin:8px 0 10px}
.capa .m{font-size:15px;opacity:.9}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:24px}
.grade-t{grid-column:1/-1;font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;opacity:.75;margin-top:8px;cursor:pointer}
.grade button{display:flex;align-items:center;gap:10px;text-align:left;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
.grade button:hover{background:rgba(255,255,255,.24)}
.grade b{background:#fff;color:var(--brand-d);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:900}
.modelos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:22px 0 18px;max-width:1080px}
.modelo{background:rgba(255,255,255,.1);border:2px solid transparent;border-radius:14px;padding:18px 20px;color:#fff;text-align:left;cursor:pointer}
.modelo.on{border-color:#fff;background:rgba(255,255,255,.2)}
.modelo:disabled{opacity:.45;cursor:default}
.modelo b{display:block;font-size:19px;margin-bottom:4px}
.modelo span{font-size:12.5px;opacity:.9;line-height:1.45}
.form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;max-width:900px}
.form label{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;opacity:.8;margin-bottom:4px}
.form select,.form input{border:none;border-radius:8px;padding:9px 12px;font-size:14px;min-width:150px}
.form .ir{background:#fff;color:var(--brand-d);border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:800;cursor:pointer}
/* tela de entrada (Copiloto de RPS) */
.capa.ent{position:relative;padding:40px 64px;background:radial-gradient(900px 520px at 78% 8%,#1f6fe0 0%,rgba(31,111,224,0) 62%),radial-gradient(700px 480px at 4% 100%,#0b5bd6 0%,rgba(11,91,214,0) 60%),linear-gradient(135deg,#031a52 0%,#062a7a 45%,#0a3fb0 100%)}
.capa.ent>*{position:relative;z-index:1}
.capa.ent .deco{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.capa.ent .k{font-size:15px;font-weight:600;letter-spacing:5px;opacity:.9}
.capa.ent .k:after{content:'';display:block;width:128px;height:3px;border-radius:3px;margin-top:12px;background:linear-gradient(90deg,#22b8ff,rgba(34,184,255,.15))}
.capa.ent h2{font-size:clamp(40px,5.4vw,74px);font-weight:900;letter-spacing:.5px;text-transform:uppercase;margin:16px 0 12px;text-shadow:0 6px 24px rgba(0,10,60,.45)}
.capa.ent h2 span{background:linear-gradient(90deg,#1f8fff,#38c6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.capa.ent .m{font-size:clamp(14px,1.45vw,19px);opacity:.95}
.capa.ent .modelos{gap:22px;margin:30px 0 34px;max-width:1200px}
.capa.ent .modelo{display:grid;grid-template-columns:66px 1fr;column-gap:18px;row-gap:14px;align-items:center;align-content:start;background:rgba(18,72,170,.42);border:1.5px solid rgba(120,180,255,.28);border-radius:20px;padding:24px 26px;min-height:190px;backdrop-filter:blur(6px);transition:background .15s,border-color .15s,box-shadow .15s}
.capa.ent .modelo:hover{background:rgba(30,100,215,.5);border-color:rgba(120,200,255,.6)}
.capa.ent .modelo.on{background:linear-gradient(160deg,rgba(30,110,235,.85),rgba(12,70,190,.8));border-color:#5cc8ff;box-shadow:0 0 0 1px rgba(92,200,255,.6),0 0 28px rgba(60,170,255,.55)}
.capa.ent .modelo i{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#2b8cff,#0f5fe0);box-shadow:0 6px 18px rgba(0,30,110,.4)}
.capa.ent .modelo i svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.capa.ent .modelo b{font-size:clamp(19px,1.9vw,25px);margin:0}
.capa.ent .modelo span{grid-column:1/-1;font-size:clamp(12.5px,1.15vw,15.5px);line-height:1.5;opacity:.95}
.capa.ent .form{gap:20px;max-width:1200px;flex-wrap:nowrap}
.capa.ent .form>div:first-child{flex:2.3;min-width:0}.capa.ent .form>div{flex:1;min-width:0}
.capa.ent .form label{font-size:12px;letter-spacing:.8px;opacity:.9;margin-bottom:7px}
.capa.ent .form select,.capa.ent .form input{width:100%;min-width:0;height:52px;border-radius:10px;padding:0 16px;font-size:16px;color:#0b1f3f;background:#fff;box-shadow:0 6px 18px rgba(0,20,90,.3)}
.capa.ent .form .ir{flex:1.55;height:60px;border-radius:14px;padding:0 20px;font-size:clamp(15px,1.45vw,19px);font-weight:800;color:#04246b;white-space:nowrap;background:linear-gradient(180deg,#5fd0ff,#2aa5ff);border:1.5px solid #9be2ff;box-shadow:0 0 26px rgba(60,180,255,.6)}
.capa.ent .form .ir:hover{filter:brightness(1.07)}
@media(max-height:760px){.capa.ent{padding:3.5vh 48px}.capa.ent h2{font-size:clamp(30px,8.5vh,60px);margin:1.6vh 0 1.2vh}.capa.ent .k{font-size:12px}.capa.ent .k:after{margin-top:7px}.capa.ent .modelos{margin:3vh 0 3.2vh;gap:16px}
  .capa.ent .modelo{min-height:0;padding:2.4vh 20px;grid-template-columns:48px 1fr;column-gap:14px;row-gap:1.4vh}.capa.ent .modelo i{width:48px;height:48px}.capa.ent .modelo i svg{width:24px;height:24px}
  .capa.ent .form select,.capa.ent .form input{height:44px;font-size:14.5px}.capa.ent .form .ir{height:48px}.capa.ent .form label{margin-bottom:4px}}
@media(max-width:900px){.capa.ent{padding:26px 22px;justify-content:flex-start}.capa.ent .modelos{grid-template-columns:1fr}.capa.ent .modelo{min-height:0}.capa.ent .form{flex-wrap:wrap}.capa.ent .form>div,.capa.ent .form .ir{flex:1 1 100%}}
/* slide de tema ainda sem conteúdo */
.constr{height:100%;min-height:36vh;display:flex;align-items:center;justify-content:center}
.constr span{display:block;width:100%;text-align:center;padding:14px 0;font-size:clamp(20px,2.3vw,30px);font-weight:900;letter-spacing:6px;text-transform:uppercase;color:#1f2937;background:repeating-linear-gradient(-45deg,#facc15 0 28px,#fde047 28px 56px);border-top:6px solid #1f2937;border-bottom:6px solid #1f2937;transform:rotate(-4deg);box-shadow:0 10px 28px rgba(0,0,0,.18)}
/* peças */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:12px;border-top:4px solid var(--brand);padding:10px 14px}
.kpi.ok{border-top-color:#22c55e}.kpi.warn{border-top-color:#f59e0b}.kpi.crit{border-top-color:#ef4444}
.kpi .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}
.kpi .v{font-size:24px;font-weight:800;line-height:1.2}.kpi .s{font-size:11.5px;color:var(--gray)}
.card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--brand-d);margin-bottom:8px}
.card h3 small{font-weight:600;text-transform:none;letter-spacing:0;color:var(--gray);margin-left:6px}
table{width:100%;border-collapse:collapse}
th{background:#f1f5f9;color:#334155;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:7px 9px;text-align:center;font-weight:800}
td{padding:6px 9px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle}
th:first-child,td:first-child{text-align:left}
td.n{font-weight:700;text-align:left}
tr.tot td{background:#f3f4f6;font-weight:800}
.p{font-weight:800}.p.ok{color:#15803d}.p.warn{color:#b45309}.p.crit{color:#b91c1c}
.cel{display:inline-block;min-width:58px;padding:2px 7px;border-radius:6px;font-weight:700}
.cel.ok{background:#dcfce7;color:#166534}.cel.warn{background:#fef3c7;color:#92400e}.cel.crit{background:#fee2e2;color:#991b1b}.cel.na{background:#f3f4f6;color:#9ca3af}
.bar{display:inline-block;width:70px;height:7px;background:#e5e7eb;border-radius:4px;overflow:hidden;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%}.bar i.ok{background:#22c55e}.bar i.warn{background:#f59e0b}.bar i.crit{background:#ef4444}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap}
.tag.OURO{background:#fef3c7;color:#92400e}.tag.PRATA{background:#e5e7eb;color:#374151}.tag.BRONZE{background:#fde5d0;color:#9a3412}.tag.ATENCAO{background:#fef9c3;color:#854d0e}.tag.CRITICO{background:#fee2e2;color:#991b1b}
.tag.Destaque{background:#dcfce7;color:#166534}.tag.Performance{background:#ffedd5;color:#9a3412}.tag.Start{background:#fee2e2;color:#991b1b}
.tag.foco{background:var(--brand);color:#fff}
.mk-tarjas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mk-tarja{font-size:11px;font-weight:800;letter-spacing:.3px;color:#1e3a8a;background:#eff4ff;border:1px solid #c7d7fe;padding:3px 12px;border-radius:6px;white-space:nowrap}
.mk-tarja.atraso{color:#fff;background:#b45309;border-color:#b45309}
.mk-wrap{overflow-x:auto}
.cp-tbl th,.cp-tbl td{white-space:nowrap;text-align:center}.cp-tbl th:first-child,.cp-tbl td:first-child{text-align:left}
.cp-tbl th.cp-ch{background:#fef3c7;color:#78350f}.cp-tbl td.cp-ch{background:#fffdf5}
.cp-tbl tr.cp-dist td{border-top:2px solid #dbe3f5;font-weight:800;background:#f8fafc}
.mkt td,.mkt th{white-space:nowrap;padding:8px 6px}
.mkt td{font-size:14px;text-align:right}
.mkt th{font-size:9.5px;line-height:1.2;text-align:right}
.mkt td.n,.mkt th:first-child{text-align:left}
.mkt td.mk-esq,.mkt.mkd th:nth-last-child(3){text-align:left}
.mkt.mkd td{vertical-align:top}
.mkt th.mk-grp{text-align:center;background:#fef3c7;color:#78350f;font-size:11px;border-left:2px solid #f3d98b}
.mkt td.mk-g1,.mkt th.mk-g1{border-left:2px solid #f3d98b}
.mkt .cel{min-width:0}
.mkt tr.mk-ref td{background:#f1f4fb;font-weight:700}
.mkt tr.mk-ref:first-of-type td{border-top:2px solid #dbe3f5}
.mkt td.mk-top{background:#fef3c7;font-weight:800;color:#78350f}
.mkt td.mk-vazio{color:#cbd5e1}
.mkt.mk3 td{font-size:16px;padding:12px 8px}.mkt.mk3 th{font-size:10.5px}
.mkt th.mk-rxc{color:#0f766e;background:#e6f6f4}.mkt td.mk-rxc{background:#f3fbfa}
tr.ip-ch td{background:#fffdf5}tr.ip-ch td.n{font-weight:800;color:#78350f}
.mk-rank{display:inline-block;font-size:9px;font-weight:800;color:#fff;background:#b45309;border-radius:8px;padding:0 5px;margin-right:4px;vertical-align:1px}
.mk-rank.p1{background:#15693A}.mk-rank.p2{background:#2563eb}.mk-rank.p3{background:#b45309}.mk-rank.p4{background:#6B7280}
.mk-reg{display:block;font-size:10px;color:var(--gray);font-weight:500;margin-top:1px;white-space:nowrap}
.mk-pen{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap}
.mk-pen.up{background:#dcfce7;color:#166534}.mk-pen.down{background:#fee2e2;color:#991b1b}.mk-pen.flat{background:#f3f4f6;color:#6b7280}
.mk-seta{font-style:normal;font-size:9px;margin-left:2px;color:#9ca3af}.mk-seta.up{color:#15693A}.mk-seta.down{color:#C8102E}
.mk-up{color:#15693A}.mk-dn{color:#C8102E}
.mk-gpos{color:#9C6D00}.mk-gneg{color:#2563eb}
.mk-grafs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:6px}
.mk-graf{border:1px solid var(--border);border-radius:10px;padding:8px 10px 4px}
.mk-graf-t{font-size:12px;font-weight:800;color:#78350f}
.mk-svg{width:100%;height:auto;display:block}
.mk-eixo{font-size:9.5px;fill:#6b7280}.mk-eixo.atual{font-weight:800;fill:#111827}
.mk-val{font-size:10.5px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:3px}.mk-val.ref{font-weight:600;font-size:9.5px}
.mk-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--gray);margin-top:8px}
.mk-leg span{display:flex;align-items:center;gap:5px}.mk-leg i{width:16px;height:3px;border-radius:2px;display:inline-block}
.mkc-grid{display:grid;grid-template-columns:repeat(var(--n,3),minmax(410px,1fr));gap:12px}
.mkc-card{border:1px solid var(--border);border-radius:12px;background:#fff;padding:12px}
.mkc-hdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.mkc-marca{font-size:14px;font-weight:800;color:#78350f}
.mkc-meta{font-size:11px;color:var(--gray);margin-left:auto}.mkc-meta b{color:#111827}
.mkc-insight{font-size:12px;line-height:1.55;background:#f8fafc;border-left:3px solid #1e3a8a;border-radius:4px;padding:6px 10px;margin-bottom:8px}
.mkc-tbl{width:100%;border-collapse:collapse;font-size:12px}
.mkc-tbl th{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);text-align:right;padding:4px;border-bottom:1px solid #e5e7eb;white-space:nowrap;background:none}
.mkc-tbl td{padding:5px 4px;border-bottom:1px solid #f3f4f6;text-align:right;white-space:nowrap}
.mkc-tbl th:nth-child(1),.mkc-tbl td:nth-child(1){text-align:left;width:1%;padding-right:0}
.mkc-tbl th:nth-child(2),.mkc-tbl td:nth-child(2){text-align:left}
.mkc-tbl tr.nossa td{background:#fffbeb;font-weight:700}
.mkc-tbl tr.mkc-resto td{color:var(--gray);font-size:11.5px;border-bottom:0}
.mkc-lab{font-size:10px;color:var(--gray);font-weight:500;margin-left:5px}
.mkc-bar{height:4px;border-radius:2px;background:#cbd5e1;margin:2px 0 0 auto}
.mkc-tbl tr.nossa .mkc-bar{background:#0d9488}
.mkc-ref{color:var(--gray)}
.mkc-pos{color:#15693A;font-weight:700}.mkc-neg{color:#C8102E;font-weight:700}
.mkc-sub{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#1e3a8a;margin:10px 0 2px;padding-top:6px;border-top:1px dashed #e5e7eb}
.mkc-insight + .mkc-sub{border-top:0;padding-top:0;margin-top:4px}
.mkc-bloco{border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px 6px;margin-top:10px}
.mkc-bloco.rx{border-top:4px solid #0d9488;background:#f6fcfb}.mkc-bloco.ms{border-top:4px solid #2563eb;background:#f7f9ff}
.mkc-bloco-t{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.mkc-bloco-t small{font-weight:600;letter-spacing:.2px;text-transform:none;color:#6b7280;margin-left:6px}
.mkc-bloco.rx .mkc-bloco-t{color:#0f766e}.mkc-bloco.ms .mkc-bloco-t{color:#1d4ed8}
.mkc-bloco .mkc-insight{background:#fff}
.mkc-bloco.rx .mkc-insight{border-left-color:#0d9488}.mkc-bloco.ms .mkc-insight{border-left-color:#2563eb}
.mkc-bloco.ms .mkc-tbl tr.nossa .mkc-bar{background:#2563eb}
.mkc-tipo{font-size:10px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;padding:2px 9px;border-radius:10px;color:#fff;white-space:nowrap}
.mkc-tipo.rx{background:#0d9488}.mkc-tipo.ms{background:#2563eb}
.mkc-par .mkc-graf{max-width:560px}
.mkc-graf{max-width:430px;margin:8px auto 0}
.mk-nota-top{font-size:11.5px;color:#5b4300;background:#fffbeb;border:1px solid #f3d98b;border-radius:8px;padding:8px 12px;margin-top:10px;line-height:1.6}
.nota{font-size:11px;color:var(--gray);line-height:1.5;margin-top:8px}
.aviso{background:#fef9c3;color:#854d0e;font-size:12px;font-weight:700;padding:7px 12px;border-radius:8px;margin-bottom:10px}
.titulo-so{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%}
.titulo-so h2{font-size:46px;font-weight:900;color:var(--brand-d)}
.titulo-so p{font-size:14px;color:var(--gray);margin-top:10px}
/* fundamentos e planos (individual) */
.fund{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.fc{background:#fff;border:1px solid var(--border);border-top:4px solid #22c55e;border-radius:10px;padding:9px 12px}
.fc.desvio{border-top-color:#ef4444;background:#fff7f7}.fc.sem{border-top-color:#d1d5db}
.fc .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}.fc .v{font-size:20px;font-weight:800;line-height:1.2}.fc .s{font-size:10.5px;color:var(--gray)}
.fc .t{font-size:10.5px;font-weight:800;margin-top:3px;color:#15803d}.fc.desvio .t{color:#b91c1c}.fc.sem .t{color:#9ca3af}
.pok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;border-radius:10px;padding:16px 18px;font-size:14px;font-weight:700}
.plano{background:#fff;border:1px solid var(--border);border-left:5px solid var(--brand);border-radius:10px;padding:12px 16px}
.ph{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;color:var(--brand-d);margin-bottom:8px}.ph span{font-size:11px;font-weight:600;color:var(--gray)}
.pl{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);margin:9px 0 4px}.pl small{font-weight:600;text-transform:none;letter-spacing:0}

<script>
// ── RPS — apresentação do GD com o time ──────────────────────────
// Página isolada: escolhe o modelo (coletiva ou individual), o GD, o mês e a
// data da reunião. A INDIVIDUAL abre um representante (ver bloco próprio abaixo).
// A COLETIVA é montada por GD com os mesmos dados do
// dashboard da regional (abas do Sheets) — só SPI. Frequência e sobreposição
// são snapshots guardados dentro do index.html; esta página lê de lá para
// não duplicar. Os combinados anteriores vêm da ata da RPS anterior em PDF
// (tabela "Plano de ação consolidado"), lida no navegador e gravada no Sheets
// pelo Apps Script do Budget: 1 linha em budget_lancamentos com produto
// RPS_ATA, gd "N4:<distrito_id>" (as páginas de Budget ignoram) e
// crm "rps|<data da reunião>".
var MESES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
var MARCAS_CHAVE = {
  NEXUS: [{desde:'JAN', m:['BRAMICAR','BRAMICAR HCT','OLIRE','LYBERDIA']}, {desde:'JUL', m:['CONCARDIO','LYBERDIA','OZIVY']}],
  VITAL: [{desde:'JAN', m:['BRASART HCT','BRASART BCC','LINADIB','LINADIB DUO','BUPIUM XL']}, {desde:'JUL', m:['OZIVY','LINADIB','LINADIB DUO','BUPIUM XL']}]
};
var STATUS = ['Pendente', 'Em andamento', 'Resolvido', 'Não executado'], COR = {'Pendente':'warn','Em andamento':'warn','Resolvido':'ok','Não executado':'crit'};
var CONFIG = {}, CACHE = {}, EXTRA = null;
// A mesma página serve às duas regionais: rps.html (SPI Oeste) e rps.html?regional=LESTE (Leste).
// Na Leste as abas do Sheets levam o sufixo da regional (reps_LESTE_JUL, produtos_rep_NEXUS_LESTE_JUL,
// jornada_LESTE, config_LESTE…); atas e planos ficam na mesma aba budget_lancamentos, separados pelo id do distrito.
var REG = /[?&]regional=leste(&|$)/i.test(window.location.search) ? 'LESTE' : 'SPI';
var REG_NOME = REG === 'LESTE' ? 'Regional Leste' : 'Regional SPI Oeste', REG_PAG = REG === 'LESTE' ? 'leste.html' : 'index.html';
function abaReg(aba){
  if (REG !== 'LESTE') return aba;
  var m;
  if ((m = /^(distritos|reps|pex|crm)_([A-Z]{3})$/.exec(aba))) return m[1] + '_LESTE_' + m[2];
  if ((m = /^(produtos|produtos_dist|produtos_rep)_(NEXUS|VITAL)_([A-Z]{3})$/.exec(aba))) return m[1] + '_' + m[2] + '_LESTE_' + m[3];
  if (aba === 'jornada' || aba === 'config') return aba + '_LESTE';
  return aba;
}
var ST = { modelo: 'coletiva', mes: null, gd: null, data: hoje(), meses: [], distritos: [], d: null, slides: [], i: 0, lanc: [], previa: null, edit: null };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hoje(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function dataBr(iso){ var x = String(iso || '').split('-'); return x.length === 3 ? x[2] + '/' + x[1] + '/' + x[0] : ''; }
function num(v){ var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; }
function p1(v){ return v === null ? '—' : v.toFixed(1).replace('.', ',') + '%'; }
function brl(v){ return v === null ? '—' : 'R$ ' + Math.round(v).toLocaleString('pt-BR'); }
function cls(v, ok, warn){ return v === null ? 'na' : (v >= (ok || 100) ? 'ok' : (v >= (warn || 80) ? 'warn' : 'crit')); }
function barra(v, c){ return '<span class="p ' + c + '">' + p1(v) + '</span><span class="bar"><i class="' + c + '" style="width:' + Math.max(0, Math.min(100, v || 0)) + '%"></i></span>'; }
function norm(s){ return String(s || '').toUpperCase().trim().replace(/\s+/g, ' '); }
function med(m){ return norm(m).replace('Ç','C').replace('Ã','A').replace('Í','I'); }
function marcas(linha, mes){ var out = []; (MARCAS_CHAVE[linha] || []).forEach(function(x){ if (MESES.indexOf(x.desde) <= MESES.indexOf(mes)) out = x.m; }); return out; }
function mesAnt(m){ var i = MESES.indexOf(m); return i > 0 ? MESES[i - 1] : null; }

async function fetchAba(aba, semCache, tent){
  aba = abaReg(aba);
  if (!semCache && CACHE[aba]) return CACHE[aba];
  tent = tent || 0;
  var res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.spreadsheet_id + '/values/' + encodeURIComponent(aba) + '?key=' + CONFIG.api_key, {cache:'no-store'});
  if (res.status === 429 && tent < 6){ await new Promise(function(r){ setTimeout(r, 600 * Math.pow(1.8, tent)); }); return fetchAba(aba, semCache, tent + 1); }
  if (!res.ok){ if (res.status === 400) CACHE[aba] = []; return []; }
  var rows = (await res.json()).values || [];
  if (rows.length < 2) return (CACHE[aba] = []);
  var h = rows[0];
  return (CACHE[aba] = rows.slice(1).map(function(r){ var o = {}; h.forEach(function(k, i){ o[k] = r[i] !== undefined ? r[i] : ''; }); return o; }));
}

// Snapshots de frequência e sobreposição + meses com PEX simulado: ficam no index.html
async function carregarExtra(){
  if (EXTRA) return EXTRA;
  EXTRA = { freq: {}, sobrep: {}, pexSim: [] };
  try {
    var txt = await (await fetch(REG_PAG + '?t=' + Date.now(), {cache:'no-store'})).text();
    function bloco(nome){ var a = txt.indexOf('var ' + nome + ' = {'); if (a < 0) return ''; return txt.substring(a, txt.indexOf('};', a)); }
    function pares(b){ var o = {}, re = /([A-Z]{3}):\s*`([^`]*)`/g, m; while ((m = re.exec(b))) o[m[1]] = m[2].trim().split(/\r?\n/); return o; }
    EXTRA.freq = pares(bloco('FREQ_SETORES_RAW'));
    EXTRA.sobrep = pares(bloco('SOBREP_REPS_RAW'));
    var np = bloco('NOTAS_PEX_POR_MES'), re2 = /'([A-Z]{3})'\s*:/g, m2; while ((m2 = re2.exec(np))) EXTRA.pexSim.push(m2[1]);
  } catch(e){ console.warn('Frequência/sobreposição indisponíveis.', e.message); }
  return EXTRA;
}

// ── entrada: modelo, GD, mês e data ──
function telaEntrada(){
  ST.slides = []; ST.d = null;
  $('ctx').textContent = 'Copiloto de RPS — Reunião de Performance Semanal';
  $('b-trocar').style.display = 'none'; $('b-rep').style.display = 'none'; $('dots').innerHTML = ''; $('cnt').textContent = '';
  $('b-prev').disabled = $('b-next').disabled = true;
  $('stage').innerHTML = '<div class="slide on"><div class="capa ent"><svg class="deco" viewBox="0 0 1330 750" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B6E4FA" stop-opacity="0"/><stop offset="1" stop-color="#B6E4FA" stop-opacity=".9"/></linearGradient><pattern id="dp" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#BFE3F8" opacity=".35"/></pattern></defs><path d="M0 60 C120 10 240 -10 360 0 L0 0Z" fill="#2E4560" opacity=".35"/><path d="M-20 250 C40 120 180 30 420 -10" fill="none" stroke="#B6E4FA" stroke-opacity=".35" stroke-width="1.5"/><path d="M1330 0 C1160 90 1050 240 1040 470 C1034 600 1120 700 1330 750Z" fill="#26374F" opacity=".4"/><path d="M1010 -10 C760 120 620 300 560 520" fill="none" stroke="#B6E4FA" stroke-opacity=".28" stroke-width="1.5"/><path d="M0 600 C200 520 380 640 600 690 C820 740 1080 640 1330 700 L1330 750 L0 750Z" fill="#34506B" opacity=".35"/><path d="M0 640 C220 580 420 700 640 720 C860 740 1100 690 1330 730" fill="none" stroke="#B6E4FA" stroke-opacity=".5" stroke-width="2"/><g fill="#5787A2" opacity=".2"><rect x="1018" y="216" width="28" height="24"/><rect x="1068" y="188" width="28" height="52"/><rect x="1118" y="158" width="28" height="82"/><rect x="1168" y="126" width="30" height="114"/><rect x="1228" y="142" width="30" height="98"/></g><path d="M1010 236 C1100 232 1200 180 1285 68" fill="none" stroke="url(#dg)" stroke-width="2.5"/><circle cx="1285" cy="67" r="13" fill="#B6E4FA" opacity=".3"/><circle cx="1285" cy="67" r="7" fill="#B6E4FA"/><rect x="930" y="170" width="150" height="110" fill="url(#dp)"/><rect x="0" y="640" width="150" height="100" fill="url(#dp)"/></svg><div class="k">' + REG_NOME + '</div><h2>Copiloto <span>de RPS</span></h2>' +
    '<div class="m">Escolha o modelo da reunião, o GD, o mês de referência dos dados e a data da RPS.</div>' +
    '<div class="modelos">' +
      '<button class="modelo' + (ST.modelo === 'coletiva' ? ' on' : '') + '" onclick="ST.modelo=\'coletiva\';telaEntrada()"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="2.6"/><path d="M7.4 17.5c0-2.6 2-4.4 4.6-4.4s4.6 1.8 4.6 4.4"/><circle cx="5.2" cy="9.6" r="1.9"/><path d="M2 16.4c0-1.9 1.3-3.2 3.2-3.2"/><circle cx="18.8" cy="9.6" r="1.9"/><path d="M22 16.4c0-1.9-1.3-3.2-3.2-3.2"/></svg></i><b>Coletiva</b><span>1ª reunião do mês, com todo o time do distrito: fechamento, marcas-chave, produtividade e os setores prioritários.</span></button>' +
      '<button class="modelo' + (ST.modelo === 'individual' ? ' on' : '') + '" onclick="ST.modelo=\'individual\';telaEntrada()"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.9 3.1-6.4 7-6.4s7 2.5 7 6.4"/></svg></i><b>Individual</b><span>Demais reuniões, 30 min por representante: retrato do setor, marcas-chave em desvio e planos com 5 porquês + 5W2H.</span></button>' +
      '<button class="modelo' + (ST.modelo === 'historico' ? ' on' : '') + '" onclick="ST.modelo=\'historico\';telaEntrada()"><i><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M10 12h5M10 16h5"/></svg></i><b>Histórico do time</b><span>Consulta consolidada da regional, com filtro por GD: planos dos representantes, evolução, ações e todas as atas anexadas.</span></button>' +
    '</div><div class="form">' +
      '<div><label>GD</label><select id="e-gd">' + (ST.modelo === 'historico' ? '<option value=""' + (HIST.filtro ? '' : ' selected') + '>Todos os GDs — regional</option>' : '') + ST.distritos.map(function(d){ return '<option value="' + d.distrito_id + '"' + (d.distrito_id === (ST.modelo === 'historico' ? HIST.filtro : ST.gd) ? ' selected' : '') + '>' + esc(d.nm) + ' (' + d.linha + ')</option>'; }).join('') + '</select></div>' +
      '<div><label>Mês dos dados</label><select id="e-mes">' + ST.meses.map(function(m){ return '<option' + (m === ST.mes ? ' selected' : '') + '>' + m + '</option>'; }).join('') + '</select></div>' +
      '<div><label>Data da RPS</label><input type="date" id="e-data" value="' + ST.data + '"></div>' +
      '<button class="ir" onclick="abrir()">' + (ST.modelo === 'historico' ? 'Abrir histórico →' : 'Abrir apresentação →') + '</button>' +
    '</div></div></div>';
  $('e-mes').onchange = async function(){ ST.mes = this.value; ST.distritos = await distritosDe(ST.mes); telaEntrada(); };
}

async function abrir(){
  var esc0 = $('e-gd').value; ST.mes = $('e-mes').value; ST.data = $('e-data').value || hoje();
  $('stage').innerHTML = '<div class="slide on"><div class="capa"><h2 id="montando">Montando…</h2></div></div>';
  ST.previa = null; ST.edit = null; ST.alvo = 'ant';
  if (ST.modelo === 'historico'){ // consolidado: carrega todos os distritos; o filtro por GD fica dentro da página
    // os planos partem do último mês fechado: é com ele que o histórico é montado
    ST.mes = MES_FECHADO; ST.dF = null; HIST.filtro = esc0; HIST.dist = {}; ST.lanc = await fetchAba('budget_lancamentos', true);
    for (var k = 0; k < ST.distritos.length; k++){ $('montando').textContent = 'Carregando ' + (k + 1) + ' de ' + ST.distritos.length + ' GDs…'; HIST.dist[ST.distritos[k].distrito_id] = await carregarDistrito(ST.distritos[k], ST.mes); }
    ST.gd = esc0 || (ST.distritos[0] || {}).distrito_id; ST.d = HIST.dist[ST.gd];
    return telaHistorico();
  }
  ST.gd = esc0;
  var d = ST.distritos.filter(function(x){ return x.distrito_id === ST.gd; })[0];
  if (!d) return telaEntrada();
  ST.lanc = await fetchAba('budget_lancamentos', true);
  ST.d = await carregarDistrito(d, ST.mes);
  ST.dF = ST.mes === MES_FECHADO ? ST.d : (ST.modelo === 'individual' ? await carregarDistrito(d, MES_FECHADO) : null); // base dos planos
  if (ST.modelo === 'individual') telaReps(); else montar();
}
async function carregarDistrito(d, m){ // dados de um distrito no mês, cada fonte no último mês que tem resultado
  var L = d.linha;
  function doD(arr){ return (arr || []).filter(function(x){ return x.distrito_id === d.distrito_id; }); }
  function temD(rows){ return doD(rows).length > 0; }
  // em série, por causa da cota do Sheets
  var uR = await ultimaAba(function(x){ return 'reps_' + x; }, m, function(rows){ return doD(rows).some(function(x){ return num(x.prod) !== null; }); });
  var uP = await ultimaAba(function(x){ return 'produtos_rep_' + L + '_' + x; }, m, temD);
  var uX = await ultimaAba(function(x){ return 'pex_' + x; }, m, temD);
  var ref = { reps: uR.mes, prod: uP.mes, pex: uX.mes, freq: m, sob: m }, aR = mesAnt(ref.reps), aX = mesAnt(ref.pex);
  var pd = await fetchAba('produtos_dist_' + L + '_' + ref.prod), jor = await fetchAba('jornada');
  var dRef = ref.reps === m ? d : (doD(await fetchAba('distritos_' + ref.reps))[0] || d);
  var distAnt = aR ? doD(await fetchAba('distritos_' + aR))[0] || null : null, pexAnt = aX ? doD(await fetchAba('pex_' + aX)) : [];
  await carregarExtra();
  var pref = d.distrito_id.substring(0, 6);
  [['freq', EXTRA.freq], ['sob', EXTRA.sobrep]].forEach(function(par){ // frequência e sobreposição têm snapshots em meses diferentes
    for (var mf = m, nf = 0; mf && nf < 6; mf = mesAnt(mf), nf++){ if ((par[1][mf] || []).some(function(l){ return l.substring(0, 6) === pref; })){ ref[par[0]] = mf; break; } } });
  var dist = {}; Object.keys(d).forEach(function(k){ dist[k] = d[k]; }); dist.prod = dRef.prod;
  var o = { mes: m, dist: dist, ref: ref, antReps: aR, antPex: aX, reps: doD(uR.rows).filter(function(x){ return x.vago !== 'True'; }), pd: doD(pd), pr: doD(uP.rows), pex: doD(uX.rows), pexAnt: pexAnt, jor: jor,
           distAnt: distAnt, histD: [] };
  // Dados de mercado (Raio X): chegam com ~45 dias de defasagem; usa o ciclo mais recente até o mês escolhido
  var mrx = await fetchAba('mercado_rx'), mdm = await fetchAba('mercado_demanda'), ciclos = {}, cic = null, mrc = [];
  try { mrc = await fetchAba('mercado_rx_conc'); } catch (e) { mrc = []; } // prescrição por concorrente (aba nova; pode não existir)

// Gráfico de linhas pequeno (SVG, sem biblioteca): série de referência sai tracejada e só rotula o último ponto
function mkGrafico(labels, series){
  var W = 360, H = 190, mL = 34, mR = 34, mT = 16, mB = 24, vals = [];
  series.forEach(function(s){ s.pts.forEach(function(v){ if (v !== null && !isNaN(v)) vals.push(v); }); });
  if (!vals.length) return '<div class="nota" style="padding:20px 0">Sem dados neste recorte.</div>';
  var max = Math.max.apply(null, vals), passo = max <= 5 ? 1 : (max <= 12 ? 2 : (max <= 30 ? 5 : (max <= 60 ? 10 : 20))), topo = Math.ceil(max * 1.15 / passo) * passo || passo, n = labels.length;
  function X(i){ return n === 1 ? mL + (W - mL - mR) / 2 : mL + i * (W - mL - mR) / (n - 1); }
  function Y(v){ return mT + (1 - v / topo) * (H - mT - mB); }
  var o = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="mk-svg" role="img">';
  for (var g = 0; g <= topo + 1e-9; g += passo) o += '<line x1="' + mL + '" x2="' + (W - mR) + '" y1="' + Y(g) + '" y2="' + Y(g) + '" stroke="#e5e7eb"/><text x="' + (mL - 5) + '" y="' + (Y(g) + 3.5) + '" class="mk-eixo" text-anchor="end">' + g + '%</text>';
  labels.forEach(function(l, i){ o += '<text x="' + X(i) + '" y="' + (H - 7) + '" class="mk-eixo' + (i === n - 1 ? ' atual' : '') + '" text-anchor="middle">' + l + '</text>'; });
  series.forEach(function(s){
    var d = '', novo = true;
    s.pts.forEach(function(v, i){ if (v === null || isNaN(v)){ novo = true; return; } d += (novo ? 'M' : 'L') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; novo = false; });
    o += '<path d="' + d + '" fill="none" stroke="' + s.cor + '" stroke-width="' + (s.ref ? 1.6 : 2.6) + '" stroke-opacity="' + (s.ref ? 0.65 : 1) + '"' + (s.ref ? ' stroke-dasharray="5 4"' : '') + ' stroke-linecap="round" stroke-linejoin="round"/>';
    s.pts.forEach(function(v, i){
      if (v === null || isNaN(v)) return;
      o += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="' + (s.ref ? 2.4 : 3.6) + '" fill="' + (s.ref ? '#fff' : s.cor) + '" stroke="' + s.cor + '" stroke-width="1.8"><title>' + s.nome + ' · ' + labels[i] + ': ' + mkPct(v) + '</title></circle>';
      if (s.semRotulo) return;
      if (s.ref){ if (i === n - 1) o += '<text x="' + (X(i) + 6).toFixed(1) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" class="mk-val ref" fill="' + s.cor + '">' + mkPct(v) + '</text>'; }
      else o += '<text x="' + X(i).toFixed(1) + '" y="' + (Y(v) - 7).toFixed(1) + '" class="mk-val" fill="' + s.cor + '" text-anchor="middle">' + mkPct(v) + '</text>';
    });
  });
  return o + '</svg>';
}

      return '<tr' + (r.setor === ST.setor ? ' style="background:#eff6ff;font-weight:700"' : '') + '><td class="n">' + esc(r.nome) + (r.setor === ST.setor ? ' ◀' : '') + '</td><td>' + brl(y.cota) + '</td><td>' + pc(dC ? y.cota / dC * 100 : null) + '</td><td>' + brl(y.real) + '</td><td>' + pc(dR ? y.real / dR * 100 : null) + '</td><td>' + barra(y.cob, cls(y.cob)) + '</td></tr>'; }).join('') +

      '<div class="nota">Histórico do setor em ' + mk + ': ' + serie.map(function(s){ var r = s.pr.filter(function(p){ return p.setor_id === ST.setor && norm(p.produto) === mk; })[0]; return s.mes + ' ' + (r && num(r.cota) ? p1(num(r.realizado) / num(r.cota) * 100) : '—'); }).join(' · ') + '</div></div>';
    var prob = mk + ' em ' + p1(x.cob) + ' de cobertura da cota no setor — faltam ' + brl(x.cota - x.real) + '.';

// ── planos: 5 porquês + 5W2H ──
// ── evolução dos planos ──────────────────────────────────────────
// Ao salvar, o plano guarda um retrato fixo do que ele ataca (campo "base"):
// no de Fundamentos, o valor de cada indicador de execução; no de marca-chave,
// o realizado em R$ e o % de atingimento da cota. A cada RPS individual
// seguinte (data da RPS posterior à do retrato), abrir o deck grava sozinho
// uma nova medição (campo "medicoes", uma por data de RPS). O Histórico do
// time e o próprio plano mostram base → medições → valor atual. Os indicadores
// acompanhados no plano de Fundamentos são os marcados em "Indicador que
// direciona este plano". Planos salvos antes deste recurso ganham a base na
// primeira vez em que são abertos.
// ── planos: último mês fechado, métrica e objetivo por mês ──────
// Os planos partem sempre dos KPIs do último mês FECHADO (o mês anterior ao do calendário): é
// com ele que se decide se há desvio, qual é a base e de onde contam os meses do objetivo. O mês
// escolhido na tela continua valendo para os demais slides. Cada plano tem UMA métrica (em
// Fundamentos, o indicador escolhido; em marca-chave, o % de cobertura da cota), um prazo de 1 a 3
// meses e um objetivo para cada mês do prazo ("objetivos": [{mes, alvo}], a partir do mês seguinte
// ao da base, "mesBase"). O realizado de cada mês é gravado sozinho em "resultados" quando o deck
// do representante (ou o Histórico do time) é aberto e já existe dado daquele mês — parcial
// enquanto o mês não fecha. Fim do prazo não encerra o plano: a página avisa e o GD encerra.
var MES_FECHADO = (function(){ var i = new Date().getMonth(); return MESES[i > 0 ? i - 1 : 0]; })();
function comDados(ds, fn){ var g = ST.d; if (ds) ST.d = ds; try { return fn(); } finally { ST.d = g; } }

function fmtMet(nome, v){ return v === null || v === undefined || isNaN(v) ? '—' : (+v).toFixed(1).replace('.', ',') + (/^PEX/.test(nome) ? ' pts' : '%'); }
function nomeMetrica(ch, p){ return /^fund/.test(ch) ? kpiKey(p.metrica) : 'Cobertura da cota'; }
function valorMetrica(ch, p, ds, mes){ // valor da métrica do plano nos dados "ds" — só quando o dado é mesmo do mês pedido
  if (!ds) return null;
  return comDados(ds, function(){ try {
    if (/^fund/.test(ch)){ var i = fundamentosRep().filter(function(x){ return kpiKey(x.nome) === kpiKey(p.metrica); })[0]; return i && i.n !== null && i.n !== undefined && (ds.ref[i.fonte] || ds.mes) === mes ? i.n : null; }
    var M = marcasRep(), mk = M.marcas.filter(function(x){ return 'marca-' + x.replace(/[^A-Z0-9]+/g, '_') === ch; })[0], x = mk && M.eu.m[mk];
    return x && x.cob !== null && ds.ref.prod === mes ? x.cob : null;
  } catch(e){ return null; } });
}
function atualizarResultados(ch, p){ // grava em p.resultados o realizado dos meses do objetivo que já têm dado; devolve true se mudou

  var mudou = false, fontes = [ST.d, ST.dF].filter(Boolean); p.resultados = p.resultados || {};
  p.objetivos.forEach(function(o){ var v = null; fontes.forEach(function(ds){ if (v === null && ds.mes === o.mes) v = valorMetrica(ch, p, ds, o.mes); });
    if (v === null) return; var parcial = MESES.indexOf(o.mes) > MESES.indexOf(MES_FECHADO), r = p.resultados[o.mes]; v = Math.round(v * 100) / 100;
    if (!r || Math.abs(r.v - v) > 0.004 || !!r.parcial !== parcial){ p.resultados[o.mes] = { v: v, parcial: parcial, data: hoje() }; mudou = true; } });
  return mudou;
}
function prazoVencido(p){ return !!(p.objetivos && p.objetivos.length && !p.encerrado && MESES.indexOf(MES_FECHADO) >= MESES.indexOf(p.objetivos[p.objetivos.length - 1].mes)); }

  var nome = nomeMetrica(ch, p), inv = metricaInv(nome), b = null, ult = null;
  if (p.base){ if (/^fund/.test(ch)){ var bi = (p.base.inds || []).filter(function(i){ return i.nome === nome; })[0]; b = bi ? bi.n : null; } else b = p.base.cob; }
  var pts = [{ rot: 'Base', txt: fmtMet(nome, b), mes: p.mesBase || '' }];

    if (r && !r.parcial) ult = { mes: o.mes, bateu: bateu }; });
  var delta = ult ? '<b style="color:' + (ult.bateu ? '#15803d' : '#b91c1c') + '">' + (ult.bateu ? '✓ atingiu' : '✗ não atingiu') + ' o objetivo de ' + ult.mes + '</b>' : '<b style="color:var(--gray)">em curso</b>';
  if (prazoVencido(p)) delta += '<br><span class="p crit">prazo encerrado em ' + p.objetivos[p.objetivos.length - 1].mes + ' — encerrar o plano</span>';

}
function planoMetaForm(ch, info, p){ // bloco do formulário: métrica, prazo e objetivo de cada mês

  if (fund){ var opc = info.todos || info.kpis || [], sel = p.metrica || (p.kpis && p.kpis.length === 1 ? p.kpis[0] : '') || (info.kpis || [])[0] || '';

      opc.map(function(k){ var i = (info.inds || []).filter(function(x){ return x.nome === k; })[0]; return '<option value="' + esc(k) + '"' + (kpiKey(k) === kpiKey(sel) ? ' selected' : '') + '>' + esc(k) + (i ? ' — ' + base + ': ' + i.valor + ' · meta ' + i.meta : '') + '</option>'; }).join('') + '</select></div>';
  } else h += '<div><label class="pl">Métrica do plano</label><div class="pmfix">% de cobertura da cota de ' + esc(info.titulo) + ' · base ' + base + '/2026: <b>' + (info.base !== undefined && info.base !== null ? p1(info.base) : '—') + '</b></div></div>';
  h += '<div><label class="pl">Prazo <small>máximo de 3 meses</small></label><select data-f="prazo" onchange="planoPrazo(' + q + ')">' + ms.map(function(m, k){ return '<option value="' + (k + 1) + '"' + (k + 1 === n ? ' selected' : '') + '>' + (k + 1) + (k ? ' meses' : ' mês') + ' — até ' + m + '/2026</option>'; }).join('') + '</select></div>';
  h += '<div><label class="pl">Objetivo de cada mês <small>' + (fund ? 'na unidade do indicador' : '% de cobertura da cota') + '</small></label><div class="pobj">' + ms.map(function(m, k){ var o = (p.objetivos || [])[k];
    return '<span data-objbox="' + k + '"' + (k < n ? '' : ' style="display:none"') + '><i>' + m + '</i><input type="number" step="0.1" data-obj="' + k + '" data-mes="' + m + '" value="' + (o && o.alvo !== undefined && o.alvo !== null ? o.alvo : '') + '" placeholder="objetivo"></span>'; }).join('') + '</div></div>';

function planoPrazo(ch){ var box = $('plano-' + ch), n = +box.querySelector('[data-f="prazo"]').value; [].forEach.call(box.querySelectorAll('[data-objbox]'), function(s){ s.style.display = +s.getAttribute('data-objbox') < n ? '' : 'none'; }); }
function objetivoTag(p){ // etiqueta curta do objetivo, para cabeçalhos
  if (!p.objetivos || !p.objetivos.length || !p.metrica) return '<span class="p warn">sem métrica e objetivo — editar o plano</span>';
  return prazoVencido(p) ? '<span class="p crit">prazo encerrado em ' + p.objetivos[p.objetivos.length - 1].mes + '</span>' : '';
}

function kpiKey(s){ return String(s).replace(/ \(simulado\)$/, '').replace(/^PEX — .*$/, 'PEX'); }
function medir(ch){ // retrato atual do que o plano acompanha, para o setor em ST.setor
  var ref = ST.d.ref, m = { data: hoje(), rps: ST.data };
  if (/^fund/.test(ch)) m.inds = fundamentosRep().map(function(i){ return { nome: kpiKey(i.nome), n: i.n, txt: i.valor + (i.quad ? ' ' + i.quad : ''), mes: ref[i.fonte] || ST.mes }; });
  else { var M = marcasRep(), mk = M.marcas.filter(function(x){ return 'marca-' + x.replace(/[^A-Z0-9]+/g, '_') === ch; })[0], x = mk && M.eu.m[mk];
    m.mes = ref.prod; m.real = x ? x.real : null; m.cota = x ? x.cota : null; m.cob = x ? x.cob : null; }
  return m;
}
function mesmaMedida(a, b){ function k(m){ return m.inds ? m.inds.map(function(i){ return i.nome + ':' + i.n + ':' + i.mes; }).join('|') : [m.mes, m.real, m.cota].join('|'); } return k(a) === k(b); }
async function planoAcompanhar(ch, d, reg, dataRps){ // cria a base (planos antigos) ou registra a medição da RPS; devolve true se gravou
  var agora = medir(ch), mudou = false;
  if (!d.base){ agora.data = reg.data; agora.rps = reg.data; d.base = agora; d.medicoes = d.medicoes || []; mudou = true; }
  else if (dataRps && dataRps > d.base.rps){
    agora.rps = dataRps; d.medicoes = d.medicoes || []; var i = -1; d.medicoes.forEach(function(x, k){ if (x.rps === dataRps) i = k; });
    if (i < 0){ d.medicoes.push(agora); mudou = true; } else if (!mesmaMedida(d.medicoes[i], agora)){ d.medicoes[i] = agora; mudou = true; }
    d.medicoes.sort(function(a, b){ return a.rps.localeCompare(b.rps); });
  }
  if (atualizarResultados(ch, d)) mudou = true;
  return mudou ? await gravarLinha(reg, d) : false;
}
async function acompanharPlanos(){ // RPS individual: roda ao montar o deck do representante
  if (!(CONFIG.budget_webapp_url && CONFIG.budget_token)) return;
  var ab = planosAbertos(ST.setor), gravou = false;
  for (var i = 0; i < ab.length; i++) if (await planoAcompanhar(ab[i].ch, ab[i].p, ab[i].reg, ST.data)) gravou = true;
  if (gravou) andRedesenhar();
}
// linhas da evolução de um plano: [{nome, pontos:[{rot, txt}], delta}]
function evolDados(ch, p, atual){
  if (p.objetivos && p.objetivos.length && p.metrica) return objetivoLinha(ch, p); // plano com objetivo por mês
  if (!p.base) return [];
  var serie = [p.base].concat(p.medicoes || []), out = [];
  function rot(m, k){ return (k === 0 ? 'Base · ' : 'RPS ') + dataBr(m.rps).slice(0, 5); }
  function seta(d, un, inv, casas){ if (d === null) return '—'; if (Math.abs(d) < 0.05) return '<b style="color:var(--gray)">= sem mudança</b>'; var bom = inv ? d < 0 : d > 0;
    return '<b style="color:' + (bom ? '#15803d' : '#b91c1c') + '">' + (d > 0 ? '▲ +' : '▼ ') + (un === 'R$' ? brl(Math.abs(d)).replace('R$', (d < 0 ? '-' : '') + 'R$') : d.toFixed(casas === 0 ? 0 : 1).replace('.', ',') + un) + '</b>'; }
  if (/^fund/.test(ch)){
    var marc = (p.kpis || []).map(kpiKey), nomes = p.base.inds.map(function(i){ return i.nome; }).filter(function(n){ return !marc.length || marc.indexOf(n) >= 0; });
    nomes.forEach(function(nome){
      function de(m){ return (m.inds || []).filter(function(i){ return i.nome === nome; })[0] || null; }
      var pts = serie.map(function(m, k){ var i = de(m); return { rot: rot(m, k), txt: i ? i.txt : '—', mes: i ? i.mes : '' }; }), b = de(p.base), a = atual ? de(atual) : null;
      if (atual) pts.push({ rot: 'Atual', txt: a ? a.txt : '—', mes: a ? a.mes : '', atual: true });
      var d = b && a && b.n !== null && a.n !== null && b.n !== undefined && a.n !== undefined ? a.n - b.n : null;
      out.push({ nome: nome, pontos: pts, delta: seta(d, nome === 'PEX' ? ' pts' : ' pp', /^Sobreposi/.test(nome)) });
    });
  } else {
    function tx(m){ return m.real === null || m.real === undefined ? '—' : brl(m.real) + ' · ' + p1(m.cob); }
    var pts = serie.map(function(m, k){ return { rot: rot(m, k), txt: tx(m), mes: m.mes }; });
    if (atual) pts.push({ rot: 'Atual', txt: tx(atual), mes: atual.mes, atual: true });
    var ok = atual && atual.real !== null && p.base.real !== null && atual.real !== undefined && p.base.real !== undefined;
    out.push({ nome: 'Realizado e % da cota', pontos: pts, delta: ok ? seta(atual.real - p.base.real, 'R$') + ' · ' + seta(atual.cob - p.base.cob, ' pp') : '—' });

}
function evolChips(pts){ return pts.map(function(x){ return '<span class="ev' + (x.atual ? ' at' : '') + '"><i>' + x.rot + (x.mes ? ' · dado de ' + x.mes : '') + '</i>' + esc(x.txt) + '</span>'; }).join('<span class="evs">→</span>'); }
function evolBloco(ch, p){ // dentro do plano salvo, no deck da individual
  var ls = evolDados(ch, p, medir(ch)); if (!ls.length) return '';

    ls.map(function(l){ return '<tr><td><b>' + esc(l.nome) + '</b></td><td>' + evolChips(l.pontos) + '</td><td>' + l.delta + '</td></tr>'; }).join('') + '</tbody></table></div>';

// ── planos em andamento: retomada na RPS seguinte ────────────────
// Um plano fica "em andamento" até o GD encerrá-lo, e volta em toda RPS
// individual do representante — mesmo virando o mês — no slide "Planos em
// andamento", logo depois dos combinados. Cada plano tem a data de criação
// (criadoEm da linha) e a data da próxima revisão (campo "revisao"), que o GD
// escolhe ao salvar e a cada revisão ("revisoes" guarda as datas já feitas).
// Plano com revisão para a data da RPS (ou atrasada) é sinalizado na escolha

function maisDias(iso, n){ var x = String(iso).split('-'), d = new Date(+x[0], +x[1] - 1, +x[2] + n); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function criadoDe(reg){ var t = Number(reg.criadoEm); if (!t) return reg.data || ''; var d = new Date(t); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function planosDoSetor(setor){ // todos os planos do representante, do mais antigo para o mais novo
  var gd = 'N4:' + ST.gd;
  return ST.lanc.filter(function(l){ return l.produto === 'RPS_PLANO' && l.gd === gd; }).map(function(l){ var x = String(l.crm).split('|'); if (x[0] !== 'rpsi' || x[1] !== setor) return null;
    var p; try { p = JSON.parse(l.acao); } catch(e){ return null; } return { reg: l, p: p, ch: x[2], mes: x[3] }; }).filter(Boolean);
}
function planosAbertos(setor){ return planosDoSetor(setor).filter(function(o){ return !o.p.encerrado; }); }
function planoTitulo(ch){ return ch === 'fund' ? 'Fundamentos' : ch === 'fund2' ? 'Fundamentos — 2º plano' : ch.replace(/^marca-/, '').replace(/_/g, ' '); }
function revisaoTag(p, ref){ // etiqueta da próxima revisão em relação a uma data (a da RPS ou hoje)
  if (p.encerrado) return '<span class="p ' + (p.encerrado.resultado === 'atingido' ? 'ok' : 'crit') + '">encerrado em ' + dataBr(p.encerrado.data) + ' — ' + (p.encerrado.resultado === 'atingido' ? 'objetivo atingido' : 'não atingido') + '</span>';
  if (!p.revisao) return '<span class="p warn">sem data de revisão</span>';
  if (p.revisao < ref) return '<span class="p crit">revisão atrasada — era ' + dataBr(p.revisao) + '</span>';
  if (p.revisao === ref) return '<span class="p warn">revisão hoje — ' + dataBr(p.revisao) + '</span>';
  return '<span class="p ok">próxima revisão ' + dataBr(p.revisao) + '</span>';
}
function andPlano(id){ return planosDoSetor(ST.setor).filter(function(o){ return o.reg.id === id; })[0]; }
function andRedesenhar(){ desenharAndamento(); PLANOS.forEach(function(p){ planoDesenhar(p.chave, false); }); planoFinal(); }
async function andStatus(id, k, sel){ var o = andPlano(id); if (!o) return; o.p.acoes[k].status = sel.value; sel.disabled = true; await gravarLinha(o.reg, o.p); andRedesenhar(); }
async function andRevisar(id){ var o = andPlano(id), inp = $('and-rev-' + id); if (!o) return;
  if (!inp.value){ alert('Escolha a data da próxima revisão.'); return; }
  o.p.revisoes = o.p.revisoes || []; if (o.p.revisoes.indexOf(ST.data) < 0) o.p.revisoes.push(ST.data);
  o.p.revisao = inp.value; if (await gravarLinha(o.reg, o.p)) andRedesenhar(); }
async function andEncerrar(id, resultado){ var o = andPlano(id); if (!o) return;
  if (!window.confirm('Encerrar este plano como "' + (resultado === 'atingido' ? 'objetivo atingido' : 'não atingido') + '"? Ele deixa de voltar nas próximas RPS e fica guardado no Histórico do time.')) return;
  o.p.encerrado = { data: ST.data, resultado: resultado }; if (await gravarLinha(o.reg, o.p)) andRedesenhar(); }
// Os planos em andamento abrem cada bloco da RPS individual (pedido do Vinicius): os de Fundamentos
// logo depois do divisor do Bloco 1 e os de produto logo depois do divisor do Bloco 2, até

function andGrupos(){
  var ab = planosAbertos(ST.setor), fund = ab.filter(function(o){ return /^fund/.test(o.ch); }), prod = ab.filter(function(o){ return !/^fund/.test(o.ch); }), pag = [];
  for (var i = 0; i < prod.length; i += AND_POR_SLIDE) pag.push(prod.slice(i, i + AND_POR_SLIDE));

}

  if (tipo === 'fund') return [{ nome: 'Planos em andamento — Fundamentos', msg: ' ', html: '<div id="andamento-fund"></div>' }];

  for (var i = 0; i < n; i++) out.push({ nome: 'Planos em andamento — Produtos' + (n > 1 ? ' (' + (i + 1) + '/' + n + ')' : ''), msg: ' ', html: '<div id="andamento-prod-' + i + '"></div>' });

function ir(i){

  ST.slides.forEach(function(s, k){ s.classList.toggle('on', k === ST.i); });
  [].forEach.call($('dots').children, function(b, k){ b.classList.toggle('on', k === ST.i); });

// sem rolagem: ajusta a escala do slide ativo (45% a 135%) para o conteúdo ocupar a tela
function ajustar(){
  var s = ST.slides[ST.i], b = s && s.querySelector('.body'), f = b && b.querySelector('.fit'); if (!f) return;
  var cs = getComputedStyle(b), W = b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), H = b.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom), z = 1;
  function ap(v){ z = v; f.style.zoom = v; f.style.width = (W / v) + 'px'; if (f.querySelector('.titulo-so')) f.style.height = (H / v) + 'px'; }
  ap(1);
  if (f.querySelector('.titulo-so')) return;
  for (var k = 0; k < 8; k++){ var h = f.getBoundingClientRect().height, alvo = Math.max(0.45, Math.min(1.35, z * H / h * 0.985)); if (Math.abs(alvo - z) < 0.01) break; ap(alvo); }
  if (f.getBoundingClientRect().height > H + 1 && z > 0.45) ap(Math.max(0.45, z * 0.97));
  var largo = f.querySelector('.mk-wrap');
  for (var q = 0; largo && q < 30 && z > 0.45 && largo.scrollWidth > largo.clientWidth + 1; q++) ap(Math.max(0.45, z * 0.96));
}
$('b-prev').onclick = function(){ ir(ST.i - 1); }; $('b-next').onclick = function(){ ir(ST.i + 1); }; $('b-trocar').onclick = telaEntrada;
document.addEventListener('keydown', function(e){
  if (!ST.slides.length || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); ir(ST.i + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); ir(ST.i - 1); }
  else if (e.key === 'Home') ir(0); else if (e.key === 'End') ir(ST.slides.length - 1);
});
window.addEventListener('resize', function(){ if (ST.slides.length) ajustar(); });

(async function(){
  try {
    var res = await fetch('config.json?t=' + Date.now(), {cache:'no-store'}); if (!res.ok) throw new Error('config.json não encontrado.');
    CONFIG = await res.json();
    if ($('b-dash')) $('b-dash').href = REG_PAG;
    if (REG === 'LESTE') document.title = document.title + ' — Leste';
    var cfg = await fetchAba('config'), padrao = null;
    cfg.forEach(function(r){ if (r.chave === 'meses_disponiveis') ST.meses = r.valor.split(',').map(function(s){ return s.trim(); }); if (r.chave === 'mes_padrao') padrao = r.valor; });
    if (!ST.meses.length) ST.meses = MESES.slice(0, 9);
    ST.mes = padrao && ST.meses.indexOf(padrao) >= 0 ? padrao : ST.meses[ST.meses.length - 1];
    ST.distritos = await distritosDe(ST.mes);
    ST.gd = ST.distritos.length ? ST.distritos[0].distrito_id : null;
    telaEntrada();
  } catch(e){ $('stage').innerHTML = '<div class="slide on"><div class="capa"><h2>Erro ao carregar</h2><div class="m">' + esc(e.message) + '</div></div></div>'; }
})();
</script>
</body>
