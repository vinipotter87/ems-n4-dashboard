<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>EMS | Dados de Mercado</title>
<style>
:root{--pri:#1e3a8a;--pri-2:#2563eb;--pri-l:#eff4ff;--red:#C8102E;--red-l:#fce8ec;--green:#15693A;--green-l:#E8F5EE;
--amber:#9C6D00;--amber-l:#FFF7E0;--dark:#111827;--gray:#6B7280;--light:#F3F4F6;--border:#E5E7EB;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#ECEDF0;color:var(--dark);min-height:100vh}
.hdr{background:linear-gradient(135deg,#172554,#1e3a8a 55%,#2563eb);position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.25)}
.hdr-inner{display:flex;align-items:center;padding:12px 28px;gap:16px;flex-wrap:wrap}
.logo{background:#fff;padding:4px 10px;border-radius:6px;font-size:20px;font-weight:900;color:var(--pri);letter-spacing:-1px}
.hdr-sep{width:1px;height:36px;background:rgba(255,255,255,.2)}
.hdr-text h1{color:#fff;font-size:15px;font-weight:700}
.hdr-text p{color:rgba(255,255,255,.65);font-size:11px;margin-top:2px}
.hdr-pills{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.hback{background:#fff;color:var(--pri);padding:5px 14px;border-radius:20px;font-size:11.5px;font-weight:800;text-decoration:none;white-space:nowrap}.hback:hover{background:#e8effd}
.hpill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.hpill.hi{background:#fff;color:var(--pri)}
.bar{display:flex;gap:10px;padding:10px 28px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.bar-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}
.btn{padding:5px 14px;border-radius:16px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;color:var(--gray);cursor:pointer}
.btn.active{background:var(--pri);border-color:var(--pri);color:#fff}
.sel{padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;color:var(--dark);background:#fff;min-width:170px}
.link-btn{font-size:11px;font-weight:700;color:var(--gray);background:none;border:none;cursor:pointer;text-decoration:underline}
.main{padding:22px 20px;max-width:1760px;margin:0 auto}
.sec-hdr{font-size:13px;font-weight:800;display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--border);flex-wrap:wrap}
.sec-hdr:first-child{margin-top:0}
.sec-hdr small{font-size:11px;font-weight:600;color:var(--gray)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:16px 18px;border-top:3px solid var(--pri-2)}
.card.gap{border-top-color:var(--amber)}
.card-t{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}
.card-v{font-size:28px;font-weight:800;margin:6px 0 4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-f{font-size:11px;color:var(--gray);line-height:1.45}
.tr{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap}
.tr.up{background:var(--green-l);color:var(--green)}
.tr.down{background:var(--red-l);color:var(--red)}
.tr.flat{background:var(--light);color:var(--gray)}
.box{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
.box-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--light);text-align:right;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);white-space:nowrap;border-bottom:1px solid var(--border)}
th.l,td.l{text-align:left}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--dark)}
th.grp{text-align:center;background:#e5e9f2;color:var(--pri)}
td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.clicavel{cursor:pointer}
tr.clicavel:hover td{background:var(--pri-l)}
tr.marca td{background:var(--pri-l);font-weight:800}
tr.tot td{background:var(--light);font-weight:800}
.sub{font-size:10.5px;color:var(--gray);font-weight:500}
.share-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.share-bar{flex:1;max-width:260px;min-width:60px;height:10px;background:var(--light);border-radius:5px;overflow:hidden}
.share-bar i{display:block;height:100%;background:#94a3b8;border-radius:5px}
tr.marca .share-bar i{background:var(--pri-2)}
.share-n{width:52px;text-align:right;font-weight:700}
.gap-pos{color:var(--amber);font-weight:800}
.gap-neg{color:var(--pri-2);font-weight:800}
.card.conc{border-top-color:#7c3aed}
.card.gen{border-top-color:#94a3b8}
.comp-bar{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--light)}
.comp-bar i{display:block;height:100%}
.c-gen{background:#cbd5e1}.c-out{background:#7c8aa5}.c-ems{background:var(--pri-2)}
.comp-leg{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--gray);align-items:center}
.comp-leg span{display:flex;align-items:center;gap:6px}
.comp-leg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.comp-leg b{color:var(--dark)}
tr.gen-row td{color:var(--gray);background:#fafafa}
.tag-conc{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;background:#ede9fe;color:#6d28d9;padding:1px 6px;border-radius:8px;margin-left:6px}
.graf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.graf-box{padding:14px 16px 12px}
.graf-t{font-size:12.5px;font-weight:800;margin-bottom:6px}
.graf-t .sub{margin-left:6px}
svg.graf{width:100%;height:auto;display:block}
.g-grid{stroke:#e5e7eb;stroke-width:1}
.g-eixo{font-size:10px;fill:#6B7280}
.g-atual{font-weight:800;fill:#111827}
.g-val{font-size:10.5px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px}
.g-s{cursor:pointer;transition:opacity .15s}svg.graf.foco .g-s{opacity:.1}svg.graf.foco .g-s.on{opacity:1}
.g-hid{display:none}svg.graf.foco .g-s.on .g-hid{display:inline}
.g-leg span{cursor:pointer;padding:1px 4px;border-radius:4px;transition:opacity .15s}.g-leg span.apag{opacity:.35}.g-leg span.on{background:var(--light);color:var(--dark);font-weight:700}
.g-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--gray);margin-top:6px}
.g-leg span{display:flex;align-items:center;gap:5px}
.g-leg i{width:14px;height:3px;border-radius:2px;display:inline-block}
@media(max-width:520px){.graf-grid{grid-template-columns:1fr}}
.ref-reg{display:table;margin-bottom:4px;padding:3px 8px;background:var(--pri-l);border-radius:6px;color:var(--pri);font-size:11px}
.ref-reg .acima{color:var(--green)}.ref-reg .abaixo{color:var(--red)}
tr.ref td{background:#f1f4fb;border-bottom:2px solid #dbe3f5}
th.reg{background:#e5e9f2;color:var(--pri)}
td.reg{background:#f7f9fd}
html.embed .hdr{display:none}
html.embed.reg-fixa .grp-reg{display:none !important}
html.embed body{background:transparent;min-height:0}
html.embed .bar{border-radius:10px;margin-bottom:8px;border:1px solid var(--border)}
html.embed .bar,html.embed .main{padding-left:14px;padding-right:14px}
html.embed .main{padding-top:14px}
.nav-strip{position:sticky;top:0;z-index:40;background:var(--bg,#f4f6fb);margin:0 -4px 14px;padding:8px 4px 10px;border-bottom:1px solid var(--border)}
.nav-t{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);margin-bottom:6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.nav-t span{text-transform:none;letter-spacing:0;font-weight:600}
.nav-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.nav-chip{flex:0 0 auto;min-width:138px;background:#fff;border:1.5px solid var(--border);border-left:4px solid #cbd5e1;border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left;font-family:inherit;color:var(--dark)}
.nav-chip:hover{border-color:#0d9488;border-left-color:#0d9488}
.nav-chip.on{background:#0f766e;border-color:#0f766e;color:#fff}
.nav-chip.on .nav-k{color:#d1fae5}
.nav-chip.cima{border-left-color:var(--green)}.nav-chip.baixo{border-left-color:var(--red)}
.nav-n{font-size:12px;font-weight:800;white-space:nowrap}
.nav-k{font-size:10.5px;color:var(--gray);white-space:nowrap;margin-top:2px}
.nav-k b{font-weight:800}
.nav-chip.todo{border-left-color:var(--pri)}
.rep-banner{background:#fff;border:1.5px solid #0d9488;border-radius:12px;padding:10px 14px;margin:0 0 6px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rep-banner .link-btn{margin-left:auto}
.mk-up{color:var(--green)}.mk-dn{color:var(--red)}
.nota{font-size:11px;color:var(--gray);margin-top:10px;line-height:1.5}
/* visão Por cidade */
.vista-btns{display:flex;gap:6px;margin-right:8px}
.cid-busca{padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;min-width:200px}
.cid-tag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:2px 7px;border-radius:8px;white-space:nowrap}
.cid-tag.fort{background:var(--green-l);color:var(--green)}
.cid-tag.opor{background:#fef3c7;color:#b45309}
.cid-tag.linha{background:#e8effd;color:#1d4ed8}
.cid-tag.peq{background:var(--light);color:var(--gray)}
.card.fort{border-top-color:var(--green)}.card.opor{border-top-color:var(--amber)}
.cid-hist{font-size:11px;color:var(--gray);white-space:nowrap}
.cid-hist b{color:var(--dark)}
.cid-hist .sel{background:var(--pri-l);padding:1px 5px;border-radius:6px;min-width:0;border:none;font-size:11px}
.peso-bar{display:inline-block;width:70px;height:8px;background:var(--light);border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}
.peso-bar i{display:block;height:100%;background:#0d9488;border-radius:4px}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loading-spinner{width:48px;height:48px;border:4px solid #dbe5ff;border-top:4px solid var(--pri-2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:14px;font-weight:600;color:var(--gray)}
.error-card{background:#fff;border-radius:12px;padding:28px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.error-title{font-size:15px;font-weight:800;margin-bottom:6px}
.error-sub{font-size:13px;color:var(--gray)}
.mk-secao{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:26px 0 0;padding:10px 16px;border-radius:12px 12px 0 0;border-left:6px solid}
.mk-secao.rx{border-color:#0d9488;background:#e6f6f4}.mk-secao.dem{border-color:#2563eb;background:#e8effd}
.mk-secao-tag{font-size:14px;font-weight:900;letter-spacing:.8px;text-transform:uppercase}
.mk-secao.rx .mk-secao-tag{color:#0f766e}.mk-secao.dem .mk-secao-tag{color:#1d4ed8}
.mk-secao-sub{font-size:11px;color:#4b5563;font-weight:600}
.mk-secao-box{border-left:6px solid;padding:2px 0 14px 16px;border-radius:0 0 0 12px}
.mk-secao-box.rx{border-color:#0d9488}.mk-secao-box.dem{border-color:#2563eb}
.card.rx{border-top-color:#0d9488}
.share-bar.rx i{background:#5eead4}tr.marca .share-bar.rx i{background:#0d9488}
.mk-secao-box.rx tr.marca td{background:#e6f6f4}
@media(max-width:700px){.hdr-inner,.bar,.main{padding-left:16px;padding-right:16px}.card-v{font-size:24px}}
</style>

<body class="tema-claro">

<div class="loading-overlay" id="loading"><div class="loading-spinner"></div><div class="loading-txt" id="loading-txt">Carregando…</div></div>

<div class="hdr">
  <div class="hdr-inner">
    <div class="logo"><img src="assets/logo-grupo-ems.png" alt="Grupo EMS"></div>
    <div class="hdr-sep"></div>
    <div class="hdr-text">
      <h1>📊 Dados de Mercado — Marcas-Chave</h1>
      <p>Prescrição (receitas) e Demanda · Market share (venda) em blocos separados · fonte: Power BI Raio X</p>
    </div>
    <div class="hdr-pills">
      <a class="hback" id="btn-voltar" href="index.html">← Voltar ao Dashboard</a>
      <span class="hpill hi" id="pill-mes">—</span>
      <span class="hpill" id="pill-escopo">—</span>
    </div>
  </div>
</div>

<div class="bar" id="mes-bar" style="display:none">
  <span class="bar-label">Visão:</span>
  <div class="vista-btns" id="vista-btns"></div>
  <span class="bar-label">Ciclo:</span>
  <div id="mes-btns" style="display:flex;gap:6px;flex-wrap:wrap"></div>
</div>

<div class="bar" id="filtro-bar" style="display:none">
  <span class="bar-label grp-reg">Regional:</span>
  <div id="reg-btns" class="grp-reg" style="display:flex;gap:6px"></div>
  <span class="bar-label" style="margin-left:8px">Marca:</span>
  <select class="sel" id="sel-marca"></select>
  <span class="bar-label grp-gd" style="margin-left:8px">Distrito:</span>
  <select class="sel grp-gd" id="sel-distrito"></select>
  <span class="bar-label grp-setor" style="margin-left:8px;display:none">Representante:</span>
  <select class="sel grp-setor" id="sel-setor" style="display:none"></select>
  <button class="link-btn grp-gd" id="btn-limpar">Ver regional inteira</button>
  <span class="bar-label grp-cid" style="margin-left:8px;display:none">Cidade:</span>
  <input class="cid-busca grp-cid" id="cid-busca" type="search" placeholder="buscar cidade…" style="display:none">
  <div class="vista-btns grp-cid" id="cid-top-btns" style="display:none"></div>
</div>

<div class="main" id="main"></div>

<script>
var CONFIG = {};
var TODOS_MESES = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
var REG_LABEL = { SPI: 'SPI OESTE', LESTE: 'LESTE' };
var STATE = { rx: [], dem: [], cid: [], cids: [], cidd: [], vista: 'gd', cidTop: 30, cidBusca: '', cidSel: '', mes: null, regional: null, marcaKey: null, distrito: '', setor: '', sort: { rx: { col: 'rxMercado', dir: -1 }, dem: { col: 'demTotal', dir: -1 }, cid: { col: 'rx', dir: -1 } } };
// Modo embutido (dentro do dashboard): sem cabeçalho próprio, estado inicial pela URL e altura avisada ao pai
var PARAMS = new URLSearchParams(location.search);
var EMBED = PARAMS.get('embed') === '1';
if (EMBED) document.documentElement.classList.add('embed');
if (PARAMS.get('regional')) { STATE.regional = PARAMS.get('regional'); if (EMBED) document.documentElement.classList.add('reg-fixa'); } // embutida no dashboard de uma regional: sem troca de regional
if (PARAMS.get('mes')) STATE.mes = PARAMS.get('mes');
if (PARAMS.get('vista') === 'cidade') STATE.vista = 'cidade';
var DISTRITO_INICIAL = PARAMS.get('distrito') || '';
var SETOR_INICIAL = PARAMS.get('setor') || '';
function avisarAltura() {
  if (EMBED && window.parent !== window) window.parent.postMessage({ mercadoAltura: document.documentElement.scrollHeight }, location.origin);
}

function sheetsUrl(aba) {
  return 'https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.spreadsheet_id +
    '/values/' + encodeURIComponent(aba) + '?key=' + CONFIG.api_key;
}

async function fetchAba(aba, tentativa) {
  tentativa = tentativa || 0;
  var res = await fetch(sheetsUrl(aba), { cache: 'no-store' });
  if (res.status === 429 && tentativa < 6) {
    await new Promise(function(r) { setTimeout(r, 500 * Math.pow(1.8, tentativa) + Math.random() * 400); });
    return fetchAba(aba, tentativa + 1);
  }
  if (!res.ok) throw new Error('Erro ao buscar aba: ' + aba + ' (' + res.status + ')');
  var rows = (await res.json()).values || [];
  if (rows.length < 2) return [];
  var headers = rows[0];
  return rows.slice(1).map(function(row) {
    var obj = {};
    headers.forEach(function(h, i) { obj[h] = row[i] !== undefined ? row[i] : null; });
    return obj;
  });
}

function n(v) {
  if (v === null || v === undefined || v === '' || v === 'None') return null;
  var f = parseFloat(v);
  return isNaN(f) ? null : f;
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fmtInt(v) { return v === null ? '—' : Math.round(v).toLocaleString('pt-BR'); }
function fmtPct(v) {
  if (v === null) return '—';
  var a = Math.abs(v);
  return v.toLocaleString('pt-BR', { minimumFractionDigits: a < 10 && a % 1 ? 1 : 0, maximumFractionDigits: a < 1 ? 2 : 1 }) + '%';
}
function fmtRS(v) {
  if (v === null) return '—';
  var a = Math.abs(v);
  if (a >= 1e6) return 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' mi';
  if (a >= 1e3) return 'R$ ' + Math.round(v / 1e3).toLocaleString('pt-BR') + ' mil';
  return 'R$ ' + Math.round(v).toLocaleString('pt-BR');
}
function trend(v, sufixo) {
  if (v === null) return '';
  v = Math.round(v * 10) / 10 || 0;
  var cls = v > 0.05 ? 'up' : (v < -0.05 ? 'down' : 'flat');
  var seta = cls === 'up' ? '▲' : (cls === 'down' ? '▼' : '●');
  return '<span class="tr ' + cls + '">' + seta + ' ' + (v > 0 ? '+' : '') + v.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + sufixo + '</span>';
}
function penTxt(v) {
  if (v === null) return 'sem dado';
  v = Math.round(v * 10) / 10 || 0;
  var t = (v > 0 ? '+' : '') + v.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' pp';
  return t + (v > 0 ? ' — ganhando mercado' : (v < 0 ? ' — perdendo mercado' : ' — estável'));
}
function gapHtml(g) {
  if (g === null) return '—';
  return '<span class="' + (g > 0 ? 'gap-pos' : 'gap-neg') + '">' + (g > 0 ? '+' : '') + g.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' pp</span>';
}
function primeiroNome(nome) {
  var p = String(nome || '').trim().split(/\s+/);
  return p.length > 1 ? p[0] + ' ' + p[p.length - 1] : p[0];
}

// ── Recortes ─────────────────────────────────────────────────────────────────
function filtroBase(r) {
  return r.mes === STATE.mes && r.regional === STATE.regional && (r.linha + '|' + r.marca) === STATE.marcaKey;
}
function rxDe(nivel, codigo) {
  return STATE.rx.filter(function(r) { return filtroBase(r) && r.nivel === nivel && (codigo === undefined || r.codigo === codigo); });
}
function demDe(nivel, codigo) {
  return STATE.dem.filter(function(r) { return filtroBase(r) && r.nivel === nivel && (codigo === undefined || r.codigo === codigo); });
}
// Resume as linhas de produto de um território: mercado total, crescimento e a linha da marca
function ehGenerico(r) { return /\(GENERICO\)/i.test(r.produto || ''); }
function ehEms(r) { return /\(EMS\)\s*$/i.test(r.produto || ''); }
function valorAnterior(r) {
  var v = n(r.valor) || 0, c = n(r.cresc_pct);
  return (c !== null && c > -100) ? v / (1 + c / 100) : v;
}
function resumoDem(linhas) {
  var total = 0, anterior = 0, marca = null, gen = 0, genAnt = 0, mar = 0, marAnt = 0;
  linhas.forEach(function(r) {
    var v = n(r.valor) || 0, a = valorAnterior(r);
    total += v; anterior += a;
    if (ehGenerico(r)) { gen += v; genAnt += a; } else { mar += v; marAnt += a; }
    if (r.eh_marca === '1') marca = r;
  });
  var ordenado = linhas.slice().sort(function(a, b) { return (n(b.valor) || 0) - (n(a.valor) || 0); });
  var marcas = ordenado.filter(function(r) { return !ehGenerico(r); });
  var genericos = ordenado.filter(ehGenerico);
  var concorrentes = marcas.filter(function(r) { return !ehEms(r); });

    Object.keys(escTot).forEach(function(m) { var t = escTot[m]; t.share = t.rx ? t.rxm / t.rx * 100 : null; });

    (comEscopo ? ' Nível ' + rotEsc + ': o Rx de cada médico do export por médico do Raio X é atribuído ao setor e à cidade do consultório dele conforme o painel mais recente da Qualificação do Painel Médico (cada médico está em um só setor da linha); somado por cidade, bate com a leitura direta do Raio X. "Painel" = médicos do ' + rotEsc + ' com consultório na cidade; "Prescritores" = os que tiveram receita no mercado da marca.' : ' O painel por cidade é menor que o da visão por distrito porque só entram cidades com receita no mercado da marca (médicos sem cidade cadastrada ou em cidades sem receita ficam fora).') + '</div>';
  html += '</div>';

// ── DEMANDA · market share por cidade (só regional: a cidade da demanda é a do ponto de venda) ──
function demandaCidade(marca, linha, mesSel, mesAnt, meses, comEscopo, rotEsc, nomeReg) {
  var base = STATE.cidd.filter(function(r) { return r.regional === STATE.regional && r.linha === linha && r.marca === marca; });
  if (!base.length) return '';
  var html = secao('dem') + '<div class="mk-secao-box dem">';
  if (comEscopo) {
    html += '<div class="nota" style="font-size:12px;padding:12px 0">A demanda por cidade só existe no nível da regional: na demanda a cidade é a do ponto de venda (UTC), não a do médico, então não dá para recortar por ' + rotEsc + '. Escolha "Regional inteira" para ver o market share por cidade.</div></div>';
    return html;
  }
  // por cidade e mês: total do mercado, valor da marca, concorrentes
  var porCid = {};
  base.forEach(function(r) {
    var h = porCid[r.cidade] = porCid[r.cidade] || {}, m = h[r.mes] = h[r.mes] || { tot: 0, marca: 0, var_pp: null, prods: [] };
    var v = n(r.valor) || 0;
    m.tot += v;
    if (r.eh_marca === '1') { m.marca += v; m.var_pp = n(r.var_pp); }
    m.prods.push({ produto: r.produto, valor: v, eh: r.eh_marca === '1', gen: ehGenerico(r) });
  });
  var regTot = {};
  Object.keys(porCid).forEach(function(c) { Object.keys(porCid[c]).forEach(function(m) { var t = regTot[m] = regTot[m] || { tot: 0, marca: 0 }; t.tot += porCid[c][m].tot; t.marca += porCid[c][m].marca; }); });
  var tot = regTot[mesSel];
  if (!tot) {
    html += '<div class="nota" style="font-size:12px;padding:12px 0">Sem leitura de demanda por cidade em ' + mesSel + '/2026. Ciclos lidos: ' + Object.keys(regTot).sort(function(a, b) { return TODOS_MESES.indexOf(a) - TODOS_MESES.indexOf(b); }).join(', ') + '.</div></div>';
    return html;
  }
  var regShare = tot.tot ? tot.marca / tot.tot * 100 : null;
  var regShareAnt = mesAnt && regTot[mesAnt] && regTot[mesAnt].tot ? regTot[mesAnt].marca / regTot[mesAnt].tot * 100 : null;
  function pp(v) { return (v > 0 ? '+' : '') + v.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' pp'; }
  function pct1(v) { return v === null || v === undefined ? '—' : v.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%'; }
  var cidades = Object.keys(porCid).filter(function(c) { return porCid[c][mesSel] && porCid[c][mesSel].tot > 0; }).map(function(c) {
    var x = porCid[c][mesSel], a = mesAnt && porCid[c][mesAnt];
    var share = x.marca / x.tot * 100, shareAnt = a && a.tot ? a.marca / a.tot * 100 : null;
    var peso = tot.tot ? x.tot / tot.tot * 100 : null;
    var dif = regShare !== null ? Math.round((share - regShare) * 10) / 10 : null;
    var conc = x.prods.filter(function(p) { return !p.eh; }).sort(function(p, q) { return q.valor - p.valor; });
    var lider = conc[0] ? { produto: conc[0].produto, share: conc[0].valor / x.tot * 100, gen: conc[0].gen } : null;
    var grande = peso !== null && peso >= 1;
    var cls = !grande ? 'peq' : (dif === null ? 'linha' : (dif >= 2 ? 'fort' : (dif <= -2 ? 'opor' : 'linha')));
    return { cidade: c, tot: x.tot, marca: x.marca, peso: peso, share: share, var_pp: shareAnt !== null ? Math.round((share - shareAnt) * 10) / 10 : x.var_pp, dif: dif, cls: cls, lider: lider, posicao: 1 + conc.filter(function(p) { return p.valor > x.marca; }).length, hist: porCid[c], prods: x.prods };
  });
  var ROT = { fort: 'Fortaleza', opor: 'Oportunidade', linha: 'Em linha', peq: 'Mercado pequeno' };
  function soma(lista, k) { return lista.reduce(function(a, c) { return a + (c[k] || 0); }, 0); }
  var fort = cidades.filter(function(x) { return x.cls === 'fort'; }), opor = cidades.filter(function(x) { return x.cls === 'opor'; });
  var ordTot = cidades.slice().sort(function(a, b) { return b.tot - a.tot; });
  var top10 = ordTot.slice(0, 10);
  var lideres = cidades.filter(function(x) { return x.peso >= 1 && x.posicao === 1; });
  html += '<div class="card-grid">';
  html += '<div class="card"><div class="card-t">Market share · ' + esc(nomeReg) + '</div><div class="card-v">' + fmtPct(regShare) + trend(regShareAnt !== null && regShare !== null ? Math.round((regShare - regShareAnt) * 10) / 10 : null, ' pp') + '</div><div class="card-f">' + fmtRS(tot.tot) + ' de mercado em ' + cidades.length + ' cidades (preço fábrica) · soma das cidades lidas</div></div>';
  html += '<div class="card fort"><div class="card-t">Fortalezas</div><div class="card-v">' + fort.length + ' <span class="sub" style="font-size:13px">cidades</span></div><div class="card-f"><b>' + pct1(tot.tot ? soma(fort, 'tot') / tot.tot * 100 : null) + '</b> do mercado da regional · cidade relevante (≥ 1% do mercado) com share ao menos 2 pp acima da regional</div></div>';
  html += '<div class="card opor"><div class="card-t">Oportunidades</div><div class="card-v">' + opor.length + ' <span class="sub" style="font-size:13px">cidades</span></div><div class="card-f"><b>' + pct1(tot.tot ? soma(opor, 'tot') / tot.tot * 100 : null) + '</b> do mercado da regional · cidade relevante com share ao menos 2 pp abaixo da regional</div></div>';
  html += '<div class="card conc"><div class="card-t">Liderança</div><div class="card-v">' + lideres.length + ' <span class="sub" style="font-size:13px">de ' + cidades.filter(function(x) { return x.peso >= 1; }).length + '</span></div><div class="card-f">cidades relevantes em que ' + esc(marca) + ' é a 1ª marca do mercado · as 10 maiores cidades concentram <b>' + pct1(tot.tot ? soma(top10, 'tot') / tot.tot * 100 : null) + '</b> do mercado</div></div>';
  html += '</div>';

  // cidade selecionada: concorrentes na cidade
  if (STATE.cidSel) {
    var c0 = cidades.filter(function(x) { return x.cidade === STATE.cidSel; })[0];
    if (c0) {
      var ps = c0.prods.slice().sort(function(a, b) { return b.valor - a.valor; }).slice(0, 8);
      var labels = meses.slice();
      var sCid = { nome: STATE.cidSel, pontos: labels.map(function(m) { var h = c0.hist[m]; return h && h.tot ? h.marca / h.tot * 100 : null; }) };
      var sReg = { nome: nomeReg, pontos: labels.map(function(m) { var t = regTot[m]; return t && t.tot ? t.marca / t.tot * 100 : null; }), dash: '6 4' };
      html += '<div class="rep-banner" style="margin-top:14px;border-color:#2563eb">🏪 <b>' + esc(STATE.cidSel) + '</b> <span class="cid-tag ' + c0.cls + '">' + ROT[c0.cls] + '</span> <span class="sub">— ' + fmtRS(c0.tot) + ' de mercado (' + pct1(c0.peso) + ' da regional) · ' + esc(marca) + ' em ' + c0.posicao + 'º lugar com ' + fmtPct(c0.share) + (c0.dif === null ? '' : ' (' + pp(c0.dif) + ' vs regional)') + '</span></div>';
      html += '<div class="graf-grid"><div class="graf-box"><div class="graf-t">Concorrentes em ' + esc(STATE.cidSel) + ' <span class="sub">' + mesSel + '/2026 · share em valor</span></div><div class="box"><div class="box-scroll"><table><thead><tr><th class="l">Produto</th><th>Valor</th><th>Share na cidade</th></tr></thead><tbody>';
      ps.forEach(function(p) {
        var sh = p.valor / c0.tot * 100;
        html += '<tr' + (p.eh ? ' class="marca"' : '') + '><td class="l">' + esc(p.produto) + (p.gen ? ' <span class="tag-conc">genérico</span>' : '') + '</td><td>' + fmtRS(p.valor) + '</td><td><div class="share-cell"><span class="share-bar"><i style="width:' + Math.min(100, sh) + '%' + (p.eh ? ';background:#2563eb' : '') + '"></i></span><b class="share-n">' + fmtPct(sh) + '</b></div></td></tr>';
      });
      html += '</tbody></table></div></div></div>';
      html += '<div class="graf-box"><div class="graf-t">Market share · ' + esc(STATE.cidSel) + ' <span class="sub">linha cheia = cidade · tracejada = regional</span></div>' + graficoLinhas(labels, [sCid, sReg], labels.map(function() { return false; })) + '</div></div>';
    }
  }

  // tabela
  var busca = (STATE.cidBusca || '').trim().toUpperCase();
  var lista = cidades.filter(function(c) { return !busca || c.cidade.indexOf(busca) >= 0; });
  STATE.sort.cidd = STATE.sort.cidd || { col: 'tot', dir: -1 };
  var sc = STATE.sort.cidd;
  lista.sort(function(a, b) {
    var x = a[sc.col], y = b[sc.col];
    if (typeof x === 'string' || typeof y === 'string') return String(x || '').localeCompare(String(y || '')) * sc.dir;
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    return (x - y) * sc.dir;
  });
  var totalLista = lista.length;
  if (STATE.cidTop && !busca) lista = lista.slice(0, STATE.cidTop);
  function th(col, txt, left) { return '<th class="sortable' + (left ? ' l' : '') + '" data-sort="cidd:' + col + '">' + txt + (sc.col === col ? (sc.dir < 0 ? ' ▼' : ' ▲') : '') + '</th>'; }
  var ultimos = meses.slice(-3);
  html += '<div class="sec-hdr">Market share por cidade <small>' + (STATE.cidTop && !busca && totalLista > lista.length ? 'as ' + lista.length + ' maiores de ' + totalLista : lista.length + ' cidades') + ' · venda a preço fábrica · cidade do ponto de venda · clique na cidade para ver os concorrentes</small></div>';
  html += '<div class="box"><div class="box-scroll"><table><thead><tr>' + th('cidade', 'Cidade', true) + th('tot', 'Mercado (R$)') + th('peso', 'Peso na regional') + th('marca', esc(marca) + ' (R$)') + th('share', 'Market share') + th('var_pp', 'Variação') + th('dif', 'vs regional') + th('posicao', 'Posição') + '<th class="l">Líder / principal concorrente</th><th>Leitura</th><th class="l">Ciclos lidos</th></tr></thead><tbody>';
  var pesoMax = ordTot[0] && ordTot[0].peso ? ordTot[0].peso : 1;
  lista.forEach(function(c) {
    var histTxt = ultimos.map(function(m) { var h = c.hist[m]; return (m === mesSel ? '<span class="sel">' : '') + m + ' <b>' + (h && h.tot ? fmtPct(h.marca / h.tot * 100) : '—') + '</b>' + (m === mesSel ? '</span>' : ''); }).join(' → ');
    html += '<tr class="clicavel' + (c.cidade === STATE.cidSel ? ' marca' : '') + '" data-cidade="' + esc(c.cidade) + '"><td class="l"><b>' + esc(c.cidade) + '</b></td>' +
      '<td>' + fmtRS(c.tot) + '</td><td><span class="peso-bar"><i style="width:' + Math.min(100, (c.peso || 0) / pesoMax * 100) + '%;background:#2563eb"></i></span>' + pct1(c.peso) + '</td>' +
      '<td>' + fmtRS(c.marca) + '</td><td><div class="share-cell"><span class="share-bar"><i style="width:' + Math.min(100, c.share || 0) + '%;background:#2563eb"></i></span><b class="share-n">' + fmtPct(c.share) + '</b></div></td>' +
      '<td>' + trend(c.var_pp, ' pp') + '</td><td>' + (c.dif === null ? '—' : '<span class="tr ' + (c.dif > 0 ? 'up' : (c.dif < 0 ? 'down' : 'flat')) + '">' + pp(c.dif) + '</span>') + '</td>' +
      '<td>' + c.posicao + 'º</td><td class="l">' + (c.lider ? esc(c.lider.produto) + ' <span class="sub">' + fmtPct(c.lider.share) + '</span>' + (c.lider.gen ? ' <span class="tag-conc">genérico</span>' : '') : '—') + '</td>' +
      '<td><span class="cid-tag ' + c.cls + '">' + ROT[c.cls] + '</span></td><td class="l cid-hist">' + histTxt + '</td></tr>';
  });
  if (!lista.length) html += '<tr><td colspan="11" class="l sub">Nenhuma cidade encontrada.</td></tr>';
  html += '</tbody></table></div></div>';
  html += '<div class="nota">Demanda = venda em R$ a preço fábrica no mercado da marca (Raio X › Demanda | Análise de Concorrentes, "Analisar por" = GDU | Cidade da UTC × Produto). A cidade aqui é a do ponto de venda, por isso não bate 1:1 com a prescrição (cidade do consultório). Market share recalculado a partir dos valores; Variação = contra o ciclo anterior lido.</div>';
  html += '</div>';
  return html;
}

function baseVista() { return STATE.vista === 'cidade' ? STATE.cid.concat(STATE.cids, STATE.cidd) : STATE.rx.concat(STATE.dem); }
function mesesDisponiveis() {
  var s = {};
  baseVista().forEach(function(r) { if (r.regional === STATE.regional && (r.linha + '|' + r.marca) === STATE.marcaKey) s[r.mes] = 1; });
  return Object.keys(s).sort(function(a, b) { return TODOS_MESES.indexOf(a) - TODOS_MESES.indexOf(b); });
}

  if (cidade) {

    rxDe('DISTRITO').forEach(function(r) { distC[r.codigo] = r.nome; });
    STATE.cids.forEach(function(r) {
      if (r.regional !== STATE.regional || r.linha !== lc || r.marca !== mc) return;

    }).join('');
    document.getElementById('btn-limpar').style.display = STATE.distrito ? '' : 'none';
    var temSetC = Object.keys(setC).length > 0;

    document.getElementById('sel-setor').innerHTML = '<option value="">Distrito inteiro</option>' + Object.keys(setC).sort().map(function(c) {

  // Representante (setor): só SPI, dentro do distrito escolhido
  var sets = {};
  if (STATE.regional === 'SPI' && STATE.distrito) {
    rxDe('SETOR').concat(demDe('SETOR')).forEach(function(r) { if (r.distrito === STATE.distrito) sets[r.codigo] = sets[r.codigo] || r.nome; });

    return '<option value="' + c + '"' + (c === STATE.setor ? ' selected' : '') + '>' + c.slice(-3) + ' · ' + esc(primeiroNome(sets[c])) + '</option>';
  }).join('');
}

function irAoTopo() { if (EMBED && window.parent !== window) window.parent.postMessage({ mercadoTopo: 1 }, location.origin); setTimeout(function() { var m = document.getElementById('main'); var hd = document.querySelector('.hdr'); window.scrollTo({ top: Math.max(0, m.offsetTop - (hd ? hd.offsetHeight : 0) - 4), behavior: 'auto' }); }, 0); }
function atualizar() { montarFiltros(); render(); avisarAltura(); }

document.addEventListener('click', function(e) {
  var t = e.target.closest('[data-mes],[data-reg],[data-setor],[data-distrito],[data-sort],[data-marca],[data-limpar],[data-vista],[data-cidtop],[data-cidade],#btn-limpar');
  if (!t) return;
  if (t.id === 'btn-limpar' || t.dataset.limpar) { STATE.distrito = ''; STATE.setor = ''; }
  else if (t.dataset.vista) { if (t.disabled) return; STATE.vista = t.dataset.vista; STATE.distrito = ''; STATE.setor = ''; STATE.cidSel = ''; }
  else if (t.dataset.cidtop !== undefined) { STATE.cidTop = parseInt(t.dataset.cidtop, 10); }
  else if (t.dataset.cidade !== undefined) { STATE.cidSel = STATE.cidSel === t.dataset.cidade ? '' : t.dataset.cidade; }
  else if (t.dataset.marca) { STATE.marcaKey = t.dataset.marca; STATE.distrito = ''; STATE.setor = ''; }
  else if (t.dataset.mes) { STATE.mes = t.dataset.mes; }
  else if (t.dataset.reg) { STATE.regional = t.dataset.reg; STATE.distrito = ''; STATE.setor = ''; }
  else if (t.dataset.setor) { STATE.distrito = t.dataset.dist; STATE.setor = t.dataset.setor; irAoTopo(); }
  else if (t.dataset.distrito) { STATE.distrito = t.dataset.distrito; STATE.setor = ''; irAoTopo(); }
  else if (t.dataset.sort) {
    var ps = t.dataset.sort.split(':'), sc = STATE.sort[ps[0]];
    if (sc && sc.col === ps[1]) sc.dir *= -1; else STATE.sort[ps[0]] = { col: ps[1], dir: -1 };
  }
  atualizar();
});
document.getElementById('sel-marca').addEventListener('change', function() { STATE.marcaKey = this.value; STATE.distrito = ''; STATE.setor = ''; atualizar(); });
document.getElementById('sel-distrito').addEventListener('change', function() { STATE.distrito = this.value; STATE.setor = ''; atualizar(); });
document.getElementById('sel-setor').addEventListener('change', function() { STATE.setor = this.value; atualizar(); });
document.getElementById('cid-busca').addEventListener('input', function() { STATE.cidBusca = this.value; STATE.cidSel = ''; render(); avisarAltura(); });

async function init() {
  var txt = document.getElementById('loading-txt');
  try {
    txt.textContent = 'Carregando configuração…';
    var res = await fetch('config.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('config.json não encontrado.');
    CONFIG = await res.json();
    if (!CONFIG.spreadsheet_id || !CONFIG.api_key) throw new Error('SPREADSHEET_ID ou API_KEY não configurados em config.json.');
    txt.textContent = 'Carregando dados de mercado…';
    var abas = await Promise.all([fetchAba('mercado_rx').catch(function() { return []; }), fetchAba('mercado_demanda').catch(function() { return []; }), fetchAba('mercado_rx_conc').catch(function() { return []; }), fetchAba('mercado_cidade').catch(function() { return []; }), fetchAba('mercado_cidade_setor').catch(function() { return []; }), fetchAba('mercado_demanda_cidade').catch(function() { return []; })]);
    STATE.rx = abas[0]; STATE.dem = abas[1]; STATE.rxc = abas[2]; STATE.cid = abas[3]; STATE.cids = abas[4]; STATE.cidd = abas[5];
    if (STATE.vista === 'cidade' && !STATE.cid.length) STATE.vista = 'gd';
    if (!STATE.rx.length && !STATE.dem.length) {
      document.getElementById('main').innerHTML = '<div class="error-card"><div class="error-title">Ainda não há dados publicados</div>' +
        '<div class="error-sub">As abas <code>mercado_rx</code> e <code>mercado_demanda</code> estão vazias. Rode <code>python scripts/ingest_mercado.py --mes MES</code>.</div></div>';
    } else {
      document.getElementById('mes-bar').style.display = '';
      document.getElementById('filtro-bar').style.display = '';
      if (DISTRITO_INICIAL) {
        var linhaIni = (DISTRITO_INICIAL.substring(0, 4) === '1163' || DISTRITO_INICIAL.substring(0, 4) === '1165') ? 'VITAL' : 'NEXUS';
        var chavesIni = {};
        STATE.rx.concat(STATE.dem).forEach(function(r) { if (r.linha === linhaIni && (!STATE.regional || r.regional === STATE.regional)) chavesIni[r.linha + '|' + r.marca] = 1; });
        var primeira = Object.keys(chavesIni).sort()[0];
        if (primeira) { STATE.marcaKey = primeira; STATE.distrito = DISTRITO_INICIAL; STATE.setor = SETOR_INICIAL; }
      }
      atualizar();
    }
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="error-card"><div class="error-title">Erro ao carregar</div><div class="error-sub">' + esc(e.message) + '</div></div>';
  }
  document.getElementById('loading').style.display = 'none';
  avisarAltura();
  if (EMBED && window.ResizeObserver) new ResizeObserver(avisarAltura).observe(document.body);
}
init();
</script>
</body>
</html>
